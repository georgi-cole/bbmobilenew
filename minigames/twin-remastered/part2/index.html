<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Find Your Twin 2: Lost Again</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #030714;
        font-family: Inter, system-ui, sans-serif;
        color: #eff7ff;
      }
      .shell {
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 14px;
        padding: 14px;
        background: radial-gradient(circle at 50% 0, #33235f, #030714 52%);
      }
      .frame {
        width: min(1120px, 100%);
        aspect-ratio: 16/9;
        position: relative;
        overflow: hidden;
        border: 2px solid #9a7bdf;
        border-radius: 18px;
        background: #071126;
        box-shadow: 0 30px 100px #000;
      }
      .frame:after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 65px #030714a8;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .banner {
        position: absolute;
        z-index: 2;
        left: 50%;
        top: 74px;
        transform: translateX(-50%);
        padding: 9px 18px;
        background: #100c27e8;
        border: 1px solid #b99cff;
        border-radius: 99px;
        color: #f3ecff;
        font-weight: 800;
        font-size: 13px;
        white-space: nowrap;
        opacity: 0;
        transition: 0.25s;
      }
      .banner.show {
        opacity: 1;
      }
      .cover {
        position: absolute;
        inset: 0;
        z-index: 4;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 25px;
        background: radial-gradient(circle at 50% 38%, #453280ca, #030614f4);
      }
      .cover[hidden] {
        display: none;
      }
      .eyebrow {
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.25em;
        color: #d8c4ff;
      }
      .cover h1 {
        margin: 12px 0;
        font-size: clamp(44px, 7vw, 80px);
        line-height: 0.9;
        letter-spacing: -0.06em;
      }
      .cover p {
        max-width: 580px;
        color: #d1c8e8;
        line-height: 1.55;
      }
      .start {
        border: 1px solid #e1d5ff;
        background: linear-gradient(135deg, #763eb1, #ac6ede);
        border-radius: 12px;
        padding: 15px 25px;
        color: white;
        font-size: 14px;
        font-weight: 900;
        cursor: pointer;
      }
      .controls {
        width: min(1120px, 100%);
        display: flex;
        justify-content: space-between;
      }
      .group {
        display: flex;
        gap: 10px;
      }
      .key {
        height: 59px;
        min-width: 70px;
        padding: 0 14px;
        border-radius: 15px;
        border: 1px solid #9979d5;
        background: #101a36;
        color: #f3ecff;
        font-weight: 900;
        touch-action: none;
      }
      .key:active {
        background: #5b3f91;
      }
      @media (max-width: 620px) {
        .shell {
          padding: 0;
          place-content: start;
          gap: 10px;
        }
        .frame {
          width: 100vw;
          border-radius: 0;
          border-width: 0 0 1px;
        }
        .controls {
          padding: 0 10px;
        }
        .key {
          min-width: 58px;
          height: 52px;
          font-size: 11px;
        }
        .banner {
          top: 55px;
          font-size: 10px;
        }
      }
    </style>
    <style>
      @media (max-width: 620px), (max-height: 760px) {
        .shell {
          min-height: 100%;
          place-content: center;
          padding: 8px;
        }
        .frame {
          width: 100%;
          max-height: calc(100dvh - 76px);
        }
        .overlay {
          padding: 12px;
        }
        .overlay h1,
        .cover h1 {
          font-size: clamp(32px, 9vw, 58px);
          margin: 7px 0;
        }
        .overlay p,
        .cover p {
          margin: 6px auto;
          font-size: 12px;
          line-height: 1.3;
        }
        .result-score {
          font-size: clamp(36px, 10vw, 54px);
        }
        .primary,
        .start {
          margin-top: 6px;
          padding: 10px 18px;
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="frame">
        <canvas id="game" width="960" height="540" tabindex="0"></canvas>
        <div class="banner" id="banner"></div>
        <section class="cover" id="intro">
          <div>
            <div class="eyebrow">FIND YOUR TWIN 2</div>
            <h1>LOST<br />AGAIN</h1>
            <p>
              Benny searches the castle for Lenny. Find the three hidden doors in order, explore the
              Housemate Gallery and Kolequant Vault, then reach Lenny beyond the great gate.
            </p>
            <button class="start" id="start">ENTER THE CASTLE</button>
          </div>
        </section>
        <section class="cover" id="end" hidden>
          <div>
            <div class="eyebrow">TOGETHER AGAIN</div>
            <h1>BENNY FOUND<br />LENNY</h1>
            <p id="score"></p>
            <button class="start" onclick="location.reload()">PLAY AGAIN</button>
          </div>
        </section>
      </section>
      <div class="controls">
        <div class="group">
          <button class="key" data-k="left">◀</button><button class="key" data-k="right">▶</button>
        </div>
        <div class="group">
          <button class="key" data-k="enter">↑ ENTER</button
          ><button class="key" data-k="jump">JUMP</button>
        </div>
      </div>
    </main>
    <script>
      const c = document.querySelector('#game'),
        x = c.getContext('2d'),
        banner = document.querySelector('#banner'),
        CW = 960,
        CH = 540,
        HUD = 66,
        G = 468,
        PW = 28,
        PH = 40
      const keys = { left: false, right: false, jump: false, enter: false }
      let player,
        doors,
        coins,
        bricks,
        enemies,
        checks,
        room,
        returnAt,
        cam,
        route,
        score,
        running,
        last,
        begun,
        noteUntil,
        gateOpen,
        reunion,
        flames
      const bg = new Image(),
        hero = new Image()
      bg.src = './assets/lost-again-castle.png'
      hero.src = './assets/benny-approved-alpha.png'
      const galleryAvatars = ['Lia', 'Ali', 'Aria', 'Dex'].map((name) => {
        const img = new Image()
        img.src = './assets/avatars/' + name + '_avatar.webp'
        return img
      })
      // The original sequel level was authored in a 450px canvas.  This preview has a
      // 540px canvas, so every level coordinate gets the same 100px floor offset.
      const FLOOR_OFFSET = 100
      const platforms = [
        [0, G, 4800, 32],
        [200, 270, 160, 16],
        [430, 228, 180, 16],
        [730, 268, 150, 16],
        [950, 248, 140, 16],
        [1150, 242, 200, 16],
        [1380, 196, 180, 16],
        [1640, 244, 160, 16],
        [1870, 268, 180, 16],
        [2080, 232, 160, 16],
        [2370, 280, 200, 16],
        [2640, 264, 180, 16],
        [2900, 276, 200, 16],
        [3140, 260, 180, 16],
        [3380, 280, 180, 16],
        [3600, 240, 200, 16],
        [3840, 268, 180, 16],
        [4060, 250, 180, 16],
        [4300, 264, 180, 16],
        [4550, 248, 230, 16],
      ].map(([X, Y, W, H]) => [X, Y === G ? Y : Y + FLOOR_OFFSET, W, H])
      const BRICK_LIFT = 32
      const doorXs = [490, 860, 1400, 1810, 2760, 3110],
        brickData = [
          [218, 196],
          [250, 196],
          [460, 154],
          [492, 154],
          [760, 196],
          [1170, 168],
          [1202, 168],
          [1410, 122],
          [1442, 122],
          [1660, 170],
          [2100, 158],
          [2132, 158],
          [2400, 206],
          [2432, 206],
          [2660, 190],
          [2692, 190],
          [2930, 202],
          [3162, 186],
          [3622, 146],
          [3654, 146],
          [4080, 156],
        ].map(([X, Y]) => [X, Y + FLOOR_OFFSET - BRICK_LIFT])
      const coinData = [
        [230, 194],
        [262, 194],
        [460, 152],
        [492, 152],
        [524, 152],
        [780, 194],
        [812, 194],
        [1190, 166],
        [1222, 166],
        [1420, 120],
        [1452, 120],
        [1484, 120],
        [1680, 168],
        [2110, 156],
        [2142, 156],
        [2410, 204],
        [2442, 204],
        [2474, 204],
        [2680, 188],
        [2712, 188],
        [2940, 200],
        [2972, 200],
        [3172, 184],
        [3204, 184],
        [3640, 144],
        [3672, 144],
        [3704, 144],
        [4100, 154],
        [4132, 154],
        [4570, 214],
        [4602, 214],
        [4634, 214],
      ].map(([X, Y]) => [X, Y + FLOOR_OFFSET - BRICK_LIFT])
      function message(t, d = 2500) {
        banner.textContent = t
        banner.classList.add('show')
        noteUntil = performance.now() + d
      }
      function reset() {
        player = {
          x: 80,
          y: G - PH,
          vx: 0,
          vy: 0,
          on: false,
          hearts: 3,
          inv: 0,
          spawn: 80,
          facing: 1,
          frozenUntil: 0,
        }
        route = 0
        score = 0
        gateOpen = false
        cam = 0
        room = null
        reunion = 0
        flames = []
        doors = doorXs.map((X, i) => ({
          x: X,
          i,
          kind: ['correct', 'bonus', 'setback', 'correct', 'ambush', 'correct'][i],
          done: false,
        }))
        coins = coinData.map(([X, Y]) => ({ x: X, y: Y, t: false }))
        bricks = brickData.map(([X, Y]) => ({ x: X, y: Y, b: false }))
        enemies = [
          [150, 330, 1],
          [560, 750, -1],
          [1180, 1360, 1],
          [1440, 1600, -1],
          [1720, 1880, 1],
          [2100, 2280, -1],
          [2440, 2620, 1],
          [2800, 2980, -1],
          [3220, 3400, 1],
          [3650, 3830, -1],
          [4130, 4310, 1],
        ].map(([a, b, v]) => ({
          x: (a + b) / 2,
          y: G - 28,
          l: a,
          r: b,
          v: v * 1.75,
          a: true,
          type: 'warden',
        }))
        checks = [1065, 2295, 3510].map((X) => ({ x: X, a: false }))
      }
      function start() {
        reset()
        running = true
        begun = last = performance.now()
        document.querySelector('#intro').hidden = true
        c.focus()
        message('Find the three hidden doors in order', 3500)
        requestAnimationFrame(loop)
      }
      document.querySelector('#start').onclick = start
      function world() {
        return room ? 800 : 4800
      }
      function ar(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y < b.y + b.h
      }
      function openFinalSanctum() {
        room = {
          kind: 'final',
          exit: -100,
          coins: [],
          enemies: [
            { x: 260, y: G - 28, l: 70, r: 720, v: 1.55, a: true, type: 'fire' },
            { x: 570, y: G - 28, l: 70, r: 720, v: -1.35, a: true, type: 'ice' },
          ],
        }
        player.x = 60
        player.y = G - PH
        player.vx = player.vy = 0
        cam = 0
        message('THE TWIN SANCTUM — defeat both wardens to reach Lenny', 4000)
      }
      function enter() {
        if (room) {
          if (room.kind === 'final') {
            message('Defeat the fire and ice wardens to reach Lenny')
            return
          }
          if (Math.abs(player.x + PW / 2 - room.exit) < 46) {
            player.x = returnAt
            player.y = G - PH
            room = null
            message('Back in the castle hall')
          } else message('Walk in front of the exit door and press ↑')
          return
        }
        if (gateOpen && Math.abs(player.x + PW / 2 - 4515) < 55) {
          openFinalSanctum()
          return
        }
        let d = doors.find((q) => Math.abs(player.x + PW / 2 - q.x) < 43)
        if (!d) {
          message('Walk in front of a door and press ↑')
          return
        }
        if (d.done) {
          message('That door has already been explored')
          return
        }
        if (d.kind === 'correct') {
          let expected = [0, 3, 5][route]
          if (d.i !== expected) {
            player.x = player.spawn
            player.y = G - PH
            message('Wrong door — back to your checkpoint')
            return
          }
          d.done = true
          route++
          score += 100
          if (route === 3) {
            gateOpen = true
            message('All doors found — the great gate opens!', 4000)
          } else message('Door ' + route + ' found — ' + route + '/3')
        } else if (d.kind === 'bonus' || d.kind === 'ambush') {
          d.done = true
          openRoom(d.kind)
        } else {
          player.x = player.spawn
          player.y = G - PH
          message('A false door sends you back')
        }
      }
      function openRoom(kind) {
        returnAt = player.x
        room = {
          kind,
          exit: 720,
          coins: (kind === 'bonus'
            ? [
                [130, 304],
                [162, 304],
                [340, 274],
                [372, 274],
                [404, 274],
                [560, 289],
                [592, 289],
                [140, 365],
                [340, 335],
                [560, 350],
              ]
            : [
                [215, 375],
                [460, 355],
                [600, 368],
              ]
          ).map(([x, y]) => ({ x, y, t: false })),
          enemies:
            kind === 'ambush'
              ? [80, 250, 420, 580, 215].map((X, i) => ({
                  x: X,
                  y: i === 4 ? 367 : G - 28,
                  l: i === 4 ? 200 : 50,
                  r: i === 4 ? 310 : 730,
                  v: i % 2 ? 1.8 : -1.8,
                  a: true,
                }))
              : [],
        }
        player.x = 40
        player.y = G - PH
        player.vx = player.vy = 0
        cam = 0
        message(
          kind === 'bonus'
            ? 'Housemate Gallery — treasures among the portraits'
            : 'Kolequant Vault — stomp guards or find the exit'
        )
      }
      function endRun(found, detail) {
        running = false
        document.querySelector('#end h1').innerHTML = found
          ? 'BENNY FOUND<br>LENNY'
          : 'THE CASTLE<br>WON'
        document.querySelector('#end .eyebrow').textContent = found
          ? 'TOGETHER AGAIN'
          : 'LOST AGAIN'
        document.querySelector('#score').textContent = score + ' PTS · ' + detail
        document.querySelector('#end').hidden = false
      }
      function hurt(cause = 'A warden caught you') {
        if (performance.now() < player.inv) return
        player.hearts--
        player.inv = performance.now() + 1200
        player.x = room ? 40 : player.spawn
        player.y = G - PH
        player.vx = player.vy = 0
        message(cause + ' — ' + player.hearts + ' hearts remain')
        if (player.hearts <= 0) endRun(false, 'The castle shadows won this run')
      }
      function update(dt) {
        if (performance.now() - begun >= 150000) {
          endRun(false, 'Time ran out before Benny reached Lenny')
          return
        }
        let s = dt / 16.67,
          frozen = performance.now() < player.frozenUntil
        player.vx = frozen ? 0 : keys.left ? -4.4 : keys.right ? 4.4 : 0
        if (player.vx) player.facing = Math.sign(player.vx)
        if (!frozen && keys.jump && player.on) {
          player.vy = -15.5
          player.on = false
        }
        keys.jump = false
        if (!frozen && keys.enter) enter()
        keys.enter = false
        let px = player.x,
          py = player.y
        player.vy = Math.min(15, player.vy + 0.58 * s)
        player.x = Math.max(0, Math.min(world() - PW, player.x + player.vx * s))
        player.y += player.vy * s
        player.on = false
        let surf = room
          ? room.kind === 'bonus'
            ? [
                [0, G, 800, 32],
                [100, 380, 130, 16],
                [310, 350, 150, 16],
                [530, 365, 130, 16],
              ]
            : room.kind === 'final'
              ? [
                  [0, G, 800, 32],
                  [190, 400, 150, 16],
                  [490, 380, 150, 16],
                ]
              : [
                  [0, G, 800, 32],
                  [200, 395, 110, 16],
                  [450, 375, 110, 16],
                ]
          : platforms
        for (let q of surf) {
          let [X, Y, W, H] = q
          if (
            player.x + PW > X &&
            player.x < X + W &&
            py + PH <= Y + 4 &&
            player.y + PH >= Y &&
            player.vy >= 0
          ) {
            player.y = Y - PH
            player.vy = 0
            player.on = true
          }
        }
        let bs = room ? [] : bricks
        for (let b of bs) {
          if (
            !b.b &&
            player.x + PW > b.x &&
            player.x < b.x + 32 &&
            player.vy < 0 &&
            player.y <= b.y + 32 &&
            py >= b.y + 28
          ) {
            b.b = true
            player.vy = 3
            score += 20
          }
        }
        let cs = room ? room.coins : coins
        for (let q of cs)
          if (!q.t && Math.abs(player.x + 14 - q.x) < 24 && Math.abs(player.y + 20 - q.y) < 28) {
            q.t = true
            score += 10
          }
        let es = room ? room.enemies : enemies
        for (let e of es)
          if (e.a) {
            e.x += e.v * s
            if (e.x < e.l) {
              e.x = e.l
              e.v = Math.abs(e.v)
            }
            if (e.x > e.r) {
              e.x = e.r
              e.v = -Math.abs(e.v)
            }
            if (
              room &&
              room.kind === 'final' &&
              (e.type === 'fire' || e.type === 'ice') &&
              Math.random() < 0.012 * s
            )
              flames.push({
                x: e.x + 13,
                y: e.y + 10,
                v: player.x < e.x ? -5.3 : 5.3,
                life: 160,
                type: e.type,
              })
            let hit =
              player.x + PW > e.x &&
              player.x < e.x + 26 &&
              player.y + PH > e.y &&
              player.y < e.y + 28
            if (hit) {
              if (player.vy > 1 && py + PH <= e.y + 8) {
                e.a = false
                player.vy = -8
                score += 50
                message(
                  e.type === 'fire'
                    ? 'Fire warden defeated!'
                    : e.type === 'ice'
                      ? 'Ice warden defeated!'
                      : 'Warden defeated!'
                )
              } else if (e.type === 'ice') {
                player.frozenUntil = performance.now() + 3000
                message('Ice warden freezes Benny for 3 seconds!')
              } else
                hurt(e.type === 'fire' ? 'Fire warden burns Benny down' : 'A warden caught you')
            }
          }
        for (let f of flames) {
          f.x += f.v * s
          f.life -= dt
          if (
            f.life > 0 &&
            player.x + PW > f.x - 8 &&
            player.x < f.x + 8 &&
            player.y + PH > f.y - 8 &&
            player.y < f.y + 8
          ) {
            f.life = 0
            if (f.type === 'ice') {
              player.frozenUntil = performance.now() + 3000
              message('Ice spell — Benny is frozen for 3 seconds!')
            } else hurt('A fire blast burns Benny down')
          }
        }
        flames = flames.filter((f) => f.life > 0)
        if (!room) {
          for (let cp of checks)
            if (!cp.a && player.x > cp.x) {
              cp.a = true
              player.spawn = cp.x + 12
              score += 25
              message('Checkpoint reached')
            }
          if (player.x > 4480) {
            player.x = 4470
            if (!gateOpen) message('The great gate is sealed — find all 3 doors first')
          }
        } else if (room.kind === 'final') {
          let guardsDown = room.enemies.every((e) => !e.a)
          if (player.x > 730 && guardsDown && !reunion) {
            reunion = performance.now()
            player.vx = 0
            message('Benny and Lenny found each other!', 2200)
          } else if (player.x > 730 && !guardsDown)
            message('Lenny is guarded — defeat the fire and ice wardens first')
        }
        if (reunion && performance.now() - reunion > 3400)
          endRun(
            true,
            Math.max(0, 150 - Math.floor((performance.now() - begun) / 1000)) + ' seconds remained'
          )
        cam = room ? 0 : Math.max(0, Math.min(4800 - CW, player.x - CW * 0.4))
      }
      function rect(X, Y, W, H, fill) {
        x.fillStyle = fill
        x.fillRect(X, Y, W, H)
      }
      function door(X, Y, exit = false) {
        x.save()
        x.translate(X, Y)
        rect(-35, -67, 70, 72, exit ? '#2d7d49' : '#3e294e')
        x.beginPath()
        x.arc(0, -62, 35, Math.PI, 0)
        x.fill()
        rect(-29, -59, 58, 64, exit ? '#3ba85b' : '#855634')
        x.fillStyle = exit ? '#3ba85b' : '#855634'
        x.beginPath()
        x.arc(0, -59, 29, Math.PI, 0)
        x.fill()
        for (let n = -18; n < 24; n += 12) {
          rect(n, -54, 2, 55, '#ffffff18')
        }
        x.fillStyle = '#f8cd55'
        x.beginPath()
        x.arc(18, -27, 3, 0, 7)
        x.fill()
        x.restore()
      }
      function person(X, Y, variant = false, facing = 1, icy = false) {
        if (hero.complete && hero.naturalWidth) {
          x.save()
          x.translate(X, 0)
          x.scale(facing, 1)
          if (icy) {
            x.filter = 'hue-rotate(155deg) saturate(.55) brightness(1.65)'
            x.globalAlpha = 0.82
          } else if (variant) x.filter = 'hue-rotate(70deg) saturate(1.25)'
          x.drawImage(hero, -27, Y - 76, 54, 80)
          x.restore()
        } else {
          rect(X - 17, Y - 47, 34, 43, icy ? '#9aeaff' : variant ? '#8e65df' : '#13b8cf')
          x.fillStyle = icy ? '#e9fcff' : '#f0ba83'
          x.beginPath()
          x.arc(X, Y - 57, 17, 0, 7)
          x.fill()
        }
      }
      function drawWindowBat(px, py, size, phase) {
        x.save()
        x.translate(px, py)
        x.scale(size, size)
        x.fillStyle = 'rgba(5,8,18,.88)'
        let flap = 0.35 + 0.22 * Math.sin(phase)
        x.beginPath()
        x.moveTo(0, 2)
        x.bezierCurveTo(-5, -2, -10, -8, -16, -4 - flap * 5)
        x.bezierCurveTo(-14, 2, -11, 7, -6, 8)
        x.lineTo(0, 4)
        x.lineTo(6, 8)
        x.bezierCurveTo(11, 7, 14, 2, 16, -4 - flap * 5)
        x.bezierCurveTo(10, -8, 5, -2, 0, 2)
        x.closePath()
        x.fill()
        x.beginPath()
        x.arc(0, 1, 3.2, 0, 7)
        x.fill()
        x.restore()
      }
      function backdrop() {
        let t = performance.now(),
          sw = 1548,
          sh = 765,
          progress = Math.max(0, Math.min(1, (cam || 0) / (4800 - CW))),
          sx = 48 + progress * 82 + Math.sin(t / 6000) * 2,
          sy = 74,
          mapX = (v) => ((v - sx) * CW) / sw,
          mapY = (v) => HUD + ((v - sy) * (CH - HUD)) / sh,
          scale = CW / sw
        x.fillStyle = '#060b18'
        x.fillRect(0, HUD, CW, CH - HUD)
        if (bg.complete && bg.naturalWidth > 0)
          x.drawImage(bg, sx, sy, sw, sh, 0, HUD, CW, CH - HUD)
        x.save()
        x.beginPath()
        for (const pane of [
          [545, 686],
          [700, 860],
          [875, 1032],
        ])
          x.rect(mapX(pane[0]), mapY(88), mapX(pane[1]) - mapX(pane[0]), mapY(505) - mapY(88))
        x.clip()
        for (let i = 0; i < 18; i++) {
          let starX = 555 + ((i * 67) % 465),
            starY = 112 + ((i * 43) % 300),
            a = 0.2 + 0.35 * (0.5 + 0.5 * Math.sin(t / 650 + i * 1.7))
          x.fillStyle = 'rgba(231,243,255,' + a + ')'
          x.beginPath()
          x.arc(mapX(starX), mapY(starY), i % 5 === 0 ? 1.35 : 0.75, 0, 7)
          x.fill()
        }
        for (let b = 0; b < 3; b++) {
          let sourceX = 555 + ((t * 0.018 + b * 185) % 505),
            sourceY = 190 + b * 62 + Math.sin(t / 530 + b * 1.9) * 18
          drawWindowBat(mapX(sourceX), mapY(sourceY), 0.55 + b * 0.08, t / 150 + b)
        }
        x.restore()
        let mx = mapX(770),
          my = mapY(170),
          pulse = 0.5 + 0.5 * Math.sin(t / 1500)
        x.save()
        x.globalCompositeOperation = 'screen'
        x.fillStyle = 'rgba(190,218,255,' + (0.025 + pulse * 0.025) + ')'
        x.beginPath()
        x.arc(mx, my, (69 + pulse * 2) * scale, 0, 7)
        x.fill()
        x.restore()
        for (const flame of [
          [18, 419, 14],
          [230, 307, 7],
          [333, 392, 6],
          [489, 420, 14],
          [1153, 420, 14],
          [1351, 404, 6],
          [1434, 337, 7],
          [1610, 420, 14],
          [214, 579, 5],
        ]) {
          let fx = mapX(flame[0]),
            fy = mapY(flame[1]),
            r = flame[2] * scale,
            flicker = 0.86 + 0.15 * Math.sin(t / 86 + flame[0])
          if (fx < -20 || fx > CW + 20 || fy < HUD || fy > CH) continue
          x.save()
          x.globalCompositeOperation = 'screen'
          x.fillStyle = 'rgba(255,143,40,.12)'
          x.beginPath()
          x.arc(fx, fy, r * 2.2 * flicker, 0, 7)
          x.fill()
          x.fillStyle = 'rgba(255,181,71,.78)'
          x.beginPath()
          x.ellipse(fx, fy - r * 0.25, r * 0.28, r * 0.78 * flicker, 0, 0, 7)
          x.fill()
          x.fillStyle = 'rgba(255,241,167,.9)'
          x.beginPath()
          x.ellipse(fx, fy, r * 0.12, r * 0.38 * flicker, 0, 0, 7)
          x.fill()
          x.restore()
        }
        x.fillStyle = 'rgba(3,7,18,.17)'
        x.fillRect(0, HUD, CW, CH - HUD)
      }
      function drawRoom() {
        let gallery = room.kind === 'bonus',
          sanctum = room.kind === 'final'
        if (sanctum) {
          let sky = x.createLinearGradient(0, HUD, 0, G)
          sky.addColorStop(0, '#0a122a')
          sky.addColorStop(1, '#2a1d39')
          rect(0, HUD, CW, G - HUD, sky)
          for (let i = 0; i < 6; i++) {
            let px = 40 + i * 165
            rect(px, 120, 105, 300, '#27334a')
            x.fillStyle = '#6f8fc4'
            x.beginPath()
            x.arc(px + 52, 170, 41, Math.PI, 0)
            x.fill()
            rect(px + 15, 170, 75, 160, '#18243a')
            x.fillStyle = '#b7d7ff'
            x.beginPath()
            x.arc(px + 52, 195, 21, 0, 7)
            x.fill()
            rect(px + 49, 215, 6, 112, '#9dc4ed')
          }
          rect(0, 410, CW, 58, '#353142')
          for (let i = 0; i < 16; i++) rect(i * 62, 436, 58, 2, '#757080')
          for (let i = 0; i < 5; i++) {
            let tx = 115 + i * 180
            x.fillStyle = '#e7a94c'
            x.beginPath()
            x.arc(tx, 285, 10, 0, 7)
            x.fill()
            rect(tx - 3, 292, 6, 110, '#77626a')
          }
          x.fillStyle = '#f6d98d'
          x.font = '900 25px system-ui'
          x.fillText('THE TWIN SANCTUM', 352, 105)
          x.fillStyle = '#bbcef0'
          x.font = '13px system-ui'
          x.fillText('THE LAST CASTLE CHAMBER', 382, 130)
          return
        }
        rect(0, HUD, CW, CH - HUD, gallery ? '#2b1725' : '#100e29')
        for (let i = 0; i < 10; i++) {
          rect(i * 100, HUD, 74, 405, gallery ? '#5a3030' : '#26204a')
          rect(i * 100 + 74, HUD, 26, 405, gallery ? '#321a2a' : '#151332')
        }
        if (gallery) {
          rect(0, 90, CW, 10, '#e4ae55')
          rect(0, 100, CW, 5, '#7a3d37')
          for (let i = 0; i < 4; i++) {
            let px = 52 + i * 212
            rect(px, 123, 126, 151, '#d9a03d')
            rect(px + 7, 130, 112, 137, '#f8e6b5')
            if (galleryAvatars[i].complete && galleryAvatars[i].naturalWidth > 0) {
              x.save()
              x.beginPath()
              x.rect(px + 13, 136, 100, 119)
              x.clip()
              x.drawImage(galleryAvatars[i], px + 13, 136, 100, 119)
              x.restore()
            } else {
              rect(px + 13, 136, 100, 119, ['#324d71', '#71506d', '#38625b', '#724344'][i])
            }
          }
          x.fillStyle = '#ffe7a6'
          x.font = '900 16px system-ui'
          x.fillText('HOUSEMATE GALLERY', 34, 86)
        } else {
          x.fillStyle = '#e7dcff'
          x.font = '900 24px system-ui'
          x.fillText('KOLEQUANT VAULT', 347, 205)
        }
      }
      function render() {
        backdrop()
        if (room) drawRoom()
        let offset = room ? 0 : cam
        let list = room
          ? room.kind === 'bonus'
            ? [
                [0, G, 800, 32],
                [100, 380, 130, 16],
                [310, 350, 150, 16],
                [530, 365, 130, 16],
              ]
            : room.kind === 'final'
              ? [
                  [0, G, 800, 32],
                  [190, 400, 150, 16],
                  [490, 380, 150, 16],
                ]
              : [
                  [0, G, 800, 32],
                  [200, 395, 110, 16],
                  [450, 375, 110, 16],
                ]
          : platforms
        for (let [X, Y, W, H] of list) {
          rect(X - offset, Y, W, H, '#28334a')
          rect(X - offset, Y, W, 5, '#91d5d0')
          rect(X - offset, Y + 5, W, H - 5, '#20293a')
          for (let j = X + 12; j < X + W; j += 35) rect(j - offset, Y + 12, 20, 2, '#101729')
        }
        if (room && room.kind !== 'final') door(room.exit, G, true)
        else if (!room) for (let d of doors) door(d.x - offset, G, d.done && d.kind === 'correct')
        for (let b of room ? [] : bricks)
          if (!b.b) {
            rect(b.x - offset, b.y, 30, 30, '#9f5a50')
            rect(b.x - offset + 3, b.y + 3, 24, 24, '#cc806b')
            rect(b.x - offset + 13, b.y + 5, 3, 20, '#70413f')
          }
        for (let q of room ? room.coins : coins)
          if (!q.t) {
            x.fillStyle = '#ffdb58'
            x.beginPath()
            x.arc(q.x - offset, q.y, 7, 0, 7)
            x.fill()
            x.strokeStyle = '#fff4a6'
            x.stroke()
          }
        for (let e of room ? room.enemies : enemies)
          if (e.a) {
            let ex = e.x - offset + 13,
              ey = e.y + 15,
              fire = e.type === 'fire',
              ice = e.type === 'ice'
            x.fillStyle = fire ? '#6d241d' : ice ? '#1d5872' : '#362355'
            x.beginPath()
            x.moveTo(ex - 14, ey + 10)
            x.lineTo(ex - 17, ey - 7)
            x.lineTo(ex - 8, ey - 4)
            x.lineTo(ex, ey - 17)
            x.lineTo(ex + 8, ey - 4)
            x.lineTo(ex + 17, ey - 7)
            x.lineTo(ex + 14, ey + 10)
            x.closePath()
            x.fill()
            x.fillStyle = fire ? '#d85a39' : ice ? '#59bde6' : '#8d65c5'
            x.beginPath()
            x.arc(ex, ey + 1, 13, 0, 7)
            x.fill()
            x.fillStyle = '#e5dbff'
            x.beginPath()
            x.arc(ex - 5, ey - 1, 4, 0, 7)
            x.arc(ex + 5, ey - 1, 4, 0, 7)
            x.fill()
            x.fillStyle = fire ? '#ffd15c' : ice ? '#d9f7ff' : '#ffcc5c'
            x.fillRect(ex - 6, ey + 7, 12, 3)
            x.fillStyle = fire ? '#ef743e' : ice ? '#8ae9ff' : '#4ee0d0'
            x.fillRect(ex - 10, ey + 13, 20, 4)
          }
        if (!room) {
          for (let cp of checks) {
            x.strokeStyle = cp.a ? '#75efc3' : '#a694dc'
            x.lineWidth = 3
            x.beginPath()
            x.moveTo(cp.x - offset, G)
            x.lineTo(cp.x - offset, G - 70)
            x.stroke()
            x.fillStyle = cp.a ? '#75efc3' : '#a694dc'
            x.beginPath()
            x.moveTo(cp.x - offset, G - 70)
            x.lineTo(cp.x - offset + 28, G - 60)
            x.lineTo(cp.x - offset, G - 48)
            x.fill()
          }
          let gx = 4515 - offset
          door(gx, G, gateOpen)
          if (!gateOpen) {
            x.strokeStyle = '#c3c7cf'
            x.lineWidth = 4
            x.beginPath()
            x.arc(gx, G - 31, 11, Math.PI, 0)
            x.stroke()
            x.fillStyle = '#ad8135'
            x.fillRect(gx - 13, G - 31, 26, 23)
            x.fillStyle = '#332515'
            x.beginPath()
            x.arc(gx, G - 20, 3, 0, 7)
            x.fill()
            x.fillRect(gx - 2, G - 20, 4, 8)
          } else {
            x.fillStyle = '#e4d8a6'
            x.font = '900 12px system-ui'
            x.fillText('↑ ENTER SANCTUM', gx - 47, G - 90)
          }
          for (let f of flames) {
            let fx = f.x - offset,
              ice = f.type === 'ice'
            x.fillStyle = ice ? '#79dcff' : '#ff5b35'
            x.beginPath()
            x.arc(fx, f.y, 8, 0, 7)
            x.fill()
            x.fillStyle = ice ? '#e8fbff' : '#ffd65a'
            x.beginPath()
            x.arc(fx - 2, f.y - 2, 4, 0, 7)
            x.fill()
          }
        }
        if (room && room.kind === 'final' && !reunion) {
          person(755, G, true, -1)
        }
        let bennyX = player.x - offset,
          lennyX = null
        if (reunion) {
          let rt = performance.now() - reunion,
            base = room && room.kind === 'final' ? 710 : 4750
          if (rt < 1600) {
            bennyX = base - offset
            lennyX = base + 32 - offset
            let bob = Math.sin(rt / 120) * 8
            person(bennyX, G + bob, false, 1)
            person(lennyX, G - bob, true, -1)
            x.fillStyle = '#ffd4f5'
            x.font = '900 26px system-ui'
            x.fillText('♥', base + 16 - offset, G - 112)
          } else {
            let leave = (rt - 1600) * 0.12
            bennyX = base - offset + leave
            lennyX = base + 32 - offset + leave
            person(bennyX, G, false, 1)
            person(lennyX, G, true, 1)
          }
        } else
          person(
            bennyX,
            player.y + PH,
            false,
            player.facing,
            performance.now() < player.frozenUntil
          )
        rect(0, 0, CW, HUD, '#070b1bdf')
        x.fillStyle = '#a995e3'
        x.font = '900 12px system-ui'
        x.fillText('SCORE', 28, 23)
        x.fillText('ROUTE', 310, 23)
        x.fillText('TIME REMAINING', 540, 23)
        x.fillText('HEARTS', 830, 23)
        x.fillStyle = '#f4efff'
        x.font = '900 25px system-ui'
        x.fillText(String(score).padStart(4, '0') + ' PTS', 28, 49)
        x.fillText(route + ' / 3', 310, 49)
        let remain = Math.max(0, 150 - Math.floor((performance.now() - begun) / 1000))
        x.fillText(
          '0' + Math.floor(remain / 60) + ':' + (remain % 60).toString().padStart(2, '0'),
          540,
          49
        )
        x.fillText(
          '♥'.repeat(Math.max(0, player.hearts)) + '♡'.repeat(Math.max(0, 3 - player.hearts)),
          830,
          49
        )
      }
      function loop(t) {
        if (!running) return
        let dt = Math.min(33, t - last)
        last = t
        update(dt)
        render()
        if (t > noteUntil) banner.classList.remove('show')
        requestAnimationFrame(loop)
      }
      document.addEventListener('keydown', (e) => {
        let k = e.code
        if (['ArrowLeft', 'KeyA'].includes(k)) keys.left = true
        if (['ArrowRight', 'KeyD'].includes(k)) keys.right = true
        if (['Space', 'KeyZ'].includes(k)) {
          keys.jump = true
          e.preventDefault()
        }
        if (['ArrowUp', 'KeyW'].includes(k)) {
          keys.enter = true
          e.preventDefault()
        }
      })
      document.addEventListener('keyup', (e) => {
        if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false
        if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false
      })
      document.querySelectorAll('[data-k]').forEach((b) => {
        let k = b.dataset.k
        b.onpointerdown = (e) => {
          e.preventDefault()
          keys[k] = true
        }
        b.onpointerup = b.onpointerleave = () => {
          if (k === 'left' || k === 'right') keys[k] = false
        }
      })
    </script>
    <script src="../bridge.js"></script>
  </body>
