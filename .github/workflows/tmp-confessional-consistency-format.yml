name: Temporary Confessional consistency formatter

on:
  push:
    branches: [agent/confessional-visual-consistency]

permissions:
  contents: write

jobs:
  format-confessional-consistency:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/confessional-visual-consistency
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Confessional consistency files
        run: >-
          npx prettier --write
          src/screens/DiaryRoom/RequiredConfessionalSession.tsx
          src/screens/DiaryRoom/RequiredConfessionalSession.css
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/screens/DiaryRoom/RequiredConfessionalSession.tsx src/screens/DiaryRoom/RequiredConfessionalSession.css
          git commit -m "Format Confessional consistency refinement"
          git push origin HEAD:agent/confessional-visual-consistency
