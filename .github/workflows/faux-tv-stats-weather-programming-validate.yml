name: Faux TV stats weather programming validation

on:
  push:
    branches: [codex/faux-tv-stats-weather-programming]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/faux-tv-stats-weather-programming
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Normalize touched files
        run: >-
          npx prettier --write
          src/App.tsx
          src/broadcasting/seasonDesk.ts
          src/broadcasting/programmingDesk.ts
          src/broadcasting/FauxTvProgrammingController.tsx
          src/weather/weatherEditorial.ts
          src/weather/WeatherController.tsx
          tests/seasonDesk.test.ts
          tests/programmingDesk.test.ts
          tests/weatherEditorial.test.ts
          tests/fauxTvProgrammingController.test.tsx
          tests/fauxTv.phase0.characterization.test.tsx
      - name: Focused Faux TV validation
        run: >-
          npx vitest run
          tests/seasonDesk.test.ts
          tests/programmingDesk.test.ts
          tests/weatherEditorial.test.ts
          tests/fauxTvProgrammingController.test.tsx
          tests/fauxTv.phase0.characterization.test.tsx
          tests/broadcastEditorialPolicy.test.ts
          tests/activityService.routing.test.ts
          --reporter=verbose
      - name: Broadcast queue parity with P0 baseline
        shell: bash
        run: |
          set +e
          npx vitest run tests/broadcastQueue.presentation.test.tsx --reporter=json --outputFile=/tmp/candidate-queue.json
          candidate_rc=$?
          git worktree add --detach /tmp/p0-base origin/codex/faux-tv-p0-editorial-contract
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/p0-base/node_modules
          cd /tmp/p0-base
          "$GITHUB_WORKSPACE/node_modules/.bin/vitest" run tests/broadcastQueue.presentation.test.tsx --reporter=json --outputFile=/tmp/p0-queue.json
          p0_rc=$?
          cd "$GITHUB_WORKSPACE"
          set -e
          CANDIDATE_RC="$candidate_rc" P0_RC="$p0_rc" python - <<'PY'
          import json
          import os
          from pathlib import Path

          def failures(path):
              data = json.loads(Path(path).read_text())
              return sorted(
                  assertion.get('fullName', assertion.get('title', ''))
                  for suite in data.get('testResults', [])
                  for assertion in suite.get('assertionResults', [])
                  if assertion.get('status') == 'failed'
              )

          candidate = failures('/tmp/candidate-queue.json')
          baseline = failures('/tmp/p0-queue.json')
          print('candidate queue failures:', candidate)
          print('P0 queue failures:', baseline)
          assert candidate == baseline, 'Queue failure set differs from P0 baseline'
          assert int(os.environ['CANDIDATE_RC']) == int(os.environ['P0_RC'])
          PY
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint:ci
      - name: Release build
        run: npm run build
      - name: Commit normalized validated changes and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/faux-tv-stats-weather-programming-validate.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Validate Faux TV stats, weather, and programming"
          git push origin HEAD:codex/faux-tv-stats-weather-programming
