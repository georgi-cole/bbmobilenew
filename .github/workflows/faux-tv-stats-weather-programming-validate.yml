name: Faux TV stats weather programming validation

on:
  push:
    branches: [codex/faux-tv-stats-weather-programming]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/faux-tv-stats-weather-programming
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Normalize touched files
        run: >-
          npx prettier --write
          src/App.tsx
          src/broadcasting/seasonDesk.ts
          src/broadcasting/programmingDesk.ts
          src/broadcasting/FauxTvProgrammingController.tsx
          src/weather/weatherEditorial.ts
          src/weather/WeatherController.tsx
          tests/seasonDesk.test.ts
          tests/programmingDesk.test.ts
          tests/weatherEditorial.test.ts
          tests/fauxTvProgrammingController.test.tsx
          tests/fauxTv.phase0.characterization.test.tsx
      - name: Focused Faux TV validation
        run: >-
          npx vitest run
          tests/seasonDesk.test.ts
          tests/programmingDesk.test.ts
          tests/weatherEditorial.test.ts
          tests/fauxTvProgrammingController.test.tsx
          tests/fauxTv.phase0.characterization.test.tsx
          tests/broadcastEditorialPolicy.test.ts
          tests/activityService.routing.test.ts
          --reporter=verbose
      - name: Broad regression parity with P0 baseline
        shell: bash
        run: |
          TEST_FILES=(
            tests/broadcastQueue.presentation.test.tsx
            src/components/ui/__tests__/TvZone.announcement.test.tsx
            src/components/ui/__tests__/TvZone.saveChip.test.tsx
            src/components/ui/__tests__/TvZone.screenStyle.test.tsx
            tests/unit/ui/TvZone.twist.test.tsx
            tests/broadcastManager.reducer.test.ts
            tests/broadcastManager.voxCatalog.test.ts
            tests/broadcastManager.architecture.test.ts
            tests/broadcastConfigPersistence.test.ts
            tests/broadcastTemplateCatalog.test.ts
            src/weather/__tests__/weatherRuntime.test.ts
            src/weather/__tests__/weatherTemperatureUnit.test.ts
            src/broadcasting/__tests__/dailyMoodSystem.test.ts
            src/onboarding/__tests__/seasonOnboardingQueue.test.ts
            src/onboarding/__tests__/seasonTutorialPreference.test.ts
            tests/specialVeto.flow.test.ts
            tests/integration/specialVeto.activation.test.tsx
            tests/integration/ceremony.fixes.test.tsx
            tests/doubleEviction.flow.test.ts
            tests/integration/jury.transition.test.tsx
            tests/integration/social.engine.test.ts
            tests/integration/social.lifecycle.test.ts
            tests/integration/social.eventdeltas.test.ts
            tests/social/socialFixes.test.ts
          )

          set +e
          npx vitest run "${TEST_FILES[@]}" --reporter=json --outputFile=/tmp/candidate-broad.json
          candidate_rc=$?

          git worktree add --detach /tmp/p0-base origin/codex/faux-tv-p0-editorial-contract
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/p0-base/node_modules
          cd /tmp/p0-base
          "$GITHUB_WORKSPACE/node_modules/.bin/vitest" run "${TEST_FILES[@]}" --reporter=json --outputFile=/tmp/p0-broad.json
          p0_rc=$?
          cd "$GITHUB_WORKSPACE"
          set -e

          CANDIDATE_RC="$candidate_rc" P0_RC="$p0_rc" python - <<'PY'
          import json
          import os
          from pathlib import Path

          def summary(path):
              data = json.loads(Path(path).read_text())
              failures = sorted(
                  assertion.get('fullName', assertion.get('title', ''))
                  for suite in data.get('testResults', [])
                  for assertion in suite.get('assertionResults', [])
                  if assertion.get('status') == 'failed'
              )
              return {
                  'failures': failures,
                  'tests': data.get('numTotalTests'),
                  'passed': data.get('numPassedTests'),
                  'failed': data.get('numFailedTests'),
                  'suites': data.get('numTotalTestSuites'),
              }

          candidate = summary('/tmp/candidate-broad.json')
          baseline = summary('/tmp/p0-broad.json')
          print('candidate broad summary:', candidate)
          print('P0 broad summary:', baseline)
          assert candidate['failures'] == baseline['failures'], 'Broad failure set differs from P0 baseline'
          assert int(os.environ['CANDIDATE_RC']) == int(os.environ['P0_RC']), 'Broad exit code differs from P0 baseline'
          PY
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint:ci
      - name: Release build
        run: npm run build
      - name: Confirm normal CI workflow untouched
        shell: bash
        run: git diff --exit-code origin/codex/faux-tv-p0-editorial-contract -- .github/workflows/ci.yml
      - name: Commit normalized validated changes and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/faux-tv-stats-weather-programming-validate.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Validate Faux TV stats, weather, and programming"
          git push origin HEAD:codex/faux-tv-stats-weather-programming
