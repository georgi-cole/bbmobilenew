name: Pull Request Mobile Browser Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pr-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-journeys:
    name: Core journeys (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [mobile-chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real player core journeys without retries
        run: npx playwright test --grep @core-journey --project=${{ matrix.project }} --workers=1
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
