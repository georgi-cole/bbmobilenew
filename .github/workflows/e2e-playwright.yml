name: Pull Request Mobile Browser Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pr-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-journeys:
    name: Core journeys (${{ matrix.project }})
    if: github.head_ref != 'agent/gameplay-polish-1230-1250' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [mobile-chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real player core journeys without retries
        run: npx playwright test --grep @core-journey --project=${{ matrix.project }}
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  repair-finale-core-journey:
    name: Repair finale core journey expectation
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/gameplay-polish-1230-1250' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/gameplay-polish-1230-1250
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update finale parity expectation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('e2e/playwright/finale.spec.ts')
          text = path.read_text(encoding='utf-8')

          old_comment = """    // Fixture-only setup: retain exactly two active finalists, seven real
              // Tribunal members, and valid pre-jury evictees before entering the finale.
          """
          new_comment = """    // Fixture-only setup: retain exactly two active finalists, seven initial
              // Tribunal members, and eligible pre-jury evictees. Public-mode parity then
              // promotes the most-recent eligible pre-jury player as the eighth regular vote.
          """
          if old_comment not in text:
              raise RuntimeError('Could not locate the finale roster setup comment')
          text = text.replace(old_comment, new_comment, 1)

          old_anchor = """    expect(
              fixtureState.game.players
                .filter((player) => player.status === 'evicted')
                .map((player) => player.id)
                .sort()
            ).toEqual(roster.preJury.map((player) => player.id).sort())

            await page.getByRole('button', { name: '→ Force jury' }).click()
          """
          new_anchor = """    expect(
              fixtureState.game.players
                .filter((player) => player.status === 'evicted')
                .map((player) => player.id)
                .sort()
            ).toEqual(roster.preJury.map((player) => player.id).sort())

            const promotedJuror = roster.preJury.at(-1)
            if (!promotedJuror) throw new Error('finale parity fixture needs an eligible pre-jury player')
            const expectedRegularJurorIds = [
              ...roster.jurors.map((player) => player.id),
              promotedJuror.id,
            ].sort()

            await page.getByRole('button', { name: '→ Force jury' }).click()
          """
          if old_anchor not in text:
              raise RuntimeError('Could not locate the finale pre-jury assertion')
          text = text.replace(old_anchor, new_anchor, 1)

          old_poll = """        return {
                    finalists: [...state.finale.finalistIds].sort(),
                    jurors: state.finale.jurorIds.filter((id) => id !== '__public__').sort(),
                  }
                })
                .toEqual({
                  finalists: roster.finalists.map((player) => player.id).sort(),
                  jurors: roster.jurors.map((player) => player.id).sort(),
                })
          """
          new_poll = """        return {
                    finalists: [...state.finale.finalistIds].sort(),
                    jurors: state.finale.jurorIds.filter((id) => id !== '__public__').sort(),
                    publicJurorEnabled: state.finale.publicJurorEnabled,
                    publicVoteWeight: state.finale.publicVoteWeight,
                  }
                })
                .toEqual({
                  finalists: roster.finalists.map((player) => player.id).sort(),
                  jurors: expectedRegularJurorIds,
                  publicJurorEnabled: true,
                  publicVoteWeight: 1,
                })
          """
          if old_poll not in text:
              raise RuntimeError('Could not locate the finale Tribunal expectation')
          text = text.replace(old_poll, new_poll, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - run: npm ci
      - run: npx prettier --write e2e/playwright/finale.spec.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real player core journeys without retries
        run: npx playwright test --grep @core-journey --project=mobile-chromium
      - name: Commit corrected journey
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/e2e-playwright.yml
          git add e2e/playwright/finale.spec.ts .github/workflows/e2e-playwright.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: align finale journey with Tribunal parity"
          git push origin HEAD:agent/gameplay-polish-1230-1250
