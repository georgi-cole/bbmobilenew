name: Apply Fit Me In avatar fix

on:
  push:
    branches:
      - fix/fit-me-in-avatar-thumbnails

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fit-me-in-avatar-thumbnails
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Integrate resolved avatar images into Fit Me In
        run: python scripts/apply-fit-me-in-avatar-fix.py
      - name: Format changed files
        run: |
          npx prettier --write \
            src/components/TetrisComp/TetrisComp.tsx \
            src/components/ResolvedAvatarImage/ResolvedAvatarImage.tsx \
            tests/unit/resolvedAvatarImage.test.tsx
      - name: Run focused avatar tests
        run: npx vitest run tests/unit/resolvedAvatarImage.test.tsx
      - name: Type check
        run: npm run typecheck
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/components/TetrisComp/TetrisComp.tsx \
            src/components/ResolvedAvatarImage/ResolvedAvatarImage.tsx \
            tests/unit/resolvedAvatarImage.test.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Resolve Fit Me In houseguest thumbnails"
          git push
