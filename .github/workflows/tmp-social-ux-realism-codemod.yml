name: Temporary Social UX realism codemod

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/social-ux-realism-regressions' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/social-ux-realism-regressions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply validation follow-up
        id: followup
        shell: bash
        run: |
          mkdir -p docs
          set +e
          python3 scripts/tmp-social-ux-followup.py > docs/.social-ux-followup.txt 2>&1
          status=$?
          set -e
          if (( status == 0 )); then
            rm -f docs/.social-ux-followup.txt
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            printf '\nFOLLOWUP_EXIT_CODE=%s\n' "$status" >> docs/.social-ux-followup.txt
            git reset --hard HEAD
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Format every changed file
        if: steps.followup.outputs.ok == 'true'
        shell: bash
        run: |
          git fetch origin main --depth=1
          mapfile -t files < <(
            {
              git diff --name-only origin/main...HEAD
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u | grep -E '\.(ts|tsx|css|json|mjs|yml|yaml)$' || true
          )
          if (( ${#files[@]} > 0 )); then
            npx prettier --write "${files[@]}"
          fi
      - name: Capture targeted test diagnostics
        if: steps.followup.outputs.ok == 'true'
        shell: bash
        run: |
          set +e
          npx vitest run \
            src/components/IncomingInteractionsInbox/__tests__/IncomingInteractionsInbox.test.tsx \
            src/components/HousePulse/__tests__/HousePulse.test.tsx \
            src/social/__tests__/socialPremiumHardening.test.ts \
            src/social/__tests__/socialLivelinessRestoration.test.ts \
            tests/social/socialCommitments.unit.test.ts \
            src/publicOpinion/__tests__/AudiencePulseService.test.ts \
            tests/unit/publicOpinion/publicOpinionMiddleware.test.ts \
            > docs/.social-ux-tests.txt 2>&1
          status=$?
          set -e
          if (( status == 0 )); then
            rm -f docs/.social-ux-tests.txt
          else
            printf '\nTEST_EXIT_CODE=%s\n' "$status" >> docs/.social-ux-tests.txt
          fi
      - name: Capture static diagnostics
        if: steps.followup.outputs.ok == 'true'
        shell: bash
        run: |
          set +e
          {
            npm run typecheck
            npm run lint:ci
            npm run format:check
          } > docs/.social-ux-static.txt 2>&1
          status=$?
          set -e
          if (( status == 0 )); then
            rm -f docs/.social-ux-static.txt
          else
            printf '\nSTATIC_EXIT_CODE=%s\n' "$status" >> docs/.social-ux-static.txt
          fi
      - name: Commit implementation or diagnostics
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests server docs
          git commit -m "Resolve Social UX validation issues"
          git push origin HEAD:fix/social-ux-realism-regressions
