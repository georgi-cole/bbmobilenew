name: Temporary Social UX realism codemod

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/social-ux-realism-regressions' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/social-ux-realism-regressions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply focused Social corrections
        run: node scripts/tmp-social-ux-realism-codemod.mjs
      - name: Format changed production and test files
        shell: bash
        run: |
          git fetch origin main --depth=1
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' '*.css' '*.json' '*.mjs' '*.yml' '*.yaml')
          if (( ${#files[@]} > 0 )); then
            npx prettier --write "${files[@]}"
          fi
      - name: Targeted Social and public-opinion tests
        run: >-
          npx vitest run
          src/components/IncomingInteractionsInbox/__tests__/IncomingInteractionsInbox.test.tsx
          src/components/HousePulse/__tests__/HousePulse.test.tsx
          src/social/__tests__/socialPremiumHardening.test.ts
          src/social/__tests__/socialLivelinessRestoration.test.ts
          tests/social/socialCommitments.unit.test.ts
          src/publicOpinion/__tests__/AudiencePulseService.test.ts
          tests/unit/publicOpinion/publicOpinionMiddleware.test.ts
      - name: Static validation
        run: |
          npm run typecheck
          npm run lint:ci
          npm run format:check
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests server
          git commit -m "Fix Social UX, role logic, and audience simulation"
          git push origin HEAD:fix/social-ux-realism-regressions
