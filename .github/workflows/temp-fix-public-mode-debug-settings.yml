name: Temporary Public Mode debug settings fix

on:
  push:
    branches:
      - agent/fix-public-mode-settings-debug-access

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-public-mode-settings-debug-access
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply Public Mode debug-access fix and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          settings_path = Path('src/screens/Settings/Settings.tsx')
          settings = settings_path.read_text(encoding='utf-8')
          old = """            : item.id === 'publicMode'
              ? hasPublicMode
"""
          new = """            : item.id === 'publicMode'
              ? hasPublicMode || settings.sim.publicMode
"""
          if old not in settings:
              raise SystemExit('Expected Public Mode access gate was not found')
          settings_path.write_text(settings.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/settings.screen.test.tsx')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace(
              "import settingsReducer, { setGameUX } from '../src/store/settingsSlice'",
              "import settingsReducer, { setGameUX, setSim } from '../src/store/settingsSlice'",
              1,
          )
          tests = tests.replace(
              """  dramaModeOwned = false,
  dramaModeActive = false
) {
""",
              """  dramaModeOwned = false,
  dramaModeActive = false,
  publicModeActive = false
) {
""",
              1,
          )
          tests = tests.replace(
              """  if (dramaModeActive) store.dispatch(setGameUX({ dramaMode: true }))
  render(
""",
              """  if (dramaModeActive) store.dispatch(setGameUX({ dramaMode: true }))
  if (publicModeActive) store.dispatch(setSim({ publicMode: true }))
  render(
""",
              1,
          )
          marker = """  it('allows a standalone Public Mode owner to change Public Mode without VIP', () => {
    const { store } = renderSettings(['/settings'], false, true)
    const publicModeToggle = screen.getByLabelText(/toggle public mode/i)

    fireEvent.click(publicModeToggle)

    expect(store.getState().settings.sim.publicMode).toBe(true)
    expect(screen.queryByRole('dialog')).toBeNull()
  })

"""
          addition = marker + """  it('shows and allows disabling Public Mode when debug settings enabled it', () => {
    const { store } = renderSettings(
      ['/settings'],
      false,
      false,
      false,
      false,
      false,
      true
    )
    const publicModeToggle = screen.getByLabelText(/toggle public mode/i) as HTMLInputElement

    expect(publicModeToggle.checked).toBe(true)
    fireEvent.click(publicModeToggle)

    expect(store.getState().settings.sim.publicMode).toBe(false)
    expect(screen.queryByRole('dialog')).toBeNull()
  })

"""
          if marker not in tests:
              raise SystemExit('Expected Public Mode test insertion point was not found')
          test_path.write_text(tests.replace(marker, addition, 1), encoding='utf-8')
          PY
      - name: Format changed files
        run: npx prettier --write src/screens/Settings/Settings.tsx tests/settings.screen.test.tsx
      - name: Run focused Settings tests
        run: npx vitest run tests/settings.screen.test.tsx
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/Settings/Settings.tsx tests/settings.screen.test.tsx
          git commit -m "Honor debug-enabled Public Mode in Settings"
          git push
