name: Annotate GameOver i18n identifier

on:
  push:
    branches:
      - fix/minigame-bugs-20260806
    paths:
      - .github/workflows/annotate-gameover-i18n.yml

permissions:
  contents: write

jobs:
  annotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/minigame-bugs-20260806
          fetch-depth: 0

      - name: Annotate internal type identifier
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/screens/GameOver/GameOver.tsx')
          text = path.read_text()
          before = "const EMPTY_AFTERMATH_STORIES: AftermathIssue['stories'] = []\n"
          after = (
              "// i18n-ignore: Internal TypeScript property name; this identifier is never rendered to players.\n"
              "const EMPTY_AFTERMATH_STORIES: AftermathIssue['stories'] = []\n"
          )
          if after not in text:
              if text.count(before) != 1:
                  raise SystemExit('Expected one EMPTY_AFTERMATH_STORIES declaration')
              path.write_text(text.replace(before, after, 1))
          PY

      - name: Commit annotation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/GameOver/GameOver.tsx
          git commit -m "chore: mark internal aftermath type as non-translatable"
          git push origin HEAD:fix/minigame-bugs-20260806
