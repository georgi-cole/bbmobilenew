name: Temporary Incoming Interactions copy adjustment

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  adjust-copy:
    if: github.head_ref == 'fix/incoming-interactions-encoding-layout' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/incoming-interactions-encoding-layout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preserve existing pending summary separator
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/IncomingInteractionsInbox/IncomingInteractionsInbox.tsx')
          source = path.read_text(encoding='utf-8')
          old = "urgentCount > 0 ? ` · ${urgentCount} urgent` : ''"
          new = "urgentCount > 0 ? ` • ${urgentCount} urgent` : ''"
          if old not in source:
              raise SystemExit('Expected pending summary copy was not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          npx prettier --write src/components/IncomingInteractionsInbox/IncomingInteractionsInbox.tsx
      - name: Commit adjustment
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/IncomingInteractionsInbox/IncomingInteractionsInbox.tsx
          git commit -m "Preserve incoming interaction summary copy"
          git push origin HEAD:fix/incoming-interactions-encoding-layout
