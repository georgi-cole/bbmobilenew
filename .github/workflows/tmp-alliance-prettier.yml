name: Temporary Alliance Prettier Diff

on:
  push:
    branches:
      - codex/alliance-interactions-v2

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff
        run: |
          npx prettier --write src/social/__tests__/realityCeremonies.test.ts src/social/reality/relationshipForms.ts
          git diff -- src/social/__tests__/realityCeremonies.test.ts src/social/reality/relationshipForms.ts
