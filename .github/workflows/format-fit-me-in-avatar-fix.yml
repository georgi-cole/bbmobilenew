name: Format Fit Me In avatar resolver

on:
  push:
    branches:
      - fix/fit-me-in-avatar-thumbnails

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fit-me-in-avatar-thumbnails
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/ResolvedAvatarImage/ResolvedAvatarImage.tsx
      - run: npx vitest run tests/unit/resolvedAvatarImage.test.tsx
      - run: npm run lint:ci
      - run: npm run typecheck
      - name: Commit formatted resolver
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/ResolvedAvatarImage/ResolvedAvatarImage.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format Fit Me In avatar resolver"
          git push
