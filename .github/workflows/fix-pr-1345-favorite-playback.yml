name: Fix PR 1345 favorite playback

on:
  push:
    branches:
      - fix/prod-debug-and-multimode-saves

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prod-debug-and-multimode-saves
          fetch-depth: 0

      - name: Update finale journey for current UI
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('e2e/playwright/finale.spec.ts')
          text = path.read_text()

          favorite_old = """    await expect(favoriteVote).toBeVisible({ timeout: 15_000 })
    const favoriteVoteButtons = favoriteVote.getByRole('button', { name: /Vote for/ })
    if ((await favoriteVoteButtons.count()) > 0) {
      await favoriteVoteButtons.first().click()
    }
    const favoriteContinue = favoriteVote.getByRole('button', { name: /Continue/ })
    await expect(favoriteContinue).toBeVisible({ timeout: 15_000 })
    await favoriteContinue.click()
"""
          favorite_new = """    await expect(favoriteVote).toBeVisible({ timeout: 15_000 })
    const favoriteFastForward = favoriteVote.getByRole('button', {
      name: 'Fast forward public favorite vote',
    })
    if (await favoriteFastForward.isVisible()) {
      await favoriteFastForward.click()
    }
    const favoriteVoteButtons = favoriteVote.getByRole('button', { name: /Vote for/ })
    if ((await favoriteVoteButtons.count()) > 0) {
      await favoriteVoteButtons.first().click()
    }
    const favoriteContinue = favoriteVote.getByRole('button', { name: /Continue/ })
    await expect(favoriteContinue).toBeVisible({ timeout: 30_000 })
    await favoriteContinue.click()
"""
          if favorite_old in text:
              text = text.replace(favorite_old, favorite_new, 1)
          elif favorite_new not in text:
              raise SystemExit('favorite playback block not found')

          text = text.replace(
              "      seasonFinalePhase: 'finalGoodbye',\n",
              "      seasonFinalePhase: 'goodbyeSequence',\n",
              1,
          )

          gameover_old = """    const championBlock = page.getByTestId('season-champion')
    const runnerUpBlock = page.getByTestId('season-runner-up')
    await expect(championBlock).toContainText(winner.name)
    await expect(runnerUpBlock).toContainText(runnerUp.name)

    const completedState = await readAppState(page)
    expect(completedState.game.seasonFinale?.phase).toBe('seasonComplete')
    expect(eventCount(completedState, 'favoritePlayer:award')).toBe(1)

    await page.reload()
    await expect(page).toHaveURL(/#\\/game-over$/)
    const archived = await readArchive(page)
"""
          gameover_new = """    await expect(page.getByText('Season champion', { exact: true })).toBeVisible()
    await expect(page.getByText(winner.name, { exact: true }).first()).toBeVisible()
    await expect(page.getByText('Runner-up', { exact: true })).toBeVisible()
    await expect(page.getByText(runnerUp.name, { exact: true }).first()).toBeVisible()

    const completedState = await readAppState(page)
    expect(completedState.game.seasonFinale?.phase).toBe('seasonComplete')
    expect(eventCount(completedState, 'favoritePlayer:award')).toBe(1)

    await page
      .getByRole('main')
      .getByRole('button', { name: 'Home', exact: true })
      .click()
    await waitForHome(page)
    const archived = await readArchive(page)
"""
          if gameover_old in text:
              text = text.replace(gameover_old, gameover_new, 1)
          elif gameover_new not in text:
              raise SystemExit('game-over assertion block not found')

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate source checks
        run: |
          npx prettier --write e2e/playwright/finale.spec.ts
          npm run lint:ci
          npm run format:check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused finale journey
        run: npx playwright test e2e/playwright/finale.spec.ts --project=mobile-chromium --workers=1

      - name: Commit validated fix and remove temporary workflow
        run: |
          git rm .github/workflows/fix-pr-1345-favorite-playback.yml
          git add e2e/playwright/finale.spec.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test: stabilize current finale journey"
          git push origin HEAD:fix/prod-debug-and-multimode-saves
