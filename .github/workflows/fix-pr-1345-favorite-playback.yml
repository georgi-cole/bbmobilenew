name: Fix PR 1345 favorite playback

on: [push]

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/fix/prod-debug-and-multimode-saves'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prod-debug-and-multimode-saves
          fetch-depth: 0

      - name: Update finale journey for current UI
        run: |
          echo '' | base64 --decode | python

      - name: Install dependencies
        run: npm ci

      - name: Validate source checks
        run: |
          npx prettier --write e2e/playwright/finale.spec.ts
          npm run lint:ci
          npm run format:check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused finale journey
        run: npx playwright test e2e/playwright/finale.spec.ts --project=mobile-chromium --workers=1

      - name: Upload focused failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: focused-finale-failure
          path: test-results
          retention-days: 7

      - name: Commit validated fix and remove temporary workflow
        run: |
          git rm .github/workflows/fix-pr-1345-favorite-playback.yml
          git add e2e/playwright/finale.spec.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test: stabilize current finale journey"
          git push origin HEAD:fix/prod-debug-and-multimode-saves
