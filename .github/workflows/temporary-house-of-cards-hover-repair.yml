name: Temporary House of Cards hover repair

on:
  push:
    branches:
      - agent/fix-house-of-cards-face-up-hover

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-house-of-cards-face-up-hover
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restrict card hover effects to face-down cards
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('src/components/HouseOfCardsComp/HouseOfCardsComp.css')
          source = css_path.read_text()
          old_hover = """.hoc-card:not(:disabled):hover .hoc-card-inner,
          .hoc-card:not(:disabled):focus-visible .hoc-card-inner {
            translate: 0 -3px;
            filter: brightness(1.08);
          }

          .hoc-card:active:not(:disabled) .hoc-card-inner {
            translate: 0 -1px;
            scale: 0.985;
          }
          """
          new_hover = """.hoc-card[data-flipped='false'][data-matched='false']:not(:disabled):hover .hoc-card-inner,
          .hoc-card[data-flipped='false'][data-matched='false']:not(:disabled):focus-visible .hoc-card-inner {
            translate: 0 -3px;
          }

          .hoc-card[data-flipped='false'][data-matched='false']:active:not(:disabled) .hoc-card-inner {
            translate: 0 -1px;
            scale: 0.985;
          }
          """
          if old_hover not in source:
              raise SystemExit('Expected broad House of Cards hover block was not found')
          css_path.write_text(source.replace(old_hover, new_hover, 1))

          test_path = Path('tests/unit/house-of-cards/HouseOfCardsComp.interactionHotfix.styles.test.ts')
          test_source = test_path.read_text()
          anchor = """  it('keeps face-up cards rotated while hovered or focused', () => {
            expect(css).toContain(\".hoc-card[data-flipped='true']:hover .hoc-card-inner\")
            expect(css).toContain('transform: rotateY(180deg)')
            expect(css).toContain('filter: none')
          })
          """
          replacement = anchor + """

          it('limits component hover motion to face-down cards', () => {
            const componentCss = fs.readFileSync(
              path.resolve(process.cwd(), 'src/components/HouseOfCardsComp/HouseOfCardsComp.css'),
              'utf8'
            )
            expect(componentCss).toContain(\".hoc-card[data-flipped='false'][data-matched='false']\")
            expect(componentCss).not.toContain('.hoc-card:not(:disabled):hover .hoc-card-inner')
          })
          """
          if anchor not in test_source:
              raise SystemExit('Expected House of Cards style test anchor was not found')
          test_path.write_text(test_source.replace(anchor, replacement, 1))
          PY
      - name: Format changed files
        run: |
          npx prettier --write \
            src/components/HouseOfCardsComp/HouseOfCardsComp.css \
            tests/unit/house-of-cards/HouseOfCardsComp.interactionHotfix.styles.test.ts
      - name: Remove temporary workflow
        run: rm .github/workflows/temporary-house-of-cards-hover-repair.yml
      - name: Validate focused test
        run: npx vitest run tests/unit/house-of-cards/HouseOfCardsComp.interactionHotfix.styles.test.ts
      - name: Validate lint and formatting
        run: |
          npm run lint:ci
          npm run format:check
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix House of Cards face-up hover rendering"
          git push origin HEAD:agent/fix-house-of-cards-face-up-hover
