name: Drama Public Save Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'agent/drama-public-save'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/drama-public-save
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture validation reports
        shell: bash
        run: |
          set +e
          npm run lint > /tmp/lint-report.txt 2>&1
          echo $? > /tmp/lint-exit.txt
          npm run typecheck > /tmp/typecheck-report.txt 2>&1
          echo $? > /tmp/typecheck-exit.txt
          npm run build > /tmp/build-report.txt 2>&1
          echo $? > /tmp/build-exit.txt
          npx vitest run \
            src/components/PublicSaveReveal/__tests__/PublicSaveReveal.test.tsx \
            src/components/AudienceVerdictReveal/__tests__/AudienceVerdictReveal.test.tsx \
            tests/unit/publicOpinion/publicSaveVoteShares.test.ts \
            > /tmp/test-report.txt 2>&1
          echo $? > /tmp/test-exit.txt
          set -e

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: drama-public-save-validation
          path: |
            /tmp/lint-report.txt
            /tmp/lint-exit.txt
            /tmp/typecheck-report.txt
            /tmp/typecheck-exit.txt
            /tmp/build-report.txt
            /tmp/build-exit.txt
            /tmp/test-report.txt
            /tmp/test-exit.txt
          if-no-files-found: error

      - name: Remove validation workflow
        shell: bash
        run: |
          rm -f .github/workflows/agent-drama-public-save-validation.yml
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/agent-drama-public-save-validation.yml
          git commit -m "Remove one-shot Drama public save validation"
          git push origin HEAD:agent/drama-public-save
