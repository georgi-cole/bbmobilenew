name: Apply Avatar WebP Optimization

on:
  push:
    branches:
      - fix/avatar-preload-stability
    paths:
      - .github/workflows/avatar-webp-benchmark.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/avatar-preload-stability

      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Encode verified q95 portraits
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(public/assets/skins/*_sad_avatar.png)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No sad avatar PNGs found' >&2
            exit 1
          fi

          before=0
          after=0
          for source in "${files[@]}"; do
            target="${source%.png}.webp"
            cwebp -quiet -q 95 -m 6 -alpha_q 100 -metadata all "$source" -o "$target"
            before=$((before + $(stat -c%s "$source")))
            after=$((after + $(stat -c%s "$target")))
          done

          echo "Portraits: ${#files[@]}"
          echo "PNG bytes: $before"
          echo "WebP bytes: $after"
          test "$after" -lt "$before"

      - name: Prefer WebP while retaining PNG fallback
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/features/twists/depressionShock.ts')
          text = path.read_text()
          old = """    `${prefix}assets/skins/${stem}_sad_avatar.png`,
              `${prefix}assets/skins/${stem}_sad_avatar.webp`,
          """
          new = """    `${prefix}assets/skins/${stem}_sad_avatar.webp`,
              `${prefix}assets/skins/${stem}_sad_avatar.png`,
          """
          if text.count(old) != 1:
              raise SystemExit('Expected Depression Shock candidate block exactly once')
          path.write_text(text.replace(old, new))

      - name: Commit optimized assets and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/avatar-webp-benchmark.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: optimize Depression Shock portraits'
          git push origin HEAD:fix/avatar-preload-stability
