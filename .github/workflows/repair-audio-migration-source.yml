name: Repair audio migration source

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-audio-migration-source
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audio-auto-index-migration
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair committed migration source
        shell: python
        run: |
          from pathlib import Path

          migration = Path('scripts/migrate-audio-assets.mjs')
          text = migration.read_text()
          text = text.replace(r'\\`', r'\`').replace(r'\\${', r'\${')
          migration.write_text(text)

          finalizer = Path('.github/workflows/audio-auto-index-finalize.yml')
          workflow = finalizer.read_text()
          workflow = workflow.replace("    if: github.actor != 'github-actions[bot]'\n", '')
          finalizer.write_text(workflow)

      - name: Validate and format repair
        run: |
          node --check scripts/migrate-audio-assets.mjs
          npx prettier --write scripts/migrate-audio-assets.mjs .github/workflows/audio-auto-index-finalize.yml
          npm run lint:ci

      - name: Commit repair and enable finalizer
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-audio-migration-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/migrate-audio-assets.mjs .github/workflows/audio-auto-index-finalize.yml
          git commit -m 'Repair audio migration source and enable finalizer'
          git push origin HEAD:refs/heads/agent/audio-auto-index-migration
