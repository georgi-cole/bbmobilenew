name: Temporary formatter artifact

on:
  push:
    branches:
      - fix/final-four-finale-assets-morning-shock

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: |
          npx prettier --write \
            src/components/DayStartShockPopup/DayStartShockPopup.css \
            src/components/DayStartShockPopup/DayStartShockPopup.test.ts \
            src/components/DayStartShockPopup/DayStartShockPopup.tsx \
            src/data/avatarAssetManifest.ts \
            src/main.tsx \
            src/store/__tests__/selectors.final4.test.ts \
            src/store/selectors.ts \
            src/styles/gameOverResponsiveFixes.css
      - name: Package formatted files
        run: |
          mkdir -p formatted/src/components/DayStartShockPopup formatted/src/data formatted/src/store/__tests__ formatted/src/styles formatted/src
          cp src/components/DayStartShockPopup/DayStartShockPopup.css formatted/src/components/DayStartShockPopup/
          cp src/components/DayStartShockPopup/DayStartShockPopup.test.ts formatted/src/components/DayStartShockPopup/
          cp src/components/DayStartShockPopup/DayStartShockPopup.tsx formatted/src/components/DayStartShockPopup/
          cp src/data/avatarAssetManifest.ts formatted/src/data/
          cp src/main.tsx formatted/src/
          cp src/store/__tests__/selectors.final4.test.ts formatted/src/store/__tests__/
          cp src/store/selectors.ts formatted/src/store/
          cp src/styles/gameOverResponsiveFixes.css formatted/src/styles/
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-files
          path: formatted
