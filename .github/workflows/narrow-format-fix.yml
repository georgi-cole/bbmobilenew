name: Narrow legacy formatting fix

on:
  push:
    branches:
      - fix/minigame-bugs-20260806
    paths:
      - .github/workflows/narrow-format-fix.yml

permissions:
  contents: write

jobs:
  restore-legacy-files:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/minigame-bugs-20260806
          fetch-depth: 0

      - name: Restore pre-format legacy files
        run: |
          git checkout 193f8f76a7744050ce6e7ad9f76cc2669086a114 -- \
            src/components/TiltLabyrinthComp/TiltLabyrinthComp.tsx \
            src/screens/GameOver/GameOver.tsx \
            tests/unit/chain-of-greed/ChainOfGreed.component.test.tsx

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify changed-file formatting
        run: npm run format:check

      - name: Commit narrowed formatting diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/TiltLabyrinthComp/TiltLabyrinthComp.tsx \
            src/screens/GameOver/GameOver.tsx \
            tests/unit/chain-of-greed/ChainOfGreed.component.test.tsx
          if git diff --cached --quiet; then
            echo "No legacy formatting changes to restore."
            exit 0
          fi
          git commit -m "style: keep legacy files minimally formatted"
          git push origin HEAD:fix/minigame-bugs-20260806
