name: Music Manager validation cleanup

on:
  push:
    branches:
      - agent/music-manager-runtime-ui
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: music-manager-validation-cleanup
  cancel-in-progress: false

jobs:
  clean-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/music-manager-runtime-ui
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format every PR-changed supported file
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR origin/main...HEAD \
              | grep -E '\.(ts|tsx|js|jsx|mjs|cjs|json|css|scss|md|yml|yaml)$' \
              || true
          )
          if ((${#files[@]} > 0)); then
            npx prettier --write "${files[@]}"
          fi

      - name: Apply safe ESLint fixes
        run: npx eslint . --fix

      - name: Validate lint and capture readable diagnostics
        id: lint
        shell: bash
        run: |
          set +e
          npm run lint:ci > /tmp/music-manager-lint.log 2>&1
          status=$?
          cat /tmp/music-manager-lint.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/music-manager-lint.log MUSIC_MANAGER_LINT_DIAGNOSTIC.txt
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Commit diagnostic when lint remains unresolved
        if: steps.lint.outputs.failed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Music Manager formatting and capture lint diagnostics"
          git push origin HEAD:refs/heads/agent/music-manager-runtime-ui

      - name: Stop after lint diagnostic
        if: steps.lint.outputs.failed == 'true'
        run: exit 1

      - name: Typecheck
        run: npm run typecheck

      - name: Run focused sound regressions
        run: |
          npx vitest run \
            tests/unit/sound/queue.test.ts \
            tests/unit/sound/soundMiddleware.test.ts \
            tests/unit/sound/musicConfigAudit.test.ts \
            tests/unit/sound/musicConfigSanitizer.test.ts \
            tests/unit/sound/musicRuntimeConfig.test.ts \
            tests/unit/sound/resolveDesiredMusic.test.ts \
            tests/unit/sound/minigameMusicConfig.test.ts

      - name: Production build
        run: npm run build

      - name: Commit validated cleanup and remove this workflow
        shell: bash
        run: |
          git rm .github/workflows/music-manager-cleanup.yml
          rm -f MUSIC_MANAGER_LINT_DIAGNOSTIC.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format and validate Music Manager implementation"
          git push origin HEAD:refs/heads/agent/music-manager-runtime-ui
