name: Music Manager validation cleanup

on:
  push:
    branches:
      - agent/music-manager-runtime-ui
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: music-manager-validation-cleanup
  cancel-in-progress: true

jobs:
  clean-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/music-manager-runtime-ui
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply identified Music Manager source fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old!r}')
              target.write_text(text.replace(old, new, 1))

          replace_once(
              'src/screens/SettingsAdmin/MusicManagerPanel.tsx',
              '  type MusicTrackAssetOverride,\n',
              '',
          )
          replace_once(
              'src/services/sound/musicConfig.ts',
              '  modes: readonly MusicConfigMode[]\n',
              '  modes: MusicConfigMode[]\n',
          )
          replace_once(
              'src/services/sound/musicConfig.ts',
              '  gameKeys: readonly string[]\n',
              '  gameKeys: string[]\n',
          )
          replace_once(
              'src/services/sound/musicConfig.ts',
              '  minigameProfiles?: readonly MinigameMusicProfile[]\n',
              '  minigameProfiles?: MinigameMusicProfile[]\n',
          )
          Path('MUSIC_MANAGER_CI_DIAGNOSTIC.txt').unlink(missing_ok=True)
          Path('MUSIC_MANAGER_LINT_DIAGNOSTIC.txt').unlink(missing_ok=True)

      - name: Format every PR-changed supported file
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR origin/main...HEAD \
              | grep -E '\.(ts|tsx|js|jsx|mjs|cjs|json|css|scss|md|yml|yaml)$' \
              || true
          )
          if ((${#files[@]} > 0)); then
            npx prettier --write "${files[@]}"
          fi

      - name: Apply safe ESLint fixes without hiding residual errors
        shell: bash
        run: |
          set +e
          npx eslint . --fix
          exit 0

      - name: Capture formatting, lint, type, and build diagnostics
        id: validate
        shell: bash
        run: |
          set +e

          npm run format:check > /tmp/music-manager-format.log 2>&1
          format_status=$?

          npm run lint:ci > /tmp/music-manager-lint.log 2>&1
          lint_status=$?

          npm run typecheck > /tmp/music-manager-typecheck.log 2>&1
          type_status=$?

          npm run build > /tmp/music-manager-build.log 2>&1
          build_status=$?

          npm run build:mobile > /tmp/music-manager-mobile-build.log 2>&1
          mobile_status=$?

          {
            echo 'MUSIC MANAGER CI DIAGNOSTIC'
            echo "format_status=$format_status"
            echo "lint_status=$lint_status"
            echo "typecheck_status=$type_status"
            echo "build_status=$build_status"
            echo "mobile_build_status=$mobile_status"
            echo
            echo '===== FORMAT ====='
            cat /tmp/music-manager-format.log
            echo
            echo '===== LINT ====='
            cat /tmp/music-manager-lint.log
            echo
            echo '===== TYPECHECK ====='
            cat /tmp/music-manager-typecheck.log
            echo
            echo '===== WEB BUILD ====='
            cat /tmp/music-manager-build.log
            echo
            echo '===== MOBILE BUILD ====='
            cat /tmp/music-manager-mobile-build.log
          } | tee MUSIC_MANAGER_CI_DIAGNOSTIC.txt

          if [ "$format_status" -ne 0 ] || [ "$lint_status" -ne 0 ] || [ "$type_status" -ne 0 ] || [ "$build_status" -ne 0 ] || [ "$mobile_status" -ne 0 ]; then
            echo 'failed=true' >> "$GITHUB_OUTPUT"
          else
            rm -f MUSIC_MANAGER_CI_DIAGNOSTIC.txt MUSIC_MANAGER_LINT_DIAGNOSTIC.txt
            echo 'failed=false' >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Commit source fixes, formatting, and readable diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix Music Manager CI type compatibility"
          git push origin HEAD:refs/heads/agent/music-manager-runtime-ui

      - name: Stop after unresolved validation
        if: steps.validate.outputs.failed == 'true'
        run: exit 1

      - name: Run focused sound regressions
        run: |
          npx vitest run \
            tests/unit/sound/queue.test.ts \
            tests/unit/sound/soundMiddleware.test.ts \
            tests/unit/sound/musicConfigAudit.test.ts \
            tests/unit/sound/musicConfigSanitizer.test.ts \
            tests/unit/sound/musicRuntimeConfig.test.ts \
            tests/unit/sound/resolveDesiredMusic.test.ts \
            tests/unit/sound/minigameMusicConfig.test.ts

      - name: Remove temporary cleanup workflow after successful validation
        shell: bash
        run: |
          git rm .github/workflows/music-manager-cleanup.yml
          rm -f MUSIC_MANAGER_CI_DIAGNOSTIC.txt MUSIC_MANAGER_LINT_DIAGNOSTIC.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Complete Music Manager CI cleanup"
          git push origin HEAD:refs/heads/agent/music-manager-runtime-ui
