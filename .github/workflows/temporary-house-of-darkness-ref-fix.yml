name: Temporary House of Darkness ref fix

on:
  push:
    branches:
      - agent/add-house-of-darkness

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-house-of-darkness
          fetch-depth: 0
      - name: Move contestant ref synchronization out of render
        run: |
          python - <<'PY'
          from pathlib import Path

          component = Path('src/components/HouseOfDarknessComp/HouseOfDarknessComp.tsx')
          source = component.read_text()
          render_sync = "  const contestantsRef = useRef(contestants);\n  contestantsRef.current = contestants;\n"
          pure_ref = "  const contestantsRef = useRef(contestants);\n"
          effect_anchor = "  useEffect(() => {\n    roundStartedAtRef.current = Date.now();\n  }, []);\n"
          sync_effect = effect_anchor + "\n  useEffect(() => {\n    contestantsRef.current = contestants;\n  }, [contestants]);\n"

          if render_sync not in source:
              raise SystemExit('Expected render-time ref synchronization was not found')
          if effect_anchor not in source:
              raise SystemExit('Expected round timer effect anchor was not found')

          source = source.replace(render_sync, pure_ref, 1)
          source = source.replace(effect_anchor, sync_effect, 1)
          component.write_text(source)
          Path('.github/workflows/temporary-house-of-darkness-ref-fix.yml').unlink()
          PY
      - name: Commit source fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/HouseOfDarknessComp/HouseOfDarknessComp.tsx .github/workflows/temporary-house-of-darkness-ref-fix.yml
          git commit -m "Move House of Darkness ref sync into effect"
          git push origin HEAD:agent/add-house-of-darkness
