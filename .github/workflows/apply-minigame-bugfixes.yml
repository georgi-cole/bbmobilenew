name: Apply minigame bug fixes

on:
  push:
    branches:
      - fix/minigame-bugs-20260806
    paths:
      - scripts/apply-minigame-bugfixes.mjs
      - tests/unit/chain-of-greed/ChainOfGreed.component.test.tsx
      - .github/workflows/apply-minigame-bugfixes.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/minigame-bugs-20260806
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply targeted source changes
        run: node scripts/apply-minigame-bugfixes.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run targeted regression tests
        run: >-
          npm test --
          tests/unit/minigameBugfixes.regression.test.ts
          tests/unit/tiltLabyrinth/TiltLabyrinthComp.test.tsx
          tests/unit/chain-of-greed/ChainOfGreed.component.test.tsx
          tests/unit/competition-ai/bracketTemplate.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "fix: resolve minigame and finale presentation bugs"
          git push origin HEAD:fix/minigame-bugs-20260806
