name: Temporary localization formatter

on:
  push:
    branches:
      - agent/add-localization-settings

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-localization-settings
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format localization changes
        run: >-
          npx prettier --write
          src/i18n/I18nContext.ts
          src/i18n/I18nProvider.tsx
          src/i18n/index.ts
          src/i18n/languages.ts
          src/i18n/messages.ts
          src/screens/Settings/Settings.tsx
          src/store/settingsSlice.ts
          tests/unit/i18n.test.ts

      - name: Commit canonical formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatting changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/i18n src/screens/Settings/Settings.tsx src/store/settingsSlice.ts tests/unit/i18n.test.ts
          git commit -m 'Format localization changes'
          git push origin HEAD:agent/add-localization-settings
