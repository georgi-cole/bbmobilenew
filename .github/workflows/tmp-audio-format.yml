name: Temporary audio formatter

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format-audio-files:
    if: github.head_ref == 'agent/fix-audio-cue-timing' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-audio-cue-timing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format audio files
        run: >-
          npx prettier --write
          src/services/sound/audioVisualSync.ts
          src/services/sound/publicVotingAudioTiming.ts
          tests/unit/sound/publicVotingAudioTiming.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/sound/audioVisualSync.ts src/services/sound/publicVotingAudioTiming.ts tests/unit/sound/publicVotingAudioTiming.test.ts
          git commit -m "Format audio timing files"
          git push origin HEAD:agent/fix-audio-cue-timing
