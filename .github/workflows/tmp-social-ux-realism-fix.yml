name: Temporary Social UX realism fix

on:
  push:
    branches: [fix/social-ux-realism-regressions]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/social-ux-realism-regressions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply corrections
        run: node scripts/tmp-social-ux-realism-fix.mjs
      - name: Format changed files
        shell: bash
        run: |
          git fetch origin main --depth=1
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' '*.css' '*.json' '*.mjs' '*.yml')
          if (( ${#files[@]} > 0 )); then
            npx prettier --write "${files[@]}"
          fi
      - name: Run focused tests
        run: >-
          npx vitest run
          src/components/IncomingInteractionsInbox/__tests__/IncomingInteractionsInbox.test.tsx
          src/components/HousePulse/__tests__/HousePulse.test.tsx
          src/social/__tests__/socialLivelinessRestoration.test.ts
          src/social/__tests__/socialPremiumHardening.test.ts
          tests/social/socialCommitments.unit.test.ts
          tests/unit/publicOpinion/publicOpinionMiddleware.test.ts
      - name: Run static quality
        run: |
          npm run format:check
          npm run test:guard
          npm run lint:ci
          npm run typecheck
      - name: Commit corrections
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests server
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Social UX realism regressions"
          git push origin HEAD:fix/social-ux-realism-regressions
