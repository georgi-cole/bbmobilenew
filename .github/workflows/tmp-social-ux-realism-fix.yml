name: Temporary Social UX cleanup

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'fix/social-ux-realism-regressions' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/social-ux-realism-regressions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format complete PR diff
        shell: bash
        run: |
          git fetch origin main --depth=1
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' '*.css' '*.json' '*.mjs' '*.yml' '*.yaml')
          if (( ${#files[@]} > 0 )); then
            npx prettier --write "${files[@]}"
          fi
      - name: Apply safe lint fixes
        run: npx eslint src tests --fix
      - name: Capture focused diagnostics
        shell: bash
        run: |
          mkdir -p docs
          set +e
          {
            echo '=== TYPECHECK ==='
            npm run typecheck
            echo
            echo '=== LINT ==='
            npm run lint:ci
            echo
            echo '=== FOCUSED TESTS ==='
            npx vitest run \
              src/components/IncomingInteractionsInbox/__tests__/IncomingInteractionsInbox.test.tsx \
              src/components/HousePulse/__tests__/HousePulse.test.tsx \
              src/social/__tests__/incomingInteractionAutonomy.test.ts \
              src/social/__tests__/socialLivelinessRestoration.test.ts \
              src/social/__tests__/socialPremiumHardening.test.ts \
              src/publicOpinion/__tests__/AudiencePulseService.test.ts \
              tests/social/socialCommitments.unit.test.ts \
              tests/unit/publicOpinion/publicOpinionMiddleware.test.ts
          } > docs/.social-ux-diagnostics.txt 2>&1
          status=$?
          set -e
          if (( status == 0 )); then
            rm -f docs/.social-ux-diagnostics.txt
          else
            printf '\nDIAGNOSTIC_EXIT_CODE=%s\n' "$status" >> docs/.social-ux-diagnostics.txt
          fi
      - name: Commit cleanup and diagnostics
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests server docs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Clean Social UX realism integration"
          git push origin HEAD:fix/social-ux-realism-regressions
