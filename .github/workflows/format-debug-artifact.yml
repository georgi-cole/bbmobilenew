name: Format Debug Artifact

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed implementation files
        run: |
          npx prettier --write \
            e2e/playwright/minigameLab.smoke.spec.ts \
            src/components/MinigameHost/MinigameHost.tsx \
            src/components/MinigameRules/MinigameRules.css \
            src/components/MinigameRules/MinigameRules.tsx \
            src/components/MinigameUtilityDock/MinigameUtilityDock.css \
            src/components/MinigameUtilityDock/MinigameUtilityDock.tsx \
            src/minigames/LegacyMinigameWrapper.tsx \
            tests/unit/minigameHost.dismissal.test.tsx \
            tests/unit/minigameHostCloseButton.styles.test.ts \
            tests/unit/minigameResponsiveSafety.styles.test.ts

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-minigame-utility-dock
          path: |
            e2e/playwright/minigameLab.smoke.spec.ts
            src/components/MinigameHost/MinigameHost.tsx
            src/components/MinigameRules/MinigameRules.css
            src/components/MinigameRules/MinigameRules.tsx
            src/components/MinigameUtilityDock/MinigameUtilityDock.css
            src/components/MinigameUtilityDock/MinigameUtilityDock.tsx
            src/minigames/LegacyMinigameWrapper.tsx
            tests/unit/minigameHost.dismissal.test.tsx
            tests/unit/minigameHostCloseButton.styles.test.ts
            tests/unit/minigameResponsiveSafety.styles.test.ts
