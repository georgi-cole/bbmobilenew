name: Agent Verify Battery Low

on:
  push:
    branches:
      - agent/redesign-battery-low-1226

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/redesign-battery-low-1226
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Battery Low tests
        run: >-
          npx vitest run
          tests/unit/battery-low/batteryLow.logic.test.ts
          tests/unit/battery-low/BatteryLow.ui.test.tsx
          tests/unit/battery-low/BatteryLow.styles.test.ts

      - name: Record successful verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Verify Battery Low targeted tests"
          git push origin HEAD:agent/redesign-battery-low-1226
