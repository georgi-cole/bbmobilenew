name: Temporary Public Favorite targeted tests

on:
  pull_request:
    types: [synchronize]

jobs:
  public-favorite-targeted-tests:
    if: github.head_ref == 'agent/cinematic-public-favorite-realism'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Public Favorite tests
        run: >-
          npx vitest run
          tests/unit/publicFavoriteOverlay.test.tsx
          tests/unit/publicFavoriteOutcome.test.ts
          tests/unit/useBattleBackVoting.test.tsx
          tests/unit/sound/publicVotingAudioTiming.test.ts
