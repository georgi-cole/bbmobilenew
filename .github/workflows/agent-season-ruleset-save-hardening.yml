name: Agent Season Ruleset Save Hardening

on:
  push:
    branches:
      - agent/season-ruleset-save-hardening

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/season-ruleset-save-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tighten stacked applicator target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/agent_apply_season_ruleset_refactor.py')
          text = path.read_text()
          old = '''replace_once(
              "src/store/store.ts",
              """    if (!current.profiles.isGuest && activeProfileId && hasMeaningfulGameProgress(current.game)) {\\n      runSnapshotAutosave.schedule(\\n""",
              """    if (\\n      !current.profiles.isGuest &&\\n      activeProfileId &&\\n      hasMeaningfulGameProgress(current.game) &&\\n      !isRunSnapshotAutosaveSuspended()\\n    ) {\\n      runSnapshotAutosave.schedule(\\n""",
          )'''
          new = '''replace_once(
              "src/store/store.ts",
              """  if (resumableStateChanged) {\\n    prevGame = current.game\\n    prevFinale = current.finale\\n    prevSocial = current.social\\n    prevPublicOpinion = current.publicOpinion\\n    prevChallenge = current.challenge\\n    const activeProfileId = current.profiles.activeProfileId\\n    if (!current.profiles.isGuest && activeProfileId && hasMeaningfulGameProgress(current.game)) {\\n      runSnapshotAutosave.schedule(\\n""",
              """  if (resumableStateChanged) {\\n    prevGame = current.game\\n    prevFinale = current.finale\\n    prevSocial = current.social\\n    prevPublicOpinion = current.publicOpinion\\n    prevChallenge = current.challenge\\n    const activeProfileId = current.profiles.activeProfileId\\n    if (\\n      !current.profiles.isGuest &&\\n      activeProfileId &&\\n      hasMeaningfulGameProgress(current.game) &&\\n      !isRunSnapshotAutosaveSuspended()\\n    ) {\\n      runSnapshotAutosave.schedule(\\n""",
          )'''
          if old not in text:
              raise SystemExit('stacked store target not found in applicator')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply refactor
        run: python3 scripts/agent_apply_season_ruleset_refactor.py
      - name: Clean transformed declarations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home = Path('src/screens/HomeHub/HomeHub.tsx')
          text = home.read_text()
          text = text.replace("type ClassicPrompt = 'resume-or-new' | 'confirm-new' | null\n", '')
          text = text.replace('  const [classicPrompt, setClassicPrompt] = useState<ClassicPrompt>(null)\n', '')
          text = text.replace('  const [expansionPrompt, setExpansionPrompt] = useState<ExpansionSelection | null>(null)\n', '')
          text = text.replace('    setClassicPrompt(null)\n', '')
          text = text.replace('    setExpansionPrompt(null)\n', '')
          home.write_text(text)

          picker = Path('src/screens/ProfilePicker/ProfilePicker.tsx')
          text = picker.read_text()
          text = text.replace('  const [pendingHome, setPendingHome] = useState(false);\n', '')
          text = text.replace('\n  // Resume-save prompt: triggered when switching to a profile that has a saved season.\n  // Holds the profile ID to switch to so the confirm/cancel handlers can act on it.\n  const [pendingResumeId, setPendingResumeId] = useState<string | null>(null);\n', '')
          picker.write_text(text)

          test = Path('src/store/saveStatePersistence.test.ts')
          lines = test.read_text().splitlines(keepends=True)
          seen = False
          cleaned = []
          for line in lines:
              if line.strip() == 'savedRunSlotKeyForProfile,':
                  if seen:
                      continue
                  seen = True
              cleaned.append(line)
          test.write_text(''.join(cleaned))
          PY
      - name: Align split-save regression with canonical finite season
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('src/store/saveStatePersistence.test.ts')
          text = path.read_text()
          pattern = r"  it\('rewrites only the active split run slot during routine autosaves', \(\) => \{.*?\n  \}\)\n\n  it\('prepares one complete campaign snapshot"
          replacement = """  it('rewrites only the canonical finite slot while preserving independent/recovery blobs', () => {
              const makeSnapshot = (
                runId: string,
                mode: 'classic' | 'survival',
                expansionMode: 'cupidArrow' | 'voxPopuli' | null,
                week = 2
              ) =>
                ({
                  version: 1,
                  profileId: 'profile-1',
                  savedAt: `2026-08-11T20:00:${String(week).padStart(2, '0')}.000Z`,
                  game: {
                    mode,
                    expansionMode,
                    week,
                    status: 'active',
                    runId,
                    gameId: runId,
                    players: [{ id: 'user', name: 'You', avatar: 'P', status: 'active', isUser: true }],
                  },
                  finale: {},
                  social: {},
                }) as SavedSeasonSnapshot

              expect(saveRunSnapshot('profile-1', makeSnapshot('classic-run', 'classic', null))).toBe(true)
              expect(saveRunSnapshot('profile-1', makeSnapshot('survival-run', 'survival', null))).toBe(true)
              expect(saveRunSnapshot('profile-1', makeSnapshot('cupid-run', 'classic', 'cupidArrow'))).toBe(true)
              expect(saveRunSnapshot('profile-1', makeSnapshot('vox-run', 'classic', 'voxPopuli'))).toBe(true)

              const metadataKey = savedRunsKeyForProfile('profile-1')
              const classicKey = savedRunSlotKeyForProfile('profile-1', 'classic')
              const survivalKey = savedRunSlotKeyForProfile('profile-1', 'survival')
              const cupidKey = savedRunSlotKeyForProfile('profile-1', 'cupidArrow')
              const voxKey = savedRunSlotKeyForProfile('profile-1', 'voxPopuli')
              const before = {
                metadata: localStorage.getItem(metadataKey),
                classic: localStorage.getItem(classicKey),
                survival: localStorage.getItem(survivalKey),
                cupid: localStorage.getItem(cupidKey),
                vox: localStorage.getItem(voxKey),
              }

              expect(saveRunSnapshot('profile-1', makeSnapshot('classic-run', 'classic', null, 3))).toBe(true)

              expect(localStorage.getItem(metadataKey)).not.toBe(before.metadata)
              expect(localStorage.getItem(classicKey)).not.toBe(before.classic)
              expect(localStorage.getItem(survivalKey)).toBe(before.survival)
              expect(localStorage.getItem(cupidKey)).toBe(before.cupid)
              expect(localStorage.getItem(voxKey)).toBe(before.vox)

              const profile = loadSavedRunProfile('profile-1')
              expect(profile.activeSeasonSlot).toBe('classic')
              expect(profile.retiredFiniteSlots).toEqual(['cupidArrow', 'voxPopuli'])
              expect(profile.runs.classic?.game.week).toBe(3)
              expect(profile.runs.survival?.game.runId).toBe('survival-run')
              expect(profile.runs.cupidArrow).toBeUndefined()
              expect(profile.runs.voxPopuli).toBeUndefined()
            })

            it('prepares one complete campaign snapshot"""
          updated, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit(f'expected one split-save regression block, found {count}')
          path.write_text(updated)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Focused ESLint
        run: >-
          npx eslint
          src/modes/modeTypes.ts
          src/modes/seasonRulesets.ts
          src/modes/seasonRulesets.test.ts
          src/modes/survivorExpansionIsolation.test.ts
          src/store/gameSlice.ts
          src/store/saveStatePersistence.ts
          src/store/saveStatePersistence.test.ts
          src/store/runSnapshotAutosave.ts
          src/store/runSnapshotAutosave.test.ts
          src/store/store.ts
          src/screens/HomeHub/HomeHub.tsx
          src/screens/ProfilePicker/ProfilePicker.tsx
          src/screens/ProfilePicker/ProfilePicker.test.tsx
          src/screens/SelfEvicted/SelfEvicted.tsx
          --max-warnings=0
      - name: Focused tests
        run: >-
          npx vitest run
          src/modes/seasonRulesets.test.ts
          src/modes/survivorExpansionIsolation.test.ts
          src/store/saveStatePersistence.test.ts
          src/store/runSnapshotAutosave.test.ts
          src/screens/ProfilePicker/ProfilePicker.test.tsx
      - name: Commit validated source changes
        run: |
          if git diff --quiet -- src; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Harden season rulesets and save lifecycle"
          git push origin HEAD:agent/season-ruleset-save-hardening
