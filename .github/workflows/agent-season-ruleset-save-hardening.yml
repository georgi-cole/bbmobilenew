name: Agent Season Ruleset Save Hardening

on:
  push:
    branches:
      - agent/season-ruleset-save-hardening

permissions:
  contents: write

jobs:
  broad-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/season-ruleset-save-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Changed-file formatting
        run: npm run format:check
      - name: Repo-wide lint
        run: npm run lint:ci
      - name: Full unit and integration suite
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Remove generated noise and stale profile comments
        run: |
          git checkout 0f951c3955469c662fb93927483111a8f12b8ffc -- src/services/sound/generatedAudioManifest.ts
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/screens/ProfilePicker/ProfilePicker.tsx')
          text = path.read_text()
          text = text.replace(
              " * guest mode.  Switching profiles (when a game is active) shows a confirmation\n * warning that the current season will be reset.\n *\n * When selecting a profile that has a saved in-progress season, the user is\n * prompted to resume that season or start a fresh one.\n",
              " * guest mode. Switching profiles preserves the current profile's autosaved\n * run, then hydrates the selected profile from the canonical modern save store.\n * HomeHub remains the single resume/new-season surface.\n",
          )
          text = text.replace(
              "  // Is there an in-progress game (non-trivial state) that would be lost?\n  // Fresh launches are marked active immediately so the warning still shows\n  // before the first week advances.\n",
              "  // Use the confirmation whenever the current runtime represents an active season.\n  // The season is autosaved; the confirmation prevents accidental context switches.\n",
          )
          text = text.replace(
              "      // Need confirmation because switching resets the current season\n",
              "      // Confirm the context switch; current profile progress remains saved.\n",
          )
          text = text.replace(
              "      {/* Profile-switch confirmation modal (current season will be lost) */}\n",
              "      {/* Profile-switch confirmation modal — current progress remains saved. */}\n",
          )
          path.write_text(text)
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet -- src/services/sound/generatedAudioManifest.ts src/screens/ProfilePicker/ProfilePicker.tsx; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/sound/generatedAudioManifest.ts src/screens/ProfilePicker/ProfilePicker.tsx
          git commit -m "Clean season hardening diff"
          git push origin HEAD:agent/season-ruleset-save-hardening
