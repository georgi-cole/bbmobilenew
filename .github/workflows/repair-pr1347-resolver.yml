name: Repair PR 1347 resolver

on:
  push:
    branches:
      - fix/minigame-bugs-20260806
    paths:
      - .github/workflows/repair-pr1347-resolver.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/minigame-bugs-20260806
          fetch-depth: 0

      - name: Add merge identity and allow one bot-triggered run
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/resolve-pr1347-messages-conflict.yml')
          text = path.read_text()
          text = text.replace("    if: github.actor != 'github-actions[bot]'\n", '')
          needle = '          git fetch origin main\n'
          replacement = (
              '          git config user.name "github-actions[bot]"\n'
              '          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"\n'
              '          git fetch origin main\n'
          )
          if needle not in text:
              raise SystemExit('Merge step marker not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Commit repair and remove this helper
        run: |
          git rm .github/workflows/repair-pr1347-resolver.yml
          git add .github/workflows/resolve-pr1347-messages-conflict.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: repair one-time conflict resolver"
          git push origin HEAD:fix/minigame-bugs-20260806
