name: Temporary CWGO formatter

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format-cwgo:
    if: github.head_ref == 'agent/cwgo-human-answer-logic' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cwgo-human-answer-logic
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format CWGO files
        run: >-
          npx prettier --write
          docs/content-and-configuration-hosting-audit.md
          src/features/cwgo/cwgoCompetitionSlice.ts
          src/features/cwgo/cwgoHelpers.ts
          src/features/cwgo/cwgoQuestions.ts
          tests/cwgo.ai-human-logic.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/content-and-configuration-hosting-audit.md src/features/cwgo tests/cwgo.ai-human-logic.test.ts
          git commit -m "Format CWGO AI changes"
          git push origin HEAD:agent/cwgo-human-answer-logic