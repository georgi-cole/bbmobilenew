name: Temporary Incoming Interactions formatter

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format-incoming-interactions:
    if: github.head_ref == 'fix/incoming-interactions-encoding-layout' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/incoming-interactions-encoding-layout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format incoming interaction files
        run: >-
          npx prettier --write
          src/components/IncomingInteractionsInbox/IncomingInteractionIcon.tsx
          src/components/IncomingInteractionsInbox/IncomingInteractionsInbox.tsx
          src/components/IncomingInteractionsInbox/IncomingInteractionsInbox.css
          src/components/IncomingInteractionsInbox/__tests__/IncomingInteractionsInbox.encoding.test.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/IncomingInteractionsInbox
          git commit -m "Format incoming interaction files"
          git push origin HEAD:fix/incoming-interactions-encoding-layout
