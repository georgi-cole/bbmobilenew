name: Temporary Big Spender formatter

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format-big-spender:
    if: github.head_ref == 'agent/big-spender-replenishing-wall' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/big-spender-replenishing-wall
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Big Spender files
        run: >-
          npx prettier --write
          src/components/BigSpender/BigSpender.tsx
          src/components/BigSpender/BigSpenderBoard.tsx
          src/components/BigSpender/BigSpenderOverlays.tsx
          src/components/BigSpender/BigSpenderReplenishing.tsx
          src/components/BigSpender/BigSpenderWall.css
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/BigSpender
          git commit -m "Format replenishing Big Spender"
          git push origin HEAD:agent/big-spender-replenishing-wall
