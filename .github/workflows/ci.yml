name: Pull Request Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Format, lint, types, and dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check formatting for files changed from main
        run: npm run format:check
      - name: Reject focused or disabled tests
        run: npm run test:guard
      - name: Lint without warnings
        run: npm run lint:ci
      - name: Type check
        run: npm run typecheck
      - name: Run season/profile lifecycle regressions
        run: >-
          npx vitest run
          src/modes/seasonRulesets.test.ts
          src/screens/ProfilePicker/ProfilePicker.test.tsx
          src/screens/HomeHub/__tests__/HomeHub.test.tsx
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  full-product-tests:
    name: Complete unit and integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run every discovered Vitest test without retries
        run: npm test -- --reporter=dot

  production-builds:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Web production build
            script: build
          - label: Capacitor mobile-mode build
            script: build:mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}

  android-native:
    name: Android native lint and debug build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run sync:android
      - name: Lint and compile the Android app
        working-directory: android
        run: ./gradlew lintDebug assembleDebug

  android-runtime:
    name: Android emulator runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run sync:android
      - name: Run instrumentation and launch the installed app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd android
            ./gradlew connectedDebugAndroidTest installDebug
            adb shell am start -W -n com.georgicole.thebigeye/.MainActivity
            adb shell dumpsys activity activities | grep -q "mResumedActivity.*com.georgicole.thebigeye/.MainActivity"

  ios-native:
    name: iOS simulator build
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:ios
      - name: Compile the iOS app without signing
        run: >-
          xcodebuild build
          -project ios/App/App.xcodeproj
          -target App
          -configuration Debug
          -sdk iphonesimulator
          -derivedDataPath ios-derived
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO
      - name: Install and launch the app on an iOS simulator
        shell: bash
        run: |
          simulator_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for runtime in data["devices"].values() for device in runtime if device["isAvailable"]))')"
          xcrun simctl boot "$simulator_id" || true
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl install "$simulator_id" ios-derived/Build/Products/Debug-iphonesimulator/App.app
          launch_output="$(xcrun simctl launch "$simulator_id" com.georgicole.thebigeye)"
          app_pid="${launch_output##*: }"
          test "$app_pid" -gt 0
          sleep 10
          xcrun simctl spawn "$simulator_id" kill -0 "$app_pid"
