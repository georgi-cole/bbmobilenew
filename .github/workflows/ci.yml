name: Pull Request Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Format, lint, types, and dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Normalize changed files for artifact
        run: |
          npx prettier --write \
            src/components/DayStartShockPopup/DayStartShockPopup.css \
            src/components/DayStartShockPopup/DayStartShockPopup.test.ts \
            src/components/DayStartShockPopup/DayStartShockPopup.tsx \
            src/data/avatarAssetManifest.ts \
            src/main.tsx \
            src/store/__tests__/selectors.final4.test.ts \
            src/store/selectors.ts \
            src/styles/gameOverResponsiveFixes.css
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-files
          path: |
            src/components/DayStartShockPopup/DayStartShockPopup.css
            src/components/DayStartShockPopup/DayStartShockPopup.test.ts
            src/components/DayStartShockPopup/DayStartShockPopup.tsx
            src/data/avatarAssetManifest.ts
            src/main.tsx
            src/store/__tests__/selectors.final4.test.ts
            src/store/selectors.ts
            src/styles/gameOverResponsiveFixes.css
      - name: Check formatting for files changed from main
        run: npm run format:check
      - name: Reject focused or disabled tests
        run: npm run test:guard
      - name: Lint without warnings
        run: npm run lint:ci
      - name: Type check
        run: npm run typecheck
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  production-builds:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Web production build
            script: build
          - label: Capacitor mobile-mode build
            script: build:mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
