name: Pull Request Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Format, lint, types, dependencies, and localization
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check formatting for files changed from main
        run: npm run format:check
      - name: Validate localization coverage and new player-facing copy
        env:
          I18N_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run validate:i18n
      - name: Reject focused or disabled tests
        run: npm run test:guard
      - name: Lint without warnings
        run: npm run lint:ci
      - name: Type check
        run: npm run typecheck
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  production-builds:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Web production build
            script: build
          - label: Capacitor mobile-mode build
            script: build:mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}

  android-native:
    name: Android native lint and debug build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run sync:android
      - name: Lint and compile the Android app
        working-directory: android
        run: ./gradlew lintDebug assembleDebug

  ios-native:
    name: iOS simulator build
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:ios
      - name: Compile the iOS app without signing
        run: >-
          xcodebuild build
          -project ios/App/App.xcodeproj
          -target App
          -configuration Debug
          -sdk iphonesimulator
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO
