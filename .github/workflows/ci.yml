name: Pull Request Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Format, lint, types, and dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check formatting for files changed from main
        run: npm run format:check
      - name: Reject focused or disabled tests
        run: npm run test:guard
      - name: Lint without warnings
        run: npm run lint:ci
      - name: Type check
        run: npm run typecheck
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  production-builds:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Web production build
            script: build
          - label: Capacitor mobile-mode build
            script: build:mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}

  apply-gameplay-polish:
    name: Apply requested gameplay polish
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/gameplay-polish-1230-1250' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/gameplay-polish-1230-1250
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Decode patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import zlib
          from pathlib import Path

          payload = Path('scripts/apply_gameplay_polish.py.zlib.b64').read_text(encoding='utf-8').strip()
          script = zlib.decompress(base64.b64decode(payload))
          Path('scripts/apply_gameplay_polish.py').write_bytes(script)
          PY

      - name: Apply patch
        id: apply_patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/apply_gameplay_polish.py > /tmp/gameplay-polish-patch.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo '### Gameplay polish patch failure'
              echo
              echo '```text'
              tail -n 80 /tmp/gameplay-polish-patch.log
              echo '```'
            } > /tmp/gameplay-polish-comment.md
            gh issue comment 1257 --repo georgi-cole/bbmobilenew --body-file /tmp/gameplay-polish-comment.md
            cat /tmp/gameplay-polish-patch.log
            exit "$status"
          fi

      - name: Correct regression filesystem paths
        run: python3 scripts/fix_gameplay_test_paths.py

      - name: Install dependencies
        run: npm ci

      - name: Format changed source
        run: >-
          npx prettier --write
          src/components/Minesweeps/Minesweeps.css
          src/components/SilentSaboteurComp/SilentSaboteurComp.css
          src/components/FloatingActionBar/FloatingActionBar.tsx
          src/components/TwinShockRevealOverlay/TwinShockRevealOverlay.css
          src/screens/GameScreen/evictionTieVisuals.ts
          src/screens/GameScreen/GameScreen.tsx
          src/components/HouseguestGrid/HouseguestGrid.tsx
          src/components/HouseguestGrid/AvatarTile.tsx
          src/components/HouseguestGrid/HouseguestGrid.module.css
          src/types/index.ts
          src/store/gameSlice.ts
          src/store/store.ts
          src/store/tribunalEligibilityMiddleware.ts
          src/components/FinalFaceoff/finaleEligibility.ts
          src/utils/juryUtils.ts
          src/store/finaleSlice.ts
          src/components/FinalFaceoff/FinalFaceoff.tsx
          src/components/FinalFaceoff/JurorBubble.tsx
          tests/unit/gameplayPolish.regression.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Run targeted regression tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npx vitest run tests/unit/gameplayPolish.regression.test.ts > /tmp/gameplay-polish-tests.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo '### Gameplay polish regression failure'
              echo
              echo '```text'
              tail -n 120 /tmp/gameplay-polish-tests.log
              echo '```'
            } > /tmp/gameplay-polish-tests-comment.md
            gh issue comment 1257 --repo georgi-cole/bbmobilenew --body-file /tmp/gameplay-polish-tests-comment.md
            cat /tmp/gameplay-polish-tests.log
            exit "$status"
          fi

      - name: Lint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run lint:ci > /tmp/gameplay-polish-lint.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo '### Gameplay polish lint failure'
              echo
              echo '```text'
              tail -n 120 /tmp/gameplay-polish-lint.log
              echo '```'
            } > /tmp/gameplay-polish-lint-comment.md
            gh issue comment 1257 --repo georgi-cole/bbmobilenew --body-file /tmp/gameplay-polish-lint-comment.md
            cat /tmp/gameplay-polish-lint.log
            exit "$status"
          fi

      - name: Build web and mobile bundles
        run: |
          npm run build
          npm run build:mobile

      - name: Verify diff
        run: git diff --check

      - name: Commit product changes
        shell: bash
        run: |
          rm -f scripts/apply_gameplay_polish.py
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -f scripts/apply_gameplay_polish.py.zlib.b64 .github/workflows/apply-gameplay-polish.yml scripts/fix_gameplay_test_paths.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: polish gameplay transitions and tribunal voting"
          git push origin HEAD:agent/gameplay-polish-1230-1250
