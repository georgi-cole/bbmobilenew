name: Pull Request Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Format, lint, types, and dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check formatting for files changed from main
        run: npm run format:check
      - name: Reject focused or disabled tests
        run: npm run test:guard
      - name: Lint without warnings
        run: npm run lint:ci
      - name: Type check
        run: npm run typecheck
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  production-builds:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Web production build
            script: build
          - label: Capacitor mobile-mode build
            script: build:mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}

  format-public-save-visual:
    if: github.head_ref == 'agent/use-normal-public-save-visual' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/use-normal-public-save-visual
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply repository formatting
        run: |
          npx prettier --write \
            src/components/PublicSaveReveal/PublicSaveReveal.tsx \
            src/components/PublicSaveReveal/__tests__/PublicSaveReveal.test.tsx \
            src/publicOpinion/DramaPublicSaveIntegration.ts
      - name: Verify focused behavior
        run: |
          npx vitest run src/components/PublicSaveReveal/__tests__/PublicSaveReveal.test.tsx
          npm run typecheck
      - name: Commit verified source
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/temp-format-public-save-visual.yml
          rm -f .public-save-visual-format-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use normal Public Save visual in Drama Mode"
          git push origin HEAD:agent/use-normal-public-save-visual
