name: Pull Request Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Formatting
            command: npm run format:check
            needs_full_history: true
          - label: Test hygiene
            command: npm run test:guard
            needs_full_history: false
          - label: ESLint
            command: npm run lint:ci
            needs_full_history: false
          - label: TypeScript
            command: npm run typecheck
            needs_full_history: false
          - label: Core regressions
            command: npm run test:pr-core
            needs_full_history: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ matrix.needs_full_history && 0 || 1 }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run ${{ matrix.label }}
        env:
          FORMAT_BASE_REF: ${{ github.event_name == 'push' && 'HEAD^' || '' }}
        run: ${{ matrix.command }}

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect dependency changes
        id: dependency_changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="$(git merge-base HEAD "origin/${GITHUB_BASE_REF}")"
          else
            base="HEAD^"
          fi

          if git diff --name-only "$base" HEAD -- package.json package-lock.json | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Dependency manifests changed; production audit is required."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency manifest changes; PR dependency audit is skipped."
          fi
      - uses: actions/setup-node@v4
        if: steps.dependency_changes.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.dependency_changes.outputs.changed == 'true'
      - name: Audit production dependencies
        if: steps.dependency_changes.outputs.changed == 'true'
        run: npm audit --omit=dev --audit-level=high

  production-builds:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Web production build
            script: build
          - label: Capacitor mobile-mode build
            script: build:mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}

  android-native:
    name: Android native lint and debug build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run sync:android
      - name: Lint and compile the Android app
        working-directory: android
        run: ./gradlew lintDebug assembleDebug

  ios-native:
    name: iOS simulator build
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:ios
      - name: Compile the iOS app without signing
        run: >-
          xcodebuild build
          -project ios/App/App.xcodeproj
          -target App
          -configuration Debug
          -sdk iphonesimulator
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO
