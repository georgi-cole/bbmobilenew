name: Temporary sync Public Favorite with main

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/fix-public-favorite-finale' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-public-favorite-finale
          fetch-depth: 0
      - name: Remove one-shot workflow before merge
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/tmp-sync-public-favorite-main.yml
          git add -A
          git commit -m "Remove temporary main sync workflow"
      - name: Merge current main
        run: |
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:agent/fix-public-favorite-finale
