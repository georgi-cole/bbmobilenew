name: Repair audio manifest generator

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-audio-manifest-generator
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audio-auto-index-migration
          fetch-depth: 0

      - name: Remove obsolete generated lint suppression
        shell: python
        run: |
          from pathlib import Path

          target = Path('scripts/generate-audio-manifest.mjs')
          text = target.read_text()
          old = r'const generated = `/* eslint-disable */\n'
          if old not in text:
            raise SystemExit('Could not locate generated eslint-disable prefix')
          target.write_text(text.replace(old, 'const generated = `', 1))

      - name: Validate generator
        run: node --check scripts/generate-audio-manifest.mjs

      - name: Commit generator repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate-audio-manifest.mjs
          git commit -m 'Remove obsolete generated lint suppression'
          git push origin HEAD:refs/heads/agent/audio-auto-index-migration
