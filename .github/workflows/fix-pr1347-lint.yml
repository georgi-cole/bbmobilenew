name: Fix PR 1347 lint regressions

on:
  push:
    branches:
      - fix/minigame-bugs-20260806
    paths:
      - .github/workflows/fix-pr1347-lint.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/minigame-bugs-20260806
          fetch-depth: 0

      - name: Record branch head
        run: echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Restore localization quality guard
        run: |
          git checkout 49926d10776c5e298098d33bd9216d45a87e846e -- \
            .github/workflows/ci.yml \
            package.json \
            scripts/check-localization.mjs \
            config/localization-source-review.json

      - name: Add recap image preload utilities
        run: |
          cat > src/components/SeasonRecapCinematic/recapImagePreload.ts <<'EOF'
          const decodedImageSources = new Set<string>()
          const preloadRequests = new Map<string, Promise<boolean>>()

          export function isRecapImageSourceDecoded(source: string): boolean {
            return decodedImageSources.has(source)
          }

          export function markRecapImageSourceDecoded(source: string): void {
            if (source) decodedImageSources.add(source)
          }

          function preloadSource(source: string, timeoutMs: number): Promise<boolean> {
            if (!source) return Promise.resolve(false)
            if (decodedImageSources.has(source)) return Promise.resolve(true)
            const existing = preloadRequests.get(source)
            if (existing) return existing

            const request = new Promise<boolean>((resolve) => {
              if (typeof Image === 'undefined') {
                resolve(true)
                return
              }

              const image = new Image()
              let settled = false
              const settle = (loaded: boolean) => {
                if (settled) return
                settled = true
                window.clearTimeout(timeout)
                if (loaded) decodedImageSources.add(source)
                resolve(loaded)
              }
              const timeout = window.setTimeout(() => settle(false), timeoutMs)
              image.onload = () => {
                const decoded =
                  typeof image.decode === 'function'
                    ? image.decode().catch(() => undefined)
                    : Promise.resolve()
                void decoded.then(() => settle(true))
              }
              image.onerror = () => settle(false)
              image.decoding = 'async'
              image.src = source
            }).finally(() => {
              preloadRequests.delete(source)
            })

            preloadRequests.set(source, request)
            return request
          }

          export async function preloadRecapImageSources(
            sources: string[],
            timeoutMs = 4_500
          ): Promise<string | null> {
            const safeSources = [...new Set(sources.filter(Boolean))]
            for (const source of safeSources) {
              if (await preloadSource(source, timeoutMs)) return source
            }
            return null
          }
          EOF

      - name: Refactor RecapImage state ownership
        run: |
          cat > src/components/SeasonRecapCinematic/RecapImage.tsx <<'EOF'
          import {
            useMemo,
            useState,
            type ImgHTMLAttributes,
            type SyntheticEvent,
          } from 'react'
          import {
            isRecapImageSourceDecoded,
            markRecapImageSourceDecoded,
          } from './recapImagePreload'

          interface RecapImageProps extends Omit<ImgHTMLAttributes<HTMLImageElement>, 'src'> {
            sources: string[]
          }

          interface RecapImageInstanceProps
            extends Omit<RecapImageProps, 'sources'> {
            safeSources: string[]
          }

          function RecapImageInstance({
            safeSources,
            onError,
            onLoad,
            style,
            ...imgProps
          }: RecapImageInstanceProps) {
            const cachedSourceIndex = safeSources.findIndex(isRecapImageSourceDecoded)
            const [sourceIndex, setSourceIndex] = useState(() =>
              Math.max(0, cachedSourceIndex)
            )
            const [status, setStatus] = useState<'pending' | 'loaded' | 'failed'>(
              cachedSourceIndex >= 0 ? 'loaded' : 'pending'
            )
            const src =
              safeSources[Math.min(sourceIndex, Math.max(safeSources.length - 1, 0))] ?? ''

            function handleLoad(event: SyntheticEvent<HTMLImageElement, Event>) {
              markRecapImageSourceDecoded(src)
              setStatus('loaded')
              onLoad?.(event)
            }

            function handleError(event: SyntheticEvent<HTMLImageElement, Event>) {
              if (sourceIndex < safeSources.length - 1) {
                setStatus('pending')
                setSourceIndex((current) => current + 1)
                return
              }
              setStatus('failed')
              onError?.(event)
            }

            return (
              <img
                {...imgProps}
                src={src}
                onLoad={handleLoad}
                onError={handleError}
                data-image-state={status}
                style={{
                  ...style,
                  opacity:
                    status === 'loaded'
                      ? typeof style?.opacity === 'number'
                        ? style.opacity
                        : 1
                      : 0,
                  visibility: status === 'failed' ? 'hidden' : style?.visibility,
                }}
              />
            )
          }

          export default function RecapImage({ sources, ...imgProps }: RecapImageProps) {
            const safeSources = useMemo(
              () => [...new Set(sources.filter(Boolean))],
              [sources]
            )
            const sourceKey = safeSources.join('\u0000')

            return (
              <RecapImageInstance
                key={sourceKey}
                safeSources={safeSources}
                {...imgProps}
              />
            )
          }
          EOF

      - name: Move tilt input helper out of component module
        run: |
          cat > src/components/TiltLabyrinthComp/tiltLabyrinthInput.ts <<'EOF'
          const ORIENTATION_DEAD_ZONE_DEGREES = 1.5

          function clamp(value: number, min: number, max: number): number {
            return Math.max(min, Math.min(max, value))
          }

          export function normalizeTiltDelta(
            deltaDegrees: number,
            deadZoneDegrees = ORIENTATION_DEAD_ZONE_DEGREES
          ): number {
            if (!Number.isFinite(deltaDegrees)) return 0
            if (Math.abs(deltaDegrees) <= deadZoneDegrees) return 0
            const adjusted = deltaDegrees - Math.sign(deltaDegrees) * deadZoneDegrees
            return clamp(adjusted / 30, -1, 1)
          }
          EOF

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/TiltLabyrinthComp/TiltLabyrinthComp.tsx')
          text = path.read_text()
          anchor = "import {\n  calculateTiltAdjustedTime,\n  resolveCollisions,\n  type TiltLabyrinthMazeCell as MazeCell,\n} from './tiltLabyrinthCollision';\n"
          replacement = anchor + "import { normalizeTiltDelta } from './tiltLabyrinthInput';\n"
          if "from './tiltLabyrinthInput'" not in text:
              if anchor not in text:
                  raise SystemExit('Tilt collision import anchor not found')
              text = text.replace(anchor, replacement, 1)
          text = text.replace("const ORIENTATION_DEAD_ZONE_DEGREES = 1.5;\n", "", 1)
          pattern = re.compile(
              r"\nexport function normalizeTiltDelta\(\n"
              r"  deltaDegrees: number,\n"
              r"  deadZoneDegrees = ORIENTATION_DEAD_ZONE_DEGREES,\n"
              r"\): number \{\n"
              r"  if \(!Number\.isFinite\(deltaDegrees\)\) return 0;\n"
              r"  if \(Math\.abs\(deltaDegrees\) <= deadZoneDegrees\) return 0;\n"
              r"  const adjusted = deltaDegrees - Math\.sign\(deltaDegrees\) \* deadZoneDegrees;\n"
              r"  return clamp\(adjusted / 30, -1, 1\);\n"
              r"\}\n"
          )
          text, count = pattern.subn('\n', text, count=1)
          if count != 1:
              raise SystemExit(f'Expected to remove one normalizeTiltDelta export, removed {count}')
          path.write_text(text)
          PY

      - name: Stabilize GameOver story dependencies and update imports
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/screens/GameOver/GameOver.tsx')
          text = path.read_text()
          old_import = "import RecapImage, { preloadRecapImageSources } from '../../components/SeasonRecapCinematic/RecapImage'"
          new_import = "import RecapImage from '../../components/SeasonRecapCinematic/RecapImage'\nimport { preloadRecapImageSources } from '../../components/SeasonRecapCinematic/recapImagePreload'"
          if old_import not in text:
              raise SystemExit('GameOver RecapImage import anchor not found')
          text = text.replace(old_import, new_import, 1)
          constants = "const CAROUSEL_INTERVAL_MS = 5000\nconst LOGO_SRC = `${import.meta.env.BASE_URL}assets/kolequant.png`\n"
          replacement = constants + "const EMPTY_AFTERMATH_STORIES: AftermathIssue['stories'] = []\n"
          if 'EMPTY_AFTERMATH_STORIES' not in text:
              if constants not in text:
                  raise SystemExit('GameOver constants anchor not found')
              text = text.replace(constants, replacement, 1)
          text = text.replace(
              '  const aftermathStories = aftermathIssue?.stories ?? []',
              '  const aftermathStories = aftermathIssue?.stories ?? EMPTY_AFTERMATH_STORIES',
              1,
          )
          path.write_text(text)

          test_path = Path('tests/unit/minigameBugfixes.regression.test.ts')
          test_text = test_path.read_text()
          test_text = test_text.replace(
              "import { normalizeTiltDelta } from '../../src/components/TiltLabyrinthComp/TiltLabyrinthComp'",
              "import { normalizeTiltDelta } from '../../src/components/TiltLabyrinthComp/tiltLabyrinthInput'",
              1,
          )
          test_path.write_text(test_text)
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format focused files
        run: >-
          npx prettier --write
          src/components/SeasonRecapCinematic/RecapImage.tsx
          src/components/SeasonRecapCinematic/recapImagePreload.ts
          src/components/TiltLabyrinthComp/tiltLabyrinthInput.ts
          tests/unit/minigameBugfixes.regression.test.ts

      - name: Verify formatting
        run: npm run format:check

      - name: Verify localization
        run: npm run validate:i18n

      - name: Run lint
        run: npm run lint:ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run focused tests
        run: >-
          npm test --
          tests/unit/minigameBugfixes.regression.test.ts
          tests/unit/chain-of-greed/ChainOfGreed.component.test.tsx

      - name: Ensure branch did not move
        run: |
          REMOTE_SHA=$(git ls-remote origin refs/heads/fix/minigame-bugs-20260806 | cut -f1)
          test "$REMOTE_SHA" = "$START_SHA" || {
            echo "Branch moved from $START_SHA to $REMOTE_SHA; refusing to overwrite it."
            exit 1
          }

      - name: Commit verified fixes and remove temporary workflow
        run: |
          git rm .github/workflows/fix-pr1347-lint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            package.json \
            scripts/check-localization.mjs \
            config/localization-source-review.json \
            src/components/SeasonRecapCinematic/RecapImage.tsx \
            src/components/SeasonRecapCinematic/recapImagePreload.ts \
            src/components/TiltLabyrinthComp/TiltLabyrinthComp.tsx \
            src/components/TiltLabyrinthComp/tiltLabyrinthInput.ts \
            src/screens/GameOver/GameOver.tsx \
            tests/unit/minigameBugfixes.regression.test.ts
          git commit -m "fix: resolve lint regressions without weakening CI"
          git push origin HEAD:fix/minigame-bugs-20260806
