name: Temporary localization option token fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'agent/add-localization-settings'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-localization-settings
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove ambiguous option tokens
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/check-localization.mjs')
          source = path.read_text()
          source = source.replace("  'option',\n", '')
          source = source.replace("  'options',\n", '')
          path.write_text(source)
          PY

      - name: Run localization guard self-tests
        run: node scripts/check-localization.mjs --self-test

      - name: Format localization guard
        run: npx prettier --write scripts/check-localization.mjs

      - name: Commit corrected detector
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No detector changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-localization.mjs
          git commit -m 'Correct localization option token detection'
          git push origin HEAD:agent/add-localization-settings
