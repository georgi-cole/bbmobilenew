name: Temporary Majority Rules Consensus Patcher

on:
  push:
    branches:
      - fix/majority-rules-consensus-balance

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/majority-rules-consensus-balance
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebalance Majority Rules consensus
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/majorityRules/helpers.ts')
          text = path.read_text()
          if 'const CONSENSUS_POWER' not in text:
              text = text.replace('const MIN_OPTION_WEIGHT = 0.05\n', 'const MIN_OPTION_WEIGHT = 0.05\nconst CONSENSUS_POWER = 2.2\n', 1)
          old = '  const weights = optionIds.map((optionId) => Math.max(MIN_OPTION_WEIGHT, scores[optionId] ?? 0))\n'
          new = '  const weights = optionIds.map(\n    (optionId) => Math.max(MIN_OPTION_WEIGHT, scores[optionId] ?? 0) ** CONSENSUS_POWER\n  )\n'
          if old in text:
              text = text.replace(old, new, 1)
          assert 'CONSENSUS_POWER' in text and '** CONSENSUS_POWER' in text
          path.write_text(text)
          PY
      - name: Format helper
        run: npx prettier --write src/features/majorityRules/helpers.ts
      - name: Commit consensus rebalance
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/majorityRules/helpers.ts
          git commit -m "fix: rebalance Majority Rules consensus"
          git push origin HEAD:fix/majority-rules-consensus-balance
