name: Patch House of Darkness ref sync

on:
  push:
    branches:
      - agent/add-house-of-darkness

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-house-of-darkness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Move contestant ref synchronization into an effect
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/HouseOfDarknessComp/HouseOfDarknessComp.tsx')
          source = path.read_text()
          old_ref = "  const contestantsRef = useRef(contestants);\n  contestantsRef.current = contestants;\n"
          new_ref = "  const contestantsRef = useRef(contestants);\n"
          timer_effect = "  useEffect(() => {\n    roundStartedAtRef.current = Date.now();\n  }, []);\n"
          synced_effect = timer_effect + "\n  useEffect(() => {\n    contestantsRef.current = contestants;\n  }, [contestants]);\n"

          if old_ref not in source:
              raise SystemExit('Expected render-time ref assignment was not found')
          if timer_effect not in source:
              raise SystemExit('Expected timer initialization effect was not found')

          source = source.replace(old_ref, new_ref, 1)
          source = source.replace(timer_effect, synced_effect, 1)
          path.write_text(source)
          PY
          npx prettier --write src/components/HouseOfDarknessComp/HouseOfDarknessComp.tsx
          npm run lint:ci
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/HouseOfDarknessComp/HouseOfDarknessComp.tsx
          git commit -m "Fix House of Darkness ref synchronization"
          git push origin HEAD:agent/add-house-of-darkness
