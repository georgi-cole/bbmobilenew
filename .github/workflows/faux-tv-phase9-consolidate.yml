name: Faux TV Phase 9 consolidation validation

on:
  push:
    branches: [codex/faux-tv-phase9-consolidation]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/faux-tv-phase9-consolidation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Consolidate duplicated Faux TV presentation registries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          tv_path = Path('src/components/ui/TvZone.tsx')
          text = tv_path.read_text()

          import_anchor = "import { getPhaseCardTemplate } from '../../broadcasting/broadcastTemplateCatalog'\n"
          presentation_import = """import {
            getBroadcastAnnouncementPresentation,
            isBroadcastPlayThroughAnnouncementKey,
            isBroadcastShockAnnouncementKey,
            isRecognizedBroadcastMajorKey,
          } from '../../broadcasting/broadcastPresentationRegistry'\n"""
          assert import_anchor in text
          assert 'broadcastPresentationRegistry' not in text
          text = text.replace(import_anchor, import_anchor + presentation_import, 1)

          config_start = text.index('// ─── Announcement configuration')
          winner_copy_start = text.index('// i18n-ignore: Canonical in-world winner announcement copy')
          text = text[:config_start] + text[winner_copy_start:]

          text = text.replace(
            'return MAJOR_KEYS.has(key) ? key : null',
            'return isRecognizedBroadcastMajorKey(key) ? key : null',
            1,
          )
          text = text.replace(
            'const meta = ANNOUNCEMENT_META[key] ?? {',
            'const meta = getBroadcastAnnouncementPresentation(key) ?? {',
            1,
          )

          play_start = text.index('const PLAY_THROUGH_ANNOUNCEMENT_KEYS = new Set([')
          play_end = text.index('const LEGACY_DAY_END_EVENT', play_start)
          text = text[:play_start] + text[play_end:]

          shock_pattern = re.compile(
            r"\n/\*\*\n \* Announcement keys that receive the cinematic fullscreen shock sequence:.*?\nconst SHOCK_ANNOUNCEMENT_KEYS = new Set\(\[.*?\n\]\)\n",
            re.S,
          )
          text, count = shock_pattern.subn('\n', text, count=1)
          assert count == 1

          text = text.replace('SHOCK_ANNOUNCEMENT_KEYS.has(', 'isBroadcastShockAnnouncementKey(')
          text = text.replace(
            'PLAY_THROUGH_ANNOUNCEMENT_KEYS.has(',
            'isBroadcastPlayThroughAnnouncementKey(',
          )

          for removed in (
            'MAJOR_KEYS',
            'ANNOUNCEMENT_META',
            'SHOCK_ANNOUNCEMENT_KEYS',
            'PLAY_THROUGH_ANNOUNCEMENT_KEYS',
          ):
            assert removed not in text
          for required in (
            'isRecognizedBroadcastMajorKey(key)',
            'getBroadcastAnnouncementPresentation(key)',
            'isBroadcastShockAnnouncementKey(initialKey)',
            'isBroadcastPlayThroughAnnouncementKey(activeAnnouncement.key)',
          ):
            assert required in text
          tv_path.write_text(text)

          overlay_path = Path('src/components/ui/TvAnnouncementOverlay/TvAnnouncementOverlay.tsx')
          overlay = overlay_path.read_text()
          overlay_import_anchor = "import type { CupidArrowPair, Player } from '../../../types'\n"
          overlay_import = "import { isBroadcastShockAnnouncementKey } from '../../../broadcasting/broadcastPresentationRegistry'\n"
          assert overlay_import_anchor in overlay
          assert 'broadcastPresentationRegistry' not in overlay
          overlay = overlay.replace(overlay_import_anchor, overlay_import_anchor + overlay_import, 1)

          fullscreen_pattern = re.compile(
            r"\nconst FULLSCREEN_SHOCK_KEYS = new Set\(\[.*?\n\]\)\n",
            re.S,
          )
          overlay, count = fullscreen_pattern.subn('\n', overlay, count=1)
          assert count == 1
          overlay = overlay.replace(
            'playShockPrelude ?? FULLSCREEN_SHOCK_KEYS.has(announcement.key)',
            'playShockPrelude ?? isBroadcastShockAnnouncementKey(announcement.key)',
            1,
          )
          assert 'FULLSCREEN_SHOCK_KEYS' not in overlay
          assert 'isBroadcastShockAnnouncementKey(announcement.key)' in overlay
          overlay_path.write_text(overlay)
          PY

      - name: Format touched files
        run: >-
          npx prettier --write
          src/broadcasting/broadcastPresentationRegistry.ts
          src/components/ui/TvZone.tsx
          src/components/ui/TvAnnouncementOverlay/TvAnnouncementOverlay.tsx
          tests/broadcastPresentationRegistry.test.ts

      - name: Focused consolidation tests
        run: >-
          npx vitest run
          tests/broadcastPresentationRegistry.test.ts
          tests/fauxTv.phase0.characterization.test.tsx
          tests/broadcastEditorialPolicy.test.ts
          tests/activityService.routing.test.ts
          tests/broadcastTemplateCatalog.test.ts
          tests/programmingDesk.test.ts
          tests/fauxTvProgrammingController.test.tsx
          tests/seasonDesk.test.ts
          tests/weatherEditorial.test.ts
          --reporter=verbose

      - name: Differential regression suite versus Phase 9 base
        shell: bash
        run: |
          TEST_FILES=(
            tests/broadcastQueue.presentation.test.tsx
            src/components/ui/__tests__/TvZone.announcement.test.tsx
            src/components/ui/__tests__/TvZone.saveChip.test.tsx
            src/components/ui/__tests__/TvZone.screenStyle.test.tsx
            tests/unit/ui/TvZone.twist.test.tsx
            tests/broadcastManager.reducer.test.ts
            tests/broadcastManager.voxCatalog.test.ts
            tests/broadcastManager.architecture.test.ts
            tests/broadcastConfigPersistence.test.ts
            tests/broadcastTemplateCatalog.test.ts
            src/weather/__tests__/weatherRuntime.test.ts
            src/weather/__tests__/weatherTemperatureUnit.test.ts
            src/broadcasting/__tests__/dailyMoodSystem.test.ts
            src/onboarding/__tests__/seasonOnboardingQueue.test.ts
            src/onboarding/__tests__/seasonTutorialPreference.test.ts
            tests/specialVeto.flow.test.ts
            tests/integration/specialVeto.activation.test.tsx
            tests/integration/ceremony.fixes.test.tsx
            tests/doubleEviction.flow.test.ts
            tests/integration/jury.transition.test.tsx
            tests/seasonFinale.flow.test.ts
            tests/endgame.flow.test.ts
            tests/integration/social.engine.test.ts
            tests/integration/social.lifecycle.test.ts
            tests/integration/social.eventdeltas.test.ts
            tests/social/socialFixes.test.ts
          )

          set +e
          npx vitest run "${TEST_FILES[@]}" --reporter=json --outputFile=/tmp/candidate-phase9.json
          candidate_rc=$?
          git worktree add --detach /tmp/phase9-base 2c71fda8ee425f096c863dba7e3404a4156aa40f
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/phase9-base/node_modules
          cd /tmp/phase9-base
          "$GITHUB_WORKSPACE/node_modules/.bin/vitest" run "${TEST_FILES[@]}" --reporter=json --outputFile=/tmp/base-phase9.json
          base_rc=$?
          cd "$GITHUB_WORKSPACE"
          set -e

          CANDIDATE_RC="$candidate_rc" BASE_RC="$base_rc" python - <<'PY'
          import json
          import os
          from pathlib import Path

          def summary(path):
              data = json.loads(Path(path).read_text())
              failures = sorted(
                  assertion.get('fullName', assertion.get('title', ''))
                  for suite in data.get('testResults', [])
                  for assertion in suite.get('assertionResults', [])
                  if assertion.get('status') == 'failed'
              )
              return {
                  'failures': failures,
                  'tests': data.get('numTotalTests'),
                  'passed': data.get('numPassedTests'),
                  'failed': data.get('numFailedTests'),
                  'suites': data.get('numTotalTestSuites'),
              }

          candidate = summary('/tmp/candidate-phase9.json')
          baseline = summary('/tmp/base-phase9.json')
          print('candidate Phase 9 summary:', candidate)
          print('base Phase 9 summary:', baseline)
          assert candidate['failures'] == baseline['failures'], 'Phase 9 introduced a different failure set'
          assert candidate['tests'] == baseline['tests'], 'Phase 9 common-suite test count changed'
          assert int(os.environ['CANDIDATE_RC']) == int(os.environ['BASE_RC']), 'Phase 9 exit code differs from base'
          PY

      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint:ci
      - name: Release build
        run: npm run build
      - name: Confirm normal CI workflow untouched
        run: git diff --exit-code 2c71fda8ee425f096c863dba7e3404a4156aa40f -- .github/workflows/ci.yml

      - name: Commit consolidation and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/faux-tv-phase9-consolidate.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Consolidate Faux TV presentation metadata"
          git push origin HEAD:codex/faux-tv-phase9-consolidation
