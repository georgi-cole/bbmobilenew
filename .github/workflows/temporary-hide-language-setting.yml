name: Temporary language flag wiring

on:
  push:
    branches:
      - agent/hide-language-setting

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hide-language-setting
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Hide language selector behind feature flag
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/screens/Settings/Settings.tsx')
          source = path.read_text()

          import_marker = "import ConfirmExitModal from '../../components/ConfirmExitModal/ConfirmExitModal'\n"
          flag_import = "import { FEATURE_LOCALIZATION_SETTINGS } from '../../config/featureFlags'\n"
          if flag_import not in source:
              assert import_marker in source
              source = source.replace(import_marker, import_marker + flag_import, 1)

          old = """  const sections: SettingSection[] = [
    {
      id: 'localization',
      items: [
        {
          type: 'dropdown',
          id: 'language',
          label: t('settings.language'),
          options: languageOptions,
          get: (s) => s.localization.language,
          onChange: (settingsDispatch, val) =>
            settingsDispatch(setLocalization({ language: val as LanguagePreference })),
          description: t('settings.language.description'),
        },
      ],
    },
    {
      id: 'audio',
"""
          new = """  const localizationSections: SettingSection[] = FEATURE_LOCALIZATION_SETTINGS
    ? [
        {
          id: 'localization',
          items: [
            {
              type: 'dropdown',
              id: 'language',
              label: t('settings.language'),
              options: languageOptions,
              get: (s) => s.localization.language,
              onChange: (settingsDispatch, val) =>
                settingsDispatch(setLocalization({ language: val as LanguagePreference })),
              description: t('settings.language.description'),
            },
          ],
        },
      ]
    : []

  const sections: SettingSection[] = [
    ...localizationSections,
    {
      id: 'audio',
"""
          assert old in source
          source = source.replace(old, new, 1)
          path.write_text(source)
          PY
      - run: npx prettier --write src/screens/Settings/Settings.tsx src/config/featureFlags.ts
      - run: npm run validate:i18n
      - run: npm run lint:ci
      - run: npm run typecheck
      - name: Commit wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/screens/Settings/Settings.tsx src/config/featureFlags.ts
          git commit -m 'Hide language setting behind feature flag'
          git push origin HEAD:agent/hide-language-setting
