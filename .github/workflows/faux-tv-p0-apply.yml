name: Faux TV P0 apply

on:
  push:
    branches: [codex/faux-tv-p0-editorial-contract]

permissions:
  contents: read

jobs:
  diagnose-p0-presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/faux-tv-p0-editorial-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply approved P0 candidate in runner only
        run: |
          python .github/scripts/faux_tv_p0_finish.py
          python .github/scripts/faux_tv_p0_add_test.py
          npx prettier --write src/broadcasting/broadcastTemplateCatalog.ts src/store/gameSlice.ts tests/fauxTv.p0.mechanicalCleanup.test.ts

      - name: Capture exact broader presentation regression against main
        shell: bash
        run: |
          mapfile -t files < <(
            find tests src -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) |
              grep -Ei '(broadcast|activityService|TvZone|safety|veto|onboarding|weather|eviction)' |
              grep -v '^src/components/ui/__tests__/TvZone\.announcement\.test\.tsx$' |
              grep -v '^tests/broadcastManager\.reducer\.test\.ts$' |
              grep -v '^tests/broadcastQueue\.presentation\.test\.tsx$' |
              sort -u
          )
          printf '%s\n' "${files[@]}" > /tmp/p0-broader-files.txt
          test "${#files[@]}" -gt 0

          set +e
          npx vitest run "${files[@]}" --reporter=json --outputFile=/tmp/p0-broader-candidate.json
          candidate_rc=$?
          set -e

          git worktree add --detach /tmp/p0-main origin/main
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/p0-main/node_modules
          mapfile -t main_files < <(
            cd /tmp/p0-main
            find tests src -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) |
              grep -Ei '(broadcast|activityService|TvZone|safety|veto|onboarding|weather|eviction)' |
              grep -v '^src/components/ui/__tests__/TvZone\.announcement\.test\.tsx$' |
              grep -v '^tests/broadcastManager\.reducer\.test\.ts$' |
              grep -v '^tests/broadcastQueue\.presentation\.test\.tsx$' |
              sort -u
          )
          set +e
          cd /tmp/p0-main
          "$GITHUB_WORKSPACE/node_modules/.bin/vitest" run "${main_files[@]}" --reporter=json --outputFile=/tmp/p0-broader-main.json
          main_rc=$?
          cd "$GITHUB_WORKSPACE"
          set -e

          CANDIDATE_RC="$candidate_rc" MAIN_RC="$main_rc" python - <<'PY'
          import json
          import os
          from pathlib import Path

          def failures(path):
              data = json.loads(Path(path).read_text())
              out = []
              for suite in data.get('testResults', []):
                  for assertion in suite.get('assertionResults', []):
                      if assertion.get('status') != 'failed':
                          continue
                      out.append({
                          'file': suite.get('name'),
                          'fullName': assertion.get('fullName', assertion.get('title', '')),
                          'title': assertion.get('title'),
                          'ancestorTitles': assertion.get('ancestorTitles', []),
                          'failureMessages': assertion.get('failureMessages', []),
                      })
              return {
                  'numTotalTests': data.get('numTotalTests'),
                  'numFailedTests': data.get('numFailedTests'),
                  'failures': out,
              }

          report = {
              'candidateRc': int(os.environ['CANDIDATE_RC']),
              'mainRc': int(os.environ['MAIN_RC']),
              'files': Path('/tmp/p0-broader-files.txt').read_text().splitlines(),
              'candidate': failures('/tmp/p0-broader-candidate.json'),
              'main': failures('/tmp/p0-broader-main.json'),
          }
          Path('/tmp/p0-broader-summary.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY

      - name: Upload exact P0 broader regression evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-broader-regression-evidence
          path: |
            /tmp/p0-broader-summary.json
            /tmp/p0-broader-candidate.json
            /tmp/p0-broader-main.json
            /tmp/p0-broader-files.txt
          if-no-files-found: error
