name: Faux TV P0 apply

on:
  push:
    branches: [codex/faux-tv-p0-editorial-contract]

permissions:
  contents: write

jobs:
  finish-p0:
    if: ${{ !contains(github.event.head_commit.message, '[p0-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/faux-tv-p0-editorial-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply narrow P0 integration and finalize direct tests
        shell: bash
        run: |
          python .github/scripts/faux_tv_p0_finish.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/fauxTv.p0.mechanicalCleanup.test.ts')
          text = path.read_text()
          needle = "  it('keeps a template without editorial metadata on the legacy foreground path', () => {\n"
          insert = """  it('explicit producer editorial metadata overrides the template editorial default', () => {
            let state = gameReducer(undefined, { type: 'init' })
            state = { ...state, phase: 'loh_comp', tvFeed: [], broadcastQueue: [] }
            state = gameReducer(
              state,
              addTvEvent({
                text: 'The Leader of the House competition has begun! 🏆 Who will win power today?',
                type: 'game',
                meta: {
                  phase: 'loh_comp',
                  broadcastTemplateId: 'loh.competition-start',
                  editorial: {
                    importance: 'critical',
                    presentationMode: 'interrupt',
                    category: 'producer-override',
                  },
                },
              })
            )

            const emitted = state.tvFeed.find(
              (candidate) => candidate.meta?.broadcastTemplateId === 'loh.competition-start'
            )
            expect(emitted).toBeDefined()
            expect(emitted?.meta?.editorial).toEqual({
              importance: 'critical',
              presentationMode: 'interrupt',
              category: 'producer-override',
            })
          })

"""
          if needle not in text:
              raise SystemExit('missing legacy test insertion point')
          text = text.replace(needle, insert + needle, 1)
          path.write_text(text)
          PY
          npx prettier --write src/broadcasting/broadcastTemplateCatalog.ts src/store/gameSlice.ts tests/fauxTv.p0.mechanicalCleanup.test.ts
          git rm -f .github/workflows/faux-tv-p0-apply.yml .github/scripts/faux_tv_p0_finish.py
          rm -f .github/p0-presentation-report.json .github/p0-presentation-failure.txt .github/p0-tvzone-comparison.txt
          git add -u .github

      - name: Focused materialization and Force-to-TV regressions
        run: npx vitest run tests/fauxTv.p0.mechanicalCleanup.test.ts --reporter=verbose

      - name: Faux TV P0 characterization and policy suite
        run: npx vitest run tests/fauxTv.p0.characterization.test.ts tests/fauxTv.p0.policy.test.ts tests/fauxTv.p0.mechanicalCleanup.test.ts --reporter=verbose

      - name: Prove TvZone regression is unchanged from main baseline
        shell: bash
        run: |
          set +e
          npx vitest run src/components/ui/__tests__/TvZone.announcement.test.tsx --reporter=json --outputFile=/tmp/tvzone-p0.json
          p0_rc=$?
          git worktree add --detach /tmp/p0-main origin/main
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/p0-main/node_modules
          cd /tmp/p0-main
          "$GITHUB_WORKSPACE/node_modules/.bin/vitest" run src/components/ui/__tests__/TvZone.announcement.test.tsx --reporter=json --outputFile=/tmp/tvzone-main.json
          main_rc=$?
          cd "$GITHUB_WORKSPACE"
          set -e
          python - <<'PY'
          import json
          from pathlib import Path

          def failures(path):
              data = json.loads(Path(path).read_text())
              rows = []
              for suite in data.get('testResults', []):
                  for assertion in suite.get('assertionResults', []):
                      if assertion.get('status') == 'failed':
                          rows.append(assertion.get('fullName', assertion.get('title', '')))
              return data.get('numTotalTests'), rows

          main_total, main_failed = failures('/tmp/tvzone-main.json')
          p0_total, p0_failed = failures('/tmp/tvzone-p0.json')
          print('main:', main_total, len(main_failed))
          print('p0:', p0_total, len(p0_failed))
          print('\n'.join(p0_failed))
          if main_total != p0_total or main_failed != p0_failed:
              raise SystemExit('TvZone failure set differs from main baseline')
          if len(main_failed) != 13:
              raise SystemExit(f'Expected the verified 13 baseline TvZone failures, got {len(main_failed)}')
          PY

      - name: Broader presentation regressions excluding verified baseline TvZone file
        shell: bash
        run: |
          mapfile -t files < <(
            find tests src -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) |
              grep -Ei '(broadcast|activityService|TvZone|safety|veto|onboarding|weather|eviction)' |
              grep -v '^src/components/ui/__tests__/TvZone\.announcement\.test\.tsx$' |
              sort -u
          )
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -gt 0
          npx vitest run "${files[@]}" --reporter=verbose

      - name: Required focused presentation and flow suites
        shell: bash
        run: |
          npx vitest run tests/broadcastQueue.presentation.test.tsx --reporter=verbose
          npx vitest run tests/broadcastManager.reducer.test.ts --reporter=verbose
          npx vitest run tests/activityService.test.ts --reporter=verbose
          npx vitest run tests/gameSlice.secretImmunity.test.ts tests/gameSlice.ffmHalo.test.ts tests/gameSlice.coupdEtat.test.ts --reporter=verbose
          npx vitest run tests/weekEnd.onboarding.test.ts --reporter=verbose
          mapfile -t eviction_files < <(find tests src -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) | grep -Ei 'eviction' | sort -u)
          if [ "${#eviction_files[@]}" -gt 0 ]; then npx vitest run "${eviction_files[@]}" --reporter=verbose; fi
          mapfile -t weather_files < <(find tests src -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) | grep -Ei 'weather' | sort -u)
          if [ "${#weather_files[@]}" -gt 0 ]; then npx vitest run "${weather_files[@]}" --reporter=verbose; fi

      - name: Full automated suite excluding verified pre-existing TvZone file
        run: npx vitest run --exclude src/components/ui/__tests__/TvZone.announcement.test.tsx

      - name: Standard static quality gates
        run: |
          npm run test:guard
          npm run format:check
          npm run lint:ci
          npm run typecheck

      - name: Standard CI lifecycle regressions and dependency audit
        run: |
          npx vitest run src/modes/seasonRulesets.test.ts src/screens/ProfilePicker/ProfilePicker.test.tsx src/screens/HomeHub/__tests__/HomeHub.test.tsx
          npm audit --omit=dev --audit-level=high

      - name: Production builds
        run: |
          npm run build
          npm run build:mobile

      - name: Final P0 scope and cleanup audit
        shell: bash
        run: |
          test ! -e .github/workflows/faux-tv-p0-apply.yml
          test ! -e .github/scripts/faux_tv_p0_finish.py
          test ! -e .github/p0-presentation-report.json
          test ! -e .github/p0-presentation-failure.txt
          test ! -e .github/p0-tvzone-comparison.txt
          git diff --exit-code origin/main -- .github/workflows/ci.yml
          if grep -R "P0 TRACE\|p0-presentation\|p0-tvzone-comparison" -n src tests .github 2>/dev/null; then exit 1; fi
          git status --short
          git diff -- src/broadcasting/broadcastTemplateCatalog.ts src/store/gameSlice.ts tests/fauxTv.p0.mechanicalCleanup.test.ts

      - name: Commit validated P0
        shell: bash
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finish Faux TV P0 presentation materialization [p0-final]"
          git push origin HEAD:codex/faux-tv-p0-editorial-contract
