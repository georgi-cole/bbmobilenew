name: Faux TV P0 apply

on:
  push:
    branches: [codex/faux-tv-p0-editorial-contract]

permissions:
  contents: write

jobs:
  compare-tvzone-regression:
    if: ${{ !contains(github.event.head_commit.message, '[p0-report]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/faux-tv-p0-editorial-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run TvZone file before materialization patch
        shell: bash
        run: |
          set +e
          npx vitest run src/components/ui/__tests__/TvZone.announcement.test.tsx --reporter=json --outputFile=/tmp/tvzone-before.json
          echo $? > /tmp/tvzone-before.rc
          exit 0
      - name: Run TvZone file on main baseline
        shell: bash
        run: |
          set +e
          git worktree add --detach /tmp/p0-main origin/main
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/p0-main/node_modules
          cd /tmp/p0-main
          "$GITHUB_WORKSPACE/node_modules/.bin/vitest" run src/components/ui/__tests__/TvZone.announcement.test.tsx --reporter=json --outputFile=/tmp/tvzone-main.json
          echo $? > /tmp/tvzone-main.rc
          exit 0
      - name: Apply narrow P0 integration
        run: |
          python .github/scripts/faux_tv_p0_finish.py
          npx prettier --write src/broadcasting/broadcastTemplateCatalog.ts src/store/gameSlice.ts tests/fauxTv.p0.mechanicalCleanup.test.ts
      - name: Run TvZone file after materialization patch
        shell: bash
        run: |
          set +e
          npx vitest run src/components/ui/__tests__/TvZone.announcement.test.tsx --reporter=json --outputFile=/tmp/tvzone-after.json
          echo $? > /tmp/tvzone-after.rc
          exit 0
      - name: Persist comparison summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def read_report(path):
              data = json.loads(Path(path).read_text())
              failures = []
              for suite in data.get('testResults', []):
                  for a in suite.get('assertionResults', []):
                      if a.get('status') == 'failed':
                          msg = (a.get('failureMessages') or [''])[0]
                          concise = []
                          for line in msg.splitlines():
                              if ('Unable to find' in line or 'expected' in line.lower() or 'received' in line.lower() or 'AssertionError' in line or 'Error:' in line):
                                  concise.append(line.strip())
                          failures.append((a.get('fullName', a.get('title', '')), ' | '.join(concise[:8]) or msg[:500].replace('\n', ' | ')))
              return data.get('numTotalTests'), data.get('numFailedTests'), failures

          out = []
          for label, path, rc_path in [
              ('main', '/tmp/tvzone-main.json', '/tmp/tvzone-main.rc'),
              ('branch-before-materialization', '/tmp/tvzone-before.json', '/tmp/tvzone-before.rc'),
              ('branch-after-materialization', '/tmp/tvzone-after.json', '/tmp/tvzone-after.rc'),
          ]:
              total, failed, failures = read_report(path)
              out.append(f'## {label}: rc={Path(rc_path).read_text().strip()} total={total} failed={failed}')
              for name, msg in failures:
                  out.append(f'- {name}')
                  out.append(f'  {msg}')
          Path('.github/p0-tvzone-comparison.txt').write_text('\n'.join(out) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/p0-tvzone-comparison.txt
          git commit -m "chore: capture TvZone P0 comparison [p0-report]"
          git push origin HEAD:codex/faux-tv-p0-editorial-contract
