name: Faux TV P0 apply

on:
  push:
    branches: [codex/faux-tv-p0-editorial-contract]

permissions:
  contents: write

jobs:
  compare-broadcast-manager:
    if: ${{ !contains(github.event.head_commit.message, '[p0-bm-report]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/faux-tv-p0-editorial-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Branch before fresh materialization
        shell: bash
        run: |
          set +e
          npx vitest run tests/broadcastManager.reducer.test.ts --reporter=json --outputFile=/tmp/bm-before.json
          exit 0
      - name: Main baseline
        shell: bash
        run: |
          set +e
          git worktree add --detach /tmp/p0-main origin/main
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/p0-main/node_modules
          cd /tmp/p0-main
          "$GITHUB_WORKSPACE/node_modules/.bin/vitest" run tests/broadcastManager.reducer.test.ts --reporter=json --outputFile=/tmp/bm-main.json
          exit 0
      - name: Branch after fresh materialization
        shell: bash
        run: |
          python .github/scripts/faux_tv_p0_finish.py
          python .github/scripts/faux_tv_p0_add_test.py
          npx prettier --write src/broadcasting/broadcastTemplateCatalog.ts src/store/gameSlice.ts tests/fauxTv.p0.mechanicalCleanup.test.ts
          set +e
          npx vitest run tests/broadcastManager.reducer.test.ts --reporter=json --outputFile=/tmp/bm-after.json
          exit 0
      - name: Persist comparison
        shell: bash
        run: |
          python -c "import json; from pathlib import Path; f=lambda p:(lambda d:(d.get('numTotalTests'),[(a.get('fullName',a.get('title','')),(a.get('failureMessages') or [''])[0].splitlines()[0] if (a.get('failureMessages') or []) else '') for s in d.get('testResults',[]) for a in s.get('assertionResults',[]) if a.get('status')=='failed']))(json.loads(Path(p).read_text())); rows=[]; [(rows.extend(['## '+label+' total='+str(f(path)[0])+' failed='+str(len(f(path)[1]))]+['- '+n+' :: '+m for n,m in f(path)[1]])) for label,path in [('main','/tmp/bm-main.json'),('branch-before-materialization','/tmp/bm-before.json'),('branch-after-materialization','/tmp/bm-after.json')]]; Path('.github/p0-broadcast-manager-comparison.txt').write_text('\\n'.join(rows)+'\\n')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/p0-broadcast-manager-comparison.txt
          git commit -m "chore: capture Broadcast Manager P0 comparison [p0-bm-report]"
          git push origin HEAD:codex/faux-tv-p0-editorial-contract
