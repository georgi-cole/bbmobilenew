name: Faux TV P0 apply

on:
  push:
    branches: [codex/faux-tv-p0-editorial-contract]

permissions:
  contents: write

jobs:
  finish-p0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/faux-tv-p0-editorial-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply narrow P0 integration
        run: python .github/scripts/faux_tv_p0_finish.py
      - name: Format changed implementation files
        run: npx prettier --write src/broadcasting/broadcastTemplateCatalog.ts src/store/gameSlice.ts tests/fauxTv.p0.mechanicalCleanup.test.ts
      - run: npm ci
      - name: Focused materialization and Force-to-TV regressions
        run: npx vitest run tests/fauxTv.p0.mechanicalCleanup.test.ts --reporter=verbose
      - name: Faux TV P0 characterization and policy suite
        run: npx vitest run tests/fauxTv.p0.characterization.test.ts tests/fauxTv.p0.policy.test.ts tests/fauxTv.p0.mechanicalCleanup.test.ts --reporter=verbose
      - name: Relevant Faux TV presentation regressions
        shell: bash
        run: |
          files=$(find tests src -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) | grep -Ei '(broadcast|activityService|TvZone|safety|veto|onboarding|weather|eviction)' | sort -u | tr '\n' ' ')
          echo "$files"
          test -n "$files"
          npx vitest run $files --reporter=verbose
      - name: Full automated test suite
        run: npx vitest run
      - name: Test guard
        run: npm run test:guard
      - name: Formatting check
        run: npm run format:check
      - name: Lint without warnings
        run: npm run lint:ci
      - name: Type check
        run: npm run typecheck
      - name: Web production build
        run: npm run build
      - name: Capacitor mobile-mode build
        run: npm run build:mobile
      - name: Verify P0 scope and normal CI
        shell: bash
        run: |
          git diff --exit-code origin/main -- .github/workflows/ci.yml
          if grep -R "P0 TRACE" -n src tests; then exit 1; fi
          git diff -- src/broadcasting/broadcastTemplateCatalog.ts src/store/gameSlice.ts tests/fauxTv.p0.mechanicalCleanup.test.ts
      - name: Commit validated P0 and remove temporary infrastructure
        shell: bash
        run: |
          git rm .github/workflows/faux-tv-p0-apply.yml .github/scripts/faux_tv_p0_finish.py
          git add src/broadcasting/broadcastTemplateCatalog.ts src/store/gameSlice.ts tests/fauxTv.p0.mechanicalCleanup.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finish Faux TV P0 presentation materialization"
          git push origin HEAD:codex/faux-tv-p0-editorial-contract
