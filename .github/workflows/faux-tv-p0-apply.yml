name: Faux TV P0 apply

on:
  push:
    branches: [codex/faux-tv-p0-editorial-contract]

permissions:
  contents: write

jobs:
  isolate-presentation-regression:
    if: ${{ !contains(github.event.head_commit.message, '[p0-report]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/faux-tv-p0-editorial-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply narrow P0 integration
        run: python .github/scripts/faux_tv_p0_finish.py
      - name: Format changed implementation files
        run: npx prettier --write src/broadcasting/broadcastTemplateCatalog.ts src/store/gameSlice.ts tests/fauxTv.p0.mechanicalCleanup.test.ts
      - run: npm ci
      - name: Confirm focused P0 tests remain green
        run: |
          npx vitest run tests/fauxTv.p0.mechanicalCleanup.test.ts --reporter=verbose
          npx vitest run tests/fauxTv.p0.characterization.test.ts tests/fauxTv.p0.policy.test.ts tests/fauxTv.p0.mechanicalCleanup.test.ts --reporter=verbose
      - name: Isolate first failing presentation regression
        shell: bash
        run: |
          set +e
          mapfile -t files < <(
            find tests src -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) |
              grep -Ei '(broadcast|activityService|TvZone|safety|veto|onboarding|weather|eviction)' |
              sort -u
          )
          test "${#files[@]}" -gt 0 || exit 2
          rm -f .github/p0-presentation-report.json .github/p0-presentation-failure.txt
          failed_file=''
          for file in "${files[@]}"; do
            echo "Testing $file"
            npx vitest run "$file" --reporter=json --outputFile=.github/p0-presentation-report.json
            rc=$?
            if [ "$rc" -ne 0 ]; then
              failed_file="$file"
              printf '%s\n' "$file" > .github/p0-presentation-failure.txt
              break
            fi
          done
          if [ -z "$failed_file" ]; then
            joined=$(printf '%q ' "${files[@]}")
            eval "npx vitest run $joined --reporter=json --outputFile=.github/p0-presentation-report.json"
            rc=$?
            if [ "$rc" -ne 0 ]; then
              printf '%s\n' 'BATCH_ONLY_FAILURE' > .github/p0-presentation-failure.txt
            else
              printf '%s\n' 'NO_FAILURE_REPRODUCED' > .github/p0-presentation-failure.txt
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/p0-presentation-report.json .github/p0-presentation-failure.txt
          git commit -m "chore: capture P0 presentation failure [p0-report]"
          git push origin HEAD:codex/faux-tv-p0-editorial-contract
          exit 0
