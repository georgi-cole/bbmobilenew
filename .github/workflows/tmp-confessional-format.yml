name: Temporary Confessional formatter

on:
  push:
    branches: [agent/confessional-flow-v2]

permissions:
  contents: write

jobs:
  format-confessional:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/confessional-flow-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format updated Confessional files
        run: >-
          npx prettier --write
          src/screens/DiaryRoom/ConfessionalRoute.tsx
          src/screens/DiaryRoom/RequiredConfessionalSession.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/screens/DiaryRoom/ConfessionalRoute.tsx src/screens/DiaryRoom/RequiredConfessionalSession.tsx
          git commit -m "Format Confessional lint fix"
          git push origin HEAD:agent/confessional-flow-v2
