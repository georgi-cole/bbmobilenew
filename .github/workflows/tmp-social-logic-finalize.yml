name: Temporary final Social logic validation

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/social-ux-realism-regressions' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/social-ux-realism-regressions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply final logic corrections
        run: python3 scripts/tmp-social-logic-finalize.py
      - name: Format all changed files
        shell: bash
        run: |
          git fetch origin main --depth=1
          mapfile -t files < <(
            {
              git diff --name-only origin/main...HEAD
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u | grep -E '\.(ts|tsx|css|json|py|yml|yaml)$' || true
          )
          if (( ${#files[@]} > 0 )); then
            npx prettier --write "${files[@]}"
          fi
      - name: Run focused regression suite
        shell: bash
        run: |
          mkdir -p docs
          set +e
          npx vitest run \
            src/social/__tests__/incomingInteractionAutonomy.test.ts \
            src/components/IncomingInteractionsInbox/__tests__/IncomingInteractionsInbox.test.tsx \
            src/components/HousePulse/__tests__/HousePulse.test.tsx \
            src/social/__tests__/socialPremiumHardening.test.ts \
            src/social/__tests__/socialLivelinessRestoration.test.ts \
            tests/social/socialCommitments.unit.test.ts \
            src/publicOpinion/__tests__/AudiencePulseService.test.ts \
            tests/unit/publicOpinion/publicOpinionMiddleware.test.ts \
            > docs/.social-final-tests.txt 2>&1
          status=$?
          set -e
          if (( status != 0 )); then
            printf '\nTEST_EXIT_CODE=%s\n' "$status" >> docs/.social-final-tests.txt
            exit "$status"
          fi
          rm -f docs/.social-final-tests.txt
      - name: Run static validation
        shell: bash
        run: |
          set +e
          {
            npm run typecheck
            npm run lint:ci
            npm run format:check
          } > docs/.social-final-static.txt 2>&1
          status=$?
          set -e
          if (( status != 0 )); then
            printf '\nSTATIC_EXIT_CODE=%s\n' "$status" >> docs/.social-final-static.txt
            exit "$status"
          fi
          rm -f docs/.social-final-static.txt
      - name: Remove temporary implementation tools
        run: |
          git rm .github/workflows/tmp-social-logic-finalize.yml
          git rm scripts/tmp-social-logic-finalize.py
      - name: Commit final corrections
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests docs
          git commit -m "Finalize Social role and knowledge logic"
          git push origin HEAD:fix/social-ux-realism-regressions
