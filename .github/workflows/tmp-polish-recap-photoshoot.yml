name: Temporary polish recap photoshoot

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/fix-season-recap-broadcast-story' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-season-recap-broadcast-story
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Keep the photoshoot full-screen in reduced motion
        shell: python
        run: |
          from pathlib import Path

          component_path = Path('src/components/SeasonRecapCinematic/SeasonRecapCinematic.tsx')
          component = component_path.read_text()
          old_effect = """  useEffect(() => {
    if (reducedMotion) return
    const timer = window.setTimeout(() => setActivePhoto(1), 3_350)
    return () => window.clearTimeout(timer)
  }, [reducedMotion])
"""
          new_effect = """  useEffect(() => {
    const timer = window.setTimeout(() => setActivePhoto(1), reducedMotion ? 3_600 : 3_350)
    return () => window.clearTimeout(timer)
  }, [reducedMotion])
"""
          old_media = """        {reducedMotion ? (
          <div className="src-broadcast-photoshoot__reduced-grid">
            {photos.map((photo) => (
              <img key={photo.src} src={photo.src} alt={photo.alt} />
            ))}
          </div>
        ) : (
          <AnimatePresence mode="wait" initial={false}>
            <motion.img
              key={photos[activePhoto]?.src}
              src={photos[activePhoto]?.src}
              alt={photos[activePhoto]?.alt}
              initial={{ opacity: 0, scale: 1.035 }}
              animate={{ opacity: 1, scale: 1 }}
              exit={{ opacity: 0, scale: 0.985 }}
              transition={{ duration: 0.72, ease: [0.22, 1, 0.36, 1] }}
            />
          </AnimatePresence>
        )}
"""
          new_media = """        <AnimatePresence mode="wait" initial={false}>
          <motion.img
            key={photos[activePhoto]?.src}
            src={photos[activePhoto]?.src}
            alt={photos[activePhoto]?.alt}
            initial={{ opacity: 0, scale: reducedMotion ? 1 : 1.035 }}
            animate={{ opacity: 1, scale: 1 }}
            exit={{ opacity: 0, scale: reducedMotion ? 1 : 0.985 }}
            transition={{
              duration: reducedMotion ? 0 : 0.72,
              ease: [0.22, 1, 0.36, 1],
            }}
          />
        </AnimatePresence>
"""
          if old_effect not in component or old_media not in component:
              raise SystemExit('Recap photoshoot blocks were not found')
          component = component.replace(old_effect, new_effect, 1).replace(old_media, new_media, 1)
          component_path.write_text(component)

          finale_path = Path('e2e/playwright/finale.spec.ts')
          finale = finale_path.read_text()
          marker = "    await expect(recap.locator('.src-cast-grid')).toHaveCount(0)\n"
          wait_line = "    await page.waitForTimeout(750)\n"
          if marker not in finale:
              raise SystemExit('Recap visual capture marker was not found')
          if wait_line not in finale:
              finale = finale.replace(marker, marker + wait_line, 1)
          finale_path.write_text(finale)
      - run: >-
          npx prettier --write
          src/components/SeasonRecapCinematic/SeasonRecapCinematic.tsx
          e2e/playwright/finale.spec.ts
      - name: Commit polish and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/tmp-polish-recap-photoshoot.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Polish recap photoshoot presentation"
          git push origin HEAD:agent/fix-season-recap-broadcast-story
