name: Temporary Eviction Parity Formatter

on:
  push:
    branches:
      - fix/eviction-mobile-quality-parity

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/eviction-mobile-quality-parity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format eviction parity CSS
        run: npx prettier --write src/components/Eviction/SpotlightEvictionOverlayParity.css
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Eviction/SpotlightEvictionOverlayParity.css
          git commit -m "Format eviction parity CSS"
          git push origin HEAD:fix/eviction-mobile-quality-parity
