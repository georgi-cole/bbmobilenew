name: Temporary nanoid lockfile fix

on:
  push:
    branches:
      - agent/single-active-season-rulesets

permissions:
  contents: write

jobs:
  fix-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/single-active-season-rulesets
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply production audit fix to lockfile only
        run: npm audit fix --package-lock-only --omit=dev
      - name: Verify only the lockfile changed
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No lockfile change was produced."
            exit 1
          fi
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "package-lock.json" ]; then
            printf 'Unexpected changed files:\n%s\n' "${changed[*]}"
            exit 1
          fi
      - name: Verify production audit is clean
        run: npm audit --omit=dev --audit-level=high
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Fix nanoid production audit advisory"
          git push origin HEAD:agent/single-active-season-rulesets
