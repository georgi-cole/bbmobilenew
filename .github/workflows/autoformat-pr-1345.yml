name: Autoformat PR 1345

on:
  push:
    branches:
      - fix/prod-debug-and-multimode-saves

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/prod-debug-and-multimode-saves
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: |
          npx prettier --write \
            src/components/SaveRecoveryNotice/SaveRecoveryNotice.tsx \
            e2e/playwright/finale.spec.ts \
            src/store/saveStatePersistence.ts

      - name: Remove temporary workflow and push formatting
        run: |
          git rm .github/workflows/autoformat-pr-1345.yml
          git add \
            src/components/SaveRecoveryNotice/SaveRecoveryNotice.tsx \
            e2e/playwright/finale.spec.ts \
            src/store/saveStatePersistence.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format persistence changes"
          git push origin HEAD:fix/prod-debug-and-multimode-saves
