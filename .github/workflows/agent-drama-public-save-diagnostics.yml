name: Drama Public Save Diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  diagnose-and-format:
    if: github.event.pull_request.head.ref == 'agent/drama-public-save'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/drama-public-save
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format implementation
        run: |
          npx prettier --write \
            src/components/AudienceVerdictReveal/AudienceVerdictReveal.css \
            src/components/AudienceVerdictReveal/AudienceVerdictReveal.tsx \
            src/components/AudienceVerdictReveal/__tests__/AudienceVerdictReveal.test.tsx \
            src/components/PublicSaveReveal/PublicSaveReveal.tsx \
            src/components/PublicSaveReveal/__tests__/PublicSaveReveal.test.tsx \
            src/publicOpinion/DramaPublicSaveIntegration.ts \
            src/publicOpinion/DramaPublicSaveService.ts \
            src/publicOpinion/PublicSaveService.ts \
            src/publicOpinion/dramaPublicSaveMiddleware.ts \
            src/store/store.ts \
            tests/unit/publicOpinion/publicSaveVoteShares.test.ts

      - name: Capture validation reports
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck-report.txt 2>&1
          echo $? > typecheck-exit.txt
          npm run build > build-report.txt 2>&1
          echo $? > build-exit.txt
          npx vitest run \
            src/components/PublicSaveReveal/__tests__/PublicSaveReveal.test.tsx \
            src/components/AudienceVerdictReveal/__tests__/AudienceVerdictReveal.test.tsx \
            tests/unit/publicOpinion/publicSaveVoteShares.test.ts \
            > test-report.txt 2>&1
          echo $? > test-exit.txt
          set -e

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: drama-public-save-diagnostics
          path: |
            typecheck-report.txt
            typecheck-exit.txt
            build-report.txt
            build-exit.txt
            test-report.txt
            test-exit.txt
          if-no-files-found: error

      - name: Commit formatting and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/agent-drama-public-save-diagnostics.yml
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format Drama public save implementation"
          git push origin HEAD:agent/drama-public-save
