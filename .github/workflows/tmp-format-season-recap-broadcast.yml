name: Temporary format season recap broadcast fix

on:
  push:
    branches:
      - agent/fix-season-recap-broadcast-story

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-season-recap-broadcast-story
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format season recap files
        run: >-
          npx prettier --write
          src/components/SeasonRecapCinematic/SeasonRecapCinematic.tsx
          src/components/SeasonRecapCinematic/SeasonRecapBroadcast.css
          src/components/SeasonRecapCinematic/seasonRecapHighlights.ts
          src/components/SeasonRecapCinematic/seasonRecapTimeline.ts
          tests/seasonRecapCinematic.test.tsx
      - name: Commit formatted files and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/tmp-format-season-recap-broadcast.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format season recap broadcast fix"
          git push origin HEAD:agent/fix-season-recap-broadcast-story
