name: Temporary Season Opening Screenshot Capture

on:
  push:
    branches:
      - feat/season-opening-tv-cinematic

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture real mobile season opening
        run: >-
          npx playwright test e2e/playwright/season-opening-cinematic.spec.ts
          --project=mobile-chromium --workers=1 --retries=0
      - name: Upload real screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: season-opening-real-game-screenshots
          path: test-results/
          if-no-files-found: error
          retention-days: 2
