name: Temporary House of Darkness effect removal

on:
  push:
    branches:
      - agent/add-house-of-darkness

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-house-of-darkness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Remove synchronous death-state effect
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          component = Path('src/components/HouseOfDarknessComp/HouseOfDarknessComp.tsx')
          source = component.read_text()
          pattern = re.compile(
              r"\n  useEffect\(\(\) => \{\n"
              r"    if \(phase !== 'playing' \|\| humanHealth > 0\) return;?\n"
              r"    setLocked\(true\);?\n"
              r"    setFlippedIndices\(\[\]\);?\n"
              r"    setPhase\('death'\);?\n"
              r"  \}, \[humanHealth, phase\]\);?\n"
          )
          source, count = pattern.subn('\n', source, count=1)
          if count != 1:
              raise SystemExit(f'Expected one death-state effect, removed {count}')
          component.write_text(source)
          PY
      - name: Format component
        run: npx prettier --write src/components/HouseOfDarknessComp/HouseOfDarknessComp.tsx
      - name: Remove temporary files
        run: |
          rm -f .github/workflows/temporary-house-of-darkness-effect-removal.yml
          rm -f .github/.trigger-house-of-darkness-effect-removal
      - name: Validate lint
        run: npm run lint:ci
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove redundant House of Darkness death effect"
          git push origin HEAD:agent/add-house-of-darkness
