name: Temporary CWGO Format

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cwgo-human-answer-logic

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cwgo-human-answer-logic
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: |
          npx prettier --write \
            docs/content-and-configuration-hosting-audit.md \
            src/features/cwgo/cwgoCompetitionSlice.ts \
            src/features/cwgo/cwgoHelpers.ts \
            src/features/cwgo/cwgoQuestions.ts \
            tests/cwgo.ai-human-logic.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/content-and-configuration-hosting-audit.md \
            src/features/cwgo/cwgoCompetitionSlice.ts \
            src/features/cwgo/cwgoHelpers.ts \
            src/features/cwgo/cwgoQuestions.ts \
            tests/cwgo.ai-human-logic.test.ts
          git diff --cached --quiet || git commit -m "Format CWGO AI changes"
          git push origin HEAD:agent/cwgo-human-answer-logic
