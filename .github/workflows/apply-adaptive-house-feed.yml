name: Apply adaptive House Feed patch

on:
  push:
    branches:
      - fix/adaptive-house-feed-height
    paths:
      - .github/workflows/apply-adaptive-house-feed.yml

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/adaptive-house-feed-height
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply surgical layout patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/screens/GameScreen/useResponsiveGameLayout.ts')
          text = path.read_text()

          old_constants = """const TV_CHROME_HEIGHT = 88
          const MAX_INLINE_TV_LOG_ROWS = 3
          const SHORT_ROSTER_MAX_PLAYERS = ROSTER_COLUMNS * 2
          """
          new_constants = """const TV_CHROME_HEIGHT = 88
          const MAX_INLINE_TV_LOG_ROWS = 3
          const AUTO_TV_LOG_RESERVE = 12
          const PHONE_SMALL_MAX_TV_VIEWPORT_EXPANSION = 32
          const PHONE_MEDIUM_MAX_TV_VIEWPORT_EXPANSION = 48
          const PHONE_LARGE_MAX_TV_VIEWPORT_EXPANSION = 64
          const SHORT_ROSTER_MAX_PLAYERS = ROSTER_COLUMNS * 2
          """
          if old_constants not in text:
              raise SystemExit('constant insertion anchor not found')
          text = text.replace(old_constants, new_constants, 1)

          old_helpers = """function resolveAdaptiveTvLogRows(extraAfterFeature: number, rowHeight: number) {
            return clamp(1 + Math.floor(extraAfterFeature / rowHeight), 1, MAX_INLINE_TV_LOG_ROWS)
          }
          """
          new_helpers = """function resolveAdaptiveTvLogRows(extraAfterFeature: number, rowHeight: number) {
            return clamp(1 + Math.floor(extraAfterFeature / rowHeight), 1, MAX_INLINE_TV_LOG_ROWS)
          }

          function resolveAutomaticTvLogRows(extraAfterFeature: number, rowHeight: number) {
            const rowBudget = Math.max(0, extraAfterFeature - AUTO_TV_LOG_RESERVE)
            return clamp(Math.floor(rowBudget / rowHeight), 0, MAX_INLINE_TV_LOG_ROWS)
          }

          function resolveTvViewportExpansionLimit(layoutSize: GameLayoutSize) {
            switch (layoutSize) {
              case 'phone-small':
                return PHONE_SMALL_MAX_TV_VIEWPORT_EXPANSION
              case 'phone-medium':
                return PHONE_MEDIUM_MAX_TV_VIEWPORT_EXPANSION
              case 'phone-large':
              default:
                return PHONE_LARGE_MAX_TV_VIEWPORT_EXPANSION
            }
          }
          """
          if old_helpers not in text:
              raise SystemExit('helper replacement anchor not found')
          text = text.replace(old_helpers, new_helpers, 1)

          old_allocation = """  const tvLogRows = input.inlineLogVisible
              ? resolveAdaptiveTvLogRows(extraAfterFeature, tvLogRowHeight)
              : 0
            const extraLogRows = Math.max(0, tvLogRows - 1)
            const breathingRoom = clamp(extraAfterFeature - extraLogRows * tvLogRowHeight, 0, 20)
            const tvHeight = minTvHeight + extraLogRows * tvLogRowHeight + breathingRoom
            const tvViewportHeight = minTvViewportHeight + breathingRoom
          """
          new_allocation = """  // `inlineLogVisible` is the explicit House Feed override. When it is
            // false, the layout engine remains in automatic mode and may choose 0–3
            // rows from the actual surplus height after the roster and feature reserve.
            const tvLogRows = input.inlineLogVisible
              ? resolveAdaptiveTvLogRows(extraAfterFeature, tvLogRowHeight)
              : resolveAutomaticTvLogRows(extraAfterFeature, tvLogRowHeight)
            const baseLogRows = input.inlineLogVisible ? 1 : 0
            const logRowsFromExtra = Math.max(0, tvLogRows - baseLogRows)
            const remainingAfterLogRows = Math.max(
              0,
              extraAfterFeature - logRowsFromExtra * tvLogRowHeight
            )
            const breathingRoom = clamp(
              remainingAfterLogRows,
              0,
              resolveTvViewportExpansionLimit(layoutSize)
            )
            const tvHeight = minTvHeight + logRowsFromExtra * tvLogRowHeight + breathingRoom
            const tvViewportHeight = minTvViewportHeight + breathingRoom
          """
          if old_allocation not in text:
              raise SystemExit('allocation replacement anchor not found')
          text = text.replace(old_allocation, new_allocation, 1)

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused layout tests
        run: npx vitest run tests/unit/layout/responsiveGameLayout.test.ts tests/unit/layout/adaptiveHouseFeed.test.ts

      - name: Run lint
        run: npm run lint:ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run full test suite
        run: npm test

      - name: Commit validated changes
        shell: bash
        run: |
          rm .github/workflows/apply-adaptive-house-feed.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/GameScreen/useResponsiveGameLayout.ts tests/unit/layout/adaptiveHouseFeed.test.ts .github/workflows/apply-adaptive-house-feed.yml
          git commit -m "fix: adapt House Feed to available height"
          git push origin HEAD:fix/adaptive-house-feed-height
