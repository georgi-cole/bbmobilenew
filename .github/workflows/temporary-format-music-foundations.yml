name: Temporary format music foundations

on:
  push:
    branches:
      - agent/music-manager-foundations

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/music-manager-foundations

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format music foundation files
        run: >-
          npx --yes prettier@3.8.1 --config .prettierrc --write
          src/services/sound/musicCatalog.ts
          src/services/sound/musicTracks.ts
          src/services/sound/musicConfig.ts
          src/services/sound/musicConfigAudit.ts
          src/services/sound/minigameMusicConfig.ts
          src/services/sound/resolveDesiredMusic.ts
          src/services/sound/AudioStateSync.tsx
          tests/unit/sound/musicConfigAudit.test.ts

      - name: Commit formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Files already match repository formatting."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/services/sound/musicCatalog.ts \
            src/services/sound/musicTracks.ts \
            src/services/sound/musicConfig.ts \
            src/services/sound/musicConfigAudit.ts \
            src/services/sound/minigameMusicConfig.ts \
            src/services/sound/resolveDesiredMusic.ts \
            src/services/sound/AudioStateSync.tsx \
            tests/unit/sound/musicConfigAudit.test.ts
          git commit -m "Format music manager foundations"
          git push origin HEAD:agent/music-manager-foundations
