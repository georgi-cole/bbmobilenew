name: Temporary Faux TV Cadence Formatter

on:
  push:
    branches:
      - codex/faux-tv-phase9-consolidation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/faux-tv-phase9-consolidation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Faux TV cadence changes
        run: >-
          npx prettier --write
          src/broadcasting/seasonDesk.ts
          tests/fauxTvProgrammingController.test.tsx
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/broadcasting/seasonDesk.ts
          git add tests/fauxTvProgrammingController.test.tsx
          git commit -m "Format Faux TV cadence calibration"
          git push origin HEAD:codex/faux-tv-phase9-consolidation
