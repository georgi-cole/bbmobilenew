name: Temporary format credits smooth playback fix

on:
  push:
    branches:
      - agent/fix-credits-smooth-playback

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-credits-smooth-playback
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format credits files
        run: >-
          npx prettier --write
          src/cinematic/components/CinematicComposition.tsx
          src/cinematic/components/LightweightCinematicWorld.tsx
          src/cinematic/components/lightweightCinematicWorld.css
          src/cinematic/config/cinematicQuality.ts
          tests/unit/cinematicQuality.test.ts
      - name: Commit formatted files and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/tmp-format-credits-smooth.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format credits smooth playback fix"
          git push origin HEAD:agent/fix-credits-smooth-playback
