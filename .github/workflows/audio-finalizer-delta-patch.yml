name: Patch audio finalizer delta capture

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audio-auto-index-migration
          fetch-depth: 0

      - name: Add failure-delta persistence to finalizer
        shell: python
        run: |
          from pathlib import Path

          target = Path('.github/workflows/audio-auto-index-finalize.yml')
          text = target.read_text()
          marker = """          echo 'No additional full-suite failures above the recorded current-main baseline.'

      - name: Web production build
          """
          replacement = """          echo 'No additional full-suite failures above the recorded current-main baseline.'

      - name: Commit additional full-suite failure delta
        if: failure()
        shell: bash
        run: |
          if [ ! -s AUDIO_TEST_DELTA.txt ]; then
            exit 0
          fi
          cp AUDIO_TEST_DELTA.txt /tmp/AUDIO_TEST_DELTA.txt
          git reset --hard HEAD
          git clean -fd
          cp /tmp/AUDIO_TEST_DELTA.txt AUDIO_TEST_DELTA.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AUDIO_TEST_DELTA.txt
          git commit -m 'Capture audio migration full-suite delta'
          git push origin HEAD:refs/heads/agent/audio-auto-index-migration

      - name: Web production build
          """
          if marker not in text:
            raise SystemExit('Could not locate finalizer delta insertion marker')
          target.write_text(text.replace(marker, replacement, 1))

      - name: Commit patched finalizer and remove patch workflow
        shell: bash
        run: |
          git rm .github/workflows/audio-finalizer-delta-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/audio-auto-index-finalize.yml
          git commit -m 'Persist audio migration full-suite deltas'
          git push origin HEAD:refs/heads/agent/audio-auto-index-migration
