name: Agent source export

on:
  pull_request:
    branches:
      - agent/game-flow-refactor-export-base

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Package installed workspace
        run: tar --exclude='.git' --exclude='workspace-export.tgz' -czf workspace-export.tgz .

      - name: Upload installed workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace-export
          path: workspace-export.tgz
          retention-days: 1
