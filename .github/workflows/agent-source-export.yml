name: Agent source export

on:
  pull_request:
    branches:
      - agent/game-flow-refactor-export-base

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Package installed dependencies
        run: tar --ignore-failed-read --warning=no-file-changed -czf /tmp/workspace-export.tgz node_modules package.json package-lock.json || test $? -eq 1

      - name: Upload installed workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace-export
          path: /tmp/workspace-export.tgz
          retention-days: 1
