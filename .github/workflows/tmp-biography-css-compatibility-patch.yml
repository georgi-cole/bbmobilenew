name: Temporary biography CSS compatibility patch

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch-biography-css:
    if: github.head_ref == 'agent/cinematic-bios-responsive-hardening' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cinematic-bios-responsive-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Replace unsupported typed arithmetic
        shell: python
        run: |
          from pathlib import Path

          css_path = Path('src/components/HousematesBioCinematic/HousematesBioCinematic.css')
          css = css_path.read_text()
          css = css.replace(
              "margin: 0 calc(clamp(16px, 4vw, 42px) * -1) calc(max(10px, env(safe-area-inset-bottom, 0px)) * -1);",
              "margin: 0 calc(0px - clamp(16px, 4vw, 42px)) calc(0px - max(10px, env(safe-area-inset-bottom, 0px)));",
          )
          css = css.replace(
              "margin: calc(max(62px, env(safe-area-inset-top, 0px)) * -0.18) 0\n      calc(max(18px, env(safe-area-inset-bottom, 0px)) * -1)\n      calc(max(24px, env(safe-area-inset-left, 0px)) * -1);",
              "margin: -12px 0 calc(0px - max(18px, env(safe-area-inset-bottom, 0px)))\n      calc(0px - max(24px, env(safe-area-inset-left, 0px)));",
          )
          css = css.replace(
              "margin-right: calc(max(24px, env(safe-area-inset-right, 0px)) * -1);",
              "margin-right: calc(0px - max(24px, env(safe-area-inset-right, 0px)));",
          )
          if "* -" in css:
              raise SystemExit('Unsupported multiplication remains in biography CSS')
          css_path.write_text(css)

          test_path = Path('tests/unit/housematesBioResponsiveStyles.test.ts')
          test = test_path.read_text()
          marker = "    expect(CSS).toContain('grid-template-rows: minmax(0, 47%) minmax(0, 53%)')\n"
          if "expect(CSS).not.toContain('* -')" not in test:
              test = test.replace(marker, marker + "    expect(CSS).not.toContain('* -')\n")
          test_path.write_text(test)
      - name: Format changed files
        run: npx prettier --write src/components/HousematesBioCinematic/HousematesBioCinematic.css tests/unit/housematesBioResponsiveStyles.test.ts
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/tmp-biography-css-compatibility-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Harden biography CSS for older WebViews"
          git push origin HEAD:agent/cinematic-bios-responsive-hardening
