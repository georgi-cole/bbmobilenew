# One-shot patch; removed by its own successful run.
name: Temporary add recap visual journey

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/fix-season-recap-broadcast-story' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-season-recap-broadcast-story
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add real finale screenshot assertions
        shell: python
        run: |
          from pathlib import Path
          path = Path('e2e/playwright/finale.spec.ts')
          source = path.read_text()
          old = """    await expect(recap).toBeVisible({ timeout: 10_000 })
          await recap
            .getByRole('button', { name: 'Skip recap' })
          """
          new = """    await expect(recap).toBeVisible({ timeout: 10_000 })
          await expect(recap.getByText('The housemates who made the season.')).toBeVisible({
            timeout: 15_000,
          })
          await expect(recap.locator('.src-broadcast-photoshoot')).toBeVisible()
          await expect(recap.locator('.src-cast-grid')).toHaveCount(0)
          await page.screenshot({
            path: 'test-results/season-recap-photoshoot-mobile.png',
            fullPage: false,
          })
          await recap
            .getByRole('button', { name: 'Skip recap' })
          """
          if old not in source:
              raise SystemExit('Finale recap insertion point was not found')
          path.write_text(source.replace(old, new))
      - run: npx prettier --write e2e/playwright/finale.spec.ts
      - name: Commit journey and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/tmp-add-recap-visual-journey.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add recap broadcast visual journey"
          git push origin HEAD:agent/fix-season-recap-broadcast-story
