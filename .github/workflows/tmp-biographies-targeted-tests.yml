name: Temporary biographies targeted tests

on:
  pull_request:
    types: [synchronize]

jobs:
  biographies-targeted-tests:
    if: github.head_ref == 'agent/cinematic-bios-responsive-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run biography cinematic tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx vitest run \
            tests/unit/housematesBioResponsiveStyles.test.ts \
            src/components/HousematesBioCinematic/__tests__/housematesBioData.test.ts \
            2>&1 | tee biography-tests.log
      - name: Upload biography test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biography-test-diagnostics
          path: biography-tests.log
          if-no-files-found: error
      - name: Propagate test failure
        if: steps.tests.outcome == 'failure'
        run: exit 1
