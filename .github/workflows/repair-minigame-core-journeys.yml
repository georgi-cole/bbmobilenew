name: Repair Minigame Core Journeys

on:
  push:
    branches:
      - agent/minigame-utility-dock

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/minigame-utility-dock
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update core journey exit path
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('e2e/playwright/core-player-journeys.spec.ts')
          source = path.read_text()
          old = """async function resolveCompetitionThroughPlayerControls(page: Page, phase: string): Promise<void> {
            const dismiss = page.getByRole('button', { name: 'Dismiss challenge (score 0)' })
            await expect
              .poll(
                async () => {
                  if (await dismiss.isVisible()) return true
                  return (await readAppState(page)).game.phase !== phase
                },
                { message: `${phase} should present a human challenge or resolve its AI-only field` }
              )
              .toBe(true)

            if (!(await dismiss.isVisible())) return

            await dismiss.click()
            await expect(page.getByRole('heading', { name: 'Exited early' })).toBeVisible()
          """
          new = """async function resolveCompetitionThroughPlayerControls(page: Page, phase: string): Promise<void> {
            const utilityMenu = page.getByRole('button', { name: 'Open minigame menu' })
            await expect
              .poll(
                async () => {
                  if (await utilityMenu.isVisible()) return true
                  return (await readAppState(page)).game.phase !== phase
                },
                {
                  message: `${phase} should present a human challenge or resolve its AI-only field`,
                  timeout: SCREEN_TIMEOUT_MS,
                }
              )
              .toBe(true)

            if (!(await utilityMenu.isVisible())) return

            await utilityMenu.click()
            const leaveCompetition = page.getByRole('menuitem', { name: /Leave competition/i })
            await expect(leaveCompetition).toBeVisible()
            await leaveCompetition.click()

            const confirmExit = page.getByRole('button', { name: 'Exit with 0' })
            await expect(confirmExit).toBeVisible()
            await confirmExit.click()
            await expect(page.getByRole('heading', { name: 'Exited early' })).toBeVisible()
          """
          if old not in source:
              raise SystemExit('Expected legacy core-journey helper was not found')
          path.write_text(source.replace(old, new, 1))
          PY
          npx prettier --write e2e/playwright/core-player-journeys.spec.ts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify repaired mobile journeys
        run: >-
          npx playwright test e2e/playwright/core-player-journeys.spec.ts
          --project=mobile-chromium
          --grep "deterministic real-control week|rapidly repeated social action"
          --retries=0

      - name: Commit repaired journey
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add e2e/playwright/core-player-journeys.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m "Update core journeys for minigame utility dock"
          git push origin HEAD:agent/minigame-utility-dock
