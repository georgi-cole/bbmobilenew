name: Temporary After the Eye config generator

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  generate-after-eye-config:
    if: github.head_ref == 'agent/redesign-after-the-eye-tabloid' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/redesign-after-the-eye-tabloid
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:after-eye
      - name: Commit generated config
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/config/afterTheEyeOutcomes.json
          git commit -m "Add generated After the Eye server config"
          git push origin HEAD:agent/redesign-after-the-eye-tabloid
