name: Temporary After the Eye generator formatter

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format-after-eye-generator:
    if: github.head_ref == 'agent/redesign-after-the-eye-tabloid' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/redesign-after-the-eye-tabloid
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/generate-after-the-eye-config.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/generate-after-the-eye-config.mjs
          git commit -m "Format After the Eye generator"
          git push origin HEAD:agent/redesign-after-the-eye-tabloid
