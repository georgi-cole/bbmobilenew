name: Temporary House of Darkness refinement

on:
  push:
    branches:
      - agent/house-of-darkness-fatigue-transitions

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/house-of-darkness-fatigue-transitions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply refinement
        run: python scripts/temporary_patch_house_of_darkness_refinement.py
      - name: Format changes
        run: |
          npx prettier --write \
            src/components/HouseOfDarknessComp/HouseOfDarknessComp.tsx \
            src/components/HouseOfDarknessComp/HouseOfDarknessComp.css \
            src/components/HouseOfDarknessComp/houseOfDarknessAiBalance.ts \
            tests/unit/house-of-darkness/houseOfDarknessAiBalance.test.ts \
            tests/unit/house-of-darkness/HouseOfDarknessComp.transitions.test.ts
      - name: Validate refinement
        run: |
          npm run lint:ci
          npx vitest run \
            tests/unit/house-of-darkness/houseOfDarknessAiBalance.test.ts \
            tests/unit/house-of-darkness/HouseOfDarknessComp.transitions.test.ts \
            tests/unit/house-of-darkness/HouseOfDarknessComp.test.tsx \
            tests/unit/house-of-darkness/houseOfDarknessUtils.test.ts
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Balance House of Darkness AI and add round transitions"
          git push origin HEAD:agent/house-of-darkness-fatigue-transitions
