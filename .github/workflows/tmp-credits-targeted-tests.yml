name: Temporary credits targeted tests

on:
  pull_request:
    types: [synchronize]

jobs:
  credits-targeted-tests:
    if: github.head_ref == 'agent/cinematic-credits-runtime-content'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run credits cinematic tests
        run: >-
          npx vitest run
          src/screens/Credits/__tests__/Credits.test.tsx
          src/screens/Credits/__tests__/creditsSceneLayout.test.ts
          tests/unit/creditsContent.test.ts
