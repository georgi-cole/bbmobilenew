name: Temporary format After the Eye

on:
  push:
    branches:
      - after-eye-drama-engine

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: after-eye-drama-engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format After the Eye files
        run: |
          npx prettier --write \
            scripts/generate-after-the-eye-config.mjs \
            src/screens/GameOver/afterTheEyeOutcomeLinkedScenarios.ts \
            src/screens/GameOver/afterTheEyeOutcomeScenarios1.ts \
            src/screens/GameOver/afterTheEyeOutcomeScenarios2.ts \
            src/screens/GameOver/afterTheEyeOutcomeScenarios3.ts \
            src/screens/GameOver/afterTheEyeOutcomeScenarios4.ts \
            src/screens/GameOver/afterTheEyeOutcomeScenarios5.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/generate-after-the-eye-config.mjs \
            src/screens/GameOver/afterTheEyeOutcomeLinkedScenarios.ts \
            src/screens/GameOver/afterTheEyeOutcomeScenarios1.ts \
            src/screens/GameOver/afterTheEyeOutcomeScenarios2.ts \
            src/screens/GameOver/afterTheEyeOutcomeScenarios3.ts \
            src/screens/GameOver/afterTheEyeOutcomeScenarios4.ts \
            src/screens/GameOver/afterTheEyeOutcomeScenarios5.ts
          git commit -m "Format After the Eye drama files"
          git push origin HEAD:after-eye-drama-engine
