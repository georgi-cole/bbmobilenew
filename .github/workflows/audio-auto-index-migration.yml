name: Audio auto-index migration

on:
  push:
    branches:
      - agent/audio-auto-index-migration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio-auto-index-migration
  cancel-in-progress: true

jobs:
  migrate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audio-auto-index-migration
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair and harden one-time migration source
        shell: python
        run: |
          from pathlib import Path

          target = Path('scripts/migrate-audio-assets.mjs')
          text = target.read_text()
          text = text.replace('\\\\`', '\\`').replace('\\\\${', '\\${')

          marker = "  for (const [alias, target] of Object.entries(filenameAliases)) {"
          insertion = """  for (const migrated of pathMap.values()) {
            if (bindings.some((binding) => binding.path === migrated)) continue
            const extension = path.extname(migrated)
            const destinationStem = slugify(path.basename(migrated, extension))
            if (migrated.startsWith('music/')) {
              let trackId = destinationStem
              let suffix = 2
              while (
                bindings.some(
                  (binding) => binding.trackId === trackId || binding.key === `music:${trackId}`
                )
              ) {
                trackId = `${destinationStem}_${suffix}`
                suffix += 1
              }
              bindings.push({
                path: migrated,
                key: `music:${trackId}`,
                category: 'music',
                trackId,
                displayName: titleFromSlug(trackId),
                fallbackTrack: trackId === 'competition' ? 'none' : 'competition',
                tags: ['ambient'],
                preload: false,
                volume: 0.5,
                loop: true,
              })
            } else {
              const prefixed = /^(ui|tv|player|minigame)_(.+)$/.exec(destinationStem)
              const category = prefixed?.[1] ?? 'minigame'
              const rest = prefixed?.[2] ?? destinationStem
              let key = `${category}:${rest}`
              let suffix = 2
              while (bindings.some((binding) => binding.key === key)) {
                key = `${category}:${rest}_${suffix}`
                suffix += 1
              }
              bindings.push({
                path: migrated,
                key,
                category,
                preload: false,
                volume: 1,
                loop: false,
              })
            }
          }

          """
          if marker not in text:
            raise SystemExit('Could not locate filename-alias migration marker')
          text = text.replace(marker, insertion + marker, 1)
          target.write_text(text)
          Path('AUDIO_MIGRATION_DIAGNOSTIC.txt').unlink(missing_ok=True)

      - name: Validate migration scripts
        run: |
          node --check scripts/generate-audio-manifest.mjs
          node --check scripts/migrate-audio-assets.mjs

      - name: Migrate and index all audio assets
        id: migrate
        shell: bash
        run: |
          set +e
          node scripts/migrate-audio-assets.mjs > AUDIO_MIGRATION_DIAGNOSTIC.txt 2>&1
          migration_status=$?
          if [ "$migration_status" -eq 0 ]; then
            node scripts/generate-audio-manifest.mjs >> AUDIO_MIGRATION_DIAGNOSTIC.txt 2>&1
            generator_status=$?
          else
            generator_status=99
          fi
          cat AUDIO_MIGRATION_DIAGNOSTIC.txt
          if [ "$migration_status" -ne 0 ] || [ "$generator_status" -ne 0 ]; then
            echo 'failed=true' >> "$GITHUB_OUTPUT"
          else
            rm AUDIO_MIGRATION_DIAGNOSTIC.txt
            echo 'failed=false' >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Commit migration diagnostic
        if: steps.migrate.outputs.failed == 'true'
        shell: bash
        run: |
          cp AUDIO_MIGRATION_DIAGNOSTIC.txt /tmp/AUDIO_MIGRATION_DIAGNOSTIC.txt
          git reset --hard HEAD
          git clean -fd
          cp /tmp/AUDIO_MIGRATION_DIAGNOSTIC.txt AUDIO_MIGRATION_DIAGNOSTIC.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AUDIO_MIGRATION_DIAGNOSTIC.txt
          git commit -m 'Capture audio migration runtime diagnostic'
          git push origin HEAD:refs/heads/agent/audio-auto-index-migration

      - name: Stop after migration failure
        if: steps.migrate.outputs.failed == 'true'
        run: exit 1

      - name: Format migrated source and configuration
        run: |
          npx prettier --write \
            package.json \
            public/assets/audio.config.json \
            scripts/generate-audio-manifest.mjs \
            src/services/sound/sounds.ts \
            src/services/sound/musicCatalog.ts \
            tests/unit/sound/audioAutoIndex.test.ts \
            docs/AUDIO_ASSET_INDEXING.md

      - name: Verify migration layout
        shell: bash
        run: |
          set -euo pipefail
          test -d public/assets/music
          test -d public/assets/sounds
          if find public/assets/sounds -type f \( -iname '*music*' -o -iname '*background*' -o -iname '*soundtrack*' \) -print | grep -q .; then
            echo 'Potential music-named files remain in sounds:'
            find public/assets/sounds -type f \( -iname '*music*' -o -iname '*background*' -o -iname '*soundtrack*' \) -print
            exit 1
          fi
          test -f src/services/sound/generatedAudioManifest.ts
          git diff --check

      - name: Lint
        run: npm run lint:ci

      - name: Typecheck
        run: npm run typecheck

      - name: Focused audio regressions
        run: |
          npx vitest run \
            tests/unit/sound/audioAutoIndex.test.ts \
            tests/unit/sound/queue.test.ts \
            tests/unit/sound/soundMiddleware.test.ts \
            tests/unit/sound/musicConfigAudit.test.ts \
            tests/unit/sound/musicConfigSanitizer.test.ts \
            tests/unit/sound/musicRuntimeConfig.test.ts \
            tests/unit/sound/resolveDesiredMusic.test.ts \
            tests/unit/sound/minigameMusicConfig.test.ts

      - name: Full test suite
        run: npm test

      - name: Web production build
        run: npm run build

      - name: Capacitor mobile build
        run: npm run build:mobile

      - name: Verify generated manifest is stable
        run: |
          npm run generate:audio
          git diff --exit-code -- src/services/sound/generatedAudioManifest.ts

      - name: Commit validated migration
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/audio-auto-index-migration.yml
          git rm scripts/migrate-audio-assets.mjs
          rm -f AUDIO_MIGRATION_DIAGNOSTIC.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Migrate and auto-index music and sound assets'
          git push origin HEAD:refs/heads/agent/audio-auto-index-migration
