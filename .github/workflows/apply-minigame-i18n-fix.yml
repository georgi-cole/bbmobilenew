name: Remove localization guard

on:
  push:
    branches:
      - fix/minigame-bugs-20260806
    paths:
      - scripts/apply-minigame-i18n-fix.mjs
      - .github/workflows/apply-minigame-i18n-fix.yml

permissions:
  contents: write

jobs:
  remove-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/minigame-bugs-20260806
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove localization guard wiring
        run: node scripts/apply-minigame-i18n-fix.mjs

      - name: Install dependencies
        run: npm ci

      - name: Format changed configuration
        run: npx prettier --write package.json .github/workflows/ci.yml

      - name: Verify localization guard is detached
        run: |
          node -e "const p=require('./package.json'); if (p.scripts['validate:i18n'] || p.scripts['test:release-full'].includes('validate:i18n')) process.exit(1)"
          ! grep -q "validate:i18n\|Validate localization coverage" .github/workflows/ci.yml

      - name: Verify formatting
        run: npm run format:check

      - name: Lint without warnings
        run: npm run lint:ci

      - name: Typecheck
        run: npm run typecheck

      - name: Commit guard removal and clean temporary files
        run: |
          git rm \
            .github/workflows/apply-minigame-i18n-fix.yml \
            scripts/apply-minigame-i18n-fix.mjs \
            scripts/check-localization.mjs \
            config/localization-source-review.json
          git add package.json .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: remove localization guard"
          git push origin HEAD:fix/minigame-bugs-20260806
