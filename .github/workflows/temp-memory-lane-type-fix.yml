name: Temp Memory Lane Type Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Finalize portrait fallback and remove dead helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/DownMemoryLane/DownMemoryLane.tsx')
          text = path.read_text()
          old = '''interface MemoryLanePortraitProps {\n  id: string\n  name: string\n  avatar: string\n  isUser?: boolean\n  alt: string\n}'''
          new = '''interface MemoryLanePortraitProps {\n  id: string\n  name: string\n  avatar?: string\n  isUser?: boolean\n  alt: string\n}'''
          if old not in text:
              raise SystemExit('portrait props block not found')
          text = text.replace(old, new, 1)

          old_call = "useResolvedAvatarSrc({ id, name, avatar, isUser })"
          new_call = "useResolvedAvatarSrc({ id, name, avatar: avatar ?? '', isUser })"
          if old_call not in text:
              raise SystemExit('avatar resolver call not found')
          text = text.replace(old_call, new_call, 1)

          old_state = '''  const candidateKey = orderedCandidates.join('|')\n  const [candidateIndex, setCandidateIndex] = useState(0)\n\n  useEffect(() => {\n    setCandidateIndex(0)\n  }, [candidateKey])\n\n  const src = orderedCandidates[Math.min(candidateIndex, Math.max(0, orderedCandidates.length - 1))]\n  if (!src) return <span aria-hidden=\"true\">👤</span>\n\n  return (\n    <img\n      src={src}\n      alt={alt}\n      onError={() =>\n        setCandidateIndex((current) =>\n          current + 1 < orderedCandidates.length ? current + 1 : current\n        )\n      }\n    />\n  )'''
          new_state = '''  const [failedSources, setFailedSources] = useState<string[]>([])\n  const src = orderedCandidates.find((candidate) => !failedSources.includes(candidate))\n  if (!src) return <span aria-hidden=\"true\">👤</span>\n\n  return (\n    <img\n      src={src}\n      alt={alt}\n      onError={() =>\n        setFailedSources((current) => (current.includes(src) ? current : [...current, src]))\n      }\n    />\n  )'''
          if old_state not in text:
              raise SystemExit('candidate fallback block not found')
          text = text.replace(old_state, new_state, 1)
          path.write_text(text)

          path = Path('src/components/DownMemoryLane/downMemoryLaneLogic.ts')
          text = path.read_text()
          old = '''function choosePrompt(seed: number, salt: string, prompts: readonly string[]): string {\n  if (prompts.length === 0) return ''\n  const random = rngFor(seed, `prompt:${salt}`)\n  return prompts[Math.floor(random() * prompts.length)] ?? prompts[0]\n}\n\n'''
          if old not in text:
              raise SystemExit('choosePrompt block not found')
          path.write_text(text.replace(old, '', 1))
          PY

          npx prettier --write \
            src/components/DownMemoryLane/DownMemoryLane.tsx \
            src/components/DownMemoryLane/downMemoryLaneLogic.ts
          npm run typecheck
          npm run lint:ci
          npx vitest run \
            tests/unit/down-memory-lane/downMemoryLaneLogic.test.ts \
            tests/unit/down-memory-lane/downMemoryLaneRegistry.test.ts

      - name: Commit portrait fix
        run: |
          if git diff --quiet; then
            echo "Nothing to update."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/DownMemoryLane/DownMemoryLane.tsx \
            src/components/DownMemoryLane/downMemoryLaneLogic.ts
          git commit -m "fix: harden Memory Lane portrait fallbacks"
          git push --no-verify origin HEAD:${{ github.head_ref }}
