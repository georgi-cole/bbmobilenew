name: Apply Fit Me In localization

on:
  push:
    branches:
      - agent/fit-me-in-tournament

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fit-me-in-tournament
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply localization migration
        run: python scripts/apply-fit-me-in-localization.py
      - name: Format changed files
        run: |
          npx prettier --write \
            src/components/TetrisComp/TetrisComp.tsx \
            src/components/TetrisComp/tournament.ts \
            src/components/MinigameRules/MinigameRules.tsx \
            src/minigames/registry.ts \
            src/i18n/messages.ts \
            tests/unit/tetrisTournament.test.ts
      - name: Validate localization
        env:
          I18N_BASE_REF: origin/main
        run: node scripts/check-localization.mjs
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Type check
        run: npm run typecheck
      - name: Tournament unit tests
        run: npx vitest run tests/unit/tetrisTournament.test.ts
      - name: Commit localized implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/components/TetrisComp/TetrisComp.tsx \
            src/components/TetrisComp/tournament.ts \
            src/components/MinigameRules/MinigameRules.tsx \
            src/minigames/registry.ts \
            src/i18n/messages.ts \
            tests/unit/tetrisTournament.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Localize Fit Me In tournament flow"
          git push
