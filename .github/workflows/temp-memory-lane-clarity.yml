name: Temp Memory Lane Fact Audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make public-save trivia receipt-backed
        run: |
          python - <<'PY'
          from pathlib import Path

          # Persist a tiny, explicit receipt whenever the public saves a nominee.
          # This lets the finale ask public-save questions without reconstructing
          # history from transient week state or unrelated POS counters.
          path = Path('src/store/gameSlice.ts')
          text = path.read_text()
          old = '''      // Record metadata\n      state.publicSavedNomineeId = savedId\n      if (state.nominationContext) {'''
          new = '''      // Record metadata\n      state.publicSavedNomineeId = savedId\n      const publicSaveAlreadyRecorded = (state.history ?? []).some(\n        (event) =>\n          event.type === 'seasonReceipt:publicSave' &&\n          event.week === state.week &&\n          event.data.playerId === savedId\n      )\n      if (!publicSaveAlreadyRecorded) {\n        state.history = [\n          ...(state.history ?? []),\n          {\n            type: 'seasonReceipt:publicSave',\n            week: state.week,\n            data: { playerId: savedId },\n            timestamp: Date.now(),\n          },\n        ]\n      }\n      if (state.nominationContext) {'''
          if old not in text:
              raise SystemExit('commitPublicSave receipt insertion point not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('src/components/DownMemoryLane/downMemoryLaneLogic.ts')
          text = path.read_text()
          old = '''function publicSaveCounts(state: GameState): Record<string, number> {\n  const counts: Record<string, number> = { ...(state.voxPopuli?.safetySaveCounts ?? {}) }\n  for (const event of state.social?.dramaNetwork?.events ?? []) {\n    if (!event.id.startsWith('public-save-')) continue\n    const id = event.participantIds[0]\n    if (!id) continue\n    counts[id] = (counts[id] ?? 0) + 1\n  }\n  return counts\n}\n'''
          new = '''function publicSaveCounts(state: GameState): Record<string, number> {\n  const counts: Record<string, number> = {}\n  const seen = new Set<string>()\n\n  for (const event of state.history ?? []) {\n    if (event.type !== 'seasonReceipt:publicSave') continue\n    const id = typeof event.data.playerId === 'string' ? event.data.playerId : null\n    if (!id) continue\n    const key = `${event.week}:${id}`\n    if (seen.has(key)) continue\n    seen.add(key)\n    counts[id] = (counts[id] ?? 0) + 1\n  }\n\n  // Older Drama-mode saves already have a durable event id ending in the\n  // actually saved player id. Use them as a backwards-compatible fallback,\n  // but never treat the nominee list's first member as the saved player.\n  const playersByLongestId = [...seasonPlayers(state)].sort(\n    (left, right) => right.id.length - left.id.length\n  )\n  for (const event of state.social?.dramaNetwork?.events ?? []) {\n    if (!event.id.startsWith('public-save-')) continue\n    const saved = playersByLongestId.find((player) => event.id.endsWith(`-${player.id}`))\n    if (!saved) continue\n    const key = `${event.week}:${saved.id}`\n    if (seen.has(key)) continue\n    seen.add(key)\n    counts[saved.id] = (counts[saved.id] ?? 0) + 1\n  }\n  return counts\n}\n'''
          if old not in text:
              raise SystemExit('publicSaveCounts block not found')
          text = text.replace(old, new)

          # Add a separate Vox POS-save memory rather than mislabelling those\n          # saves as audience/public saves.
          needle = '''  if (state.voxPopuli?.audienceVoteDaysByPlayerId) {\n'''
          addition = '''  if (isVoxSeason(state) && state.voxPopuli?.safetySaveCounts) {\n    const mostPosSaved = uniqueWinner(\n      players,\n      (player) => state.voxPopuli?.safetySaveCounts?.[player.id] ?? 0,\n      { requirePositive: true }\n    )\n    if (mostPosSaved) {\n      const posSaveCount = state.voxPopuli.safetySaveCounts[mostPosSaved.id] ?? 0\n      pushQuestion(questions, state, seed, {\n        id: 'vox-most-pos-saves',\n        prompt: `During POS ceremonies, one hubmate was saved ${posSaveCount} time${\n          posSaveCount === 1 ? '' : 's'\n        }, more than anyone else. Who was it?`,\n        correctPlayerId: mostPosSaved.id,\n        category: 'competition',\n        difficulty: 0.64,\n      })\n    }\n  }\n\n'''
          if needle not in text:
              raise SystemExit('Vox audience question insertion point not found')
          text = text.replace(needle, addition + needle, 1)
          text = text.replace(
              "prompt: 'Who never faced an audience eviction vote?',",
              "prompt: 'Who made it through the season without ever facing an audience elimination vote?',",
          )
          text = text.replace(
              "prompt: 'The season’s first elimination sent which hubmate out of the game?',",
              "prompt: `The season’s first elimination happened in Week ${firstEvicted.evictedAtWeek ?? '?'}. Which hubmate left the game?`,",
          )
          text = text.replace(
              "prompt: 'At the final elimination before the Final 3, which hubmate left the game?',",
              "prompt: `Just before the Final 3, Week ${fourth[0].evictedAtWeek ?? '?'} ended with which hubmate being eliminated?`,",
          )
          path.write_text(text)

          path = Path('tests/unit/down-memory-lane/downMemoryLaneLogic.test.ts')
          text = path.read_text()
          old = '''    const state = seasonState({\n      voxPopuli: {'''
          new = '''    const state = seasonState({\n      history: [\n        {\n          type: 'seasonReceipt:publicSave',\n          week: 2,\n          timestamp: 2_000,\n          data: { playerId: 'alex' },\n        },\n        {\n          type: 'seasonReceipt:publicSave',\n          week: 5,\n          timestamp: 5_000,\n          data: { playerId: 'alex' },\n        },\n        {\n          type: 'seasonReceipt:publicSave',\n          week: 4,\n          timestamp: 4_000,\n          data: { playerId: 'maya' },\n        },\n      ],\n      voxPopuli: {'''
          # Only replace the Vox test's occurrence, which appears after its test title.
          marker = "  it('uses Vox audience history when that mode is active', () => {\n"
          idx = text.index(marker)
          prefix, suffix = text[:idx], text[idx:]
          if old not in suffix:
              raise SystemExit('Vox test state block not found')
          suffix = suffix.replace(old, new, 1)
          text = prefix + suffix
          expectation = '''    expect(\n      questions.some(\n        (question) =>\n          question.id === 'vox-most-audience-ballots' && question.correctPlayerId === 'alex'\n      )\n    ).toBe(true)'''
          replacement = expectation + '''\n    expect(\n      questions.some(\n        (question) => question.id === 'vox-most-pos-saves' && question.correctPlayerId === 'alex'\n      )\n    ).toBe(true)'''
          if expectation not in text:
              raise SystemExit('Vox audience expectation not found')
          text = text.replace(expectation, replacement, 1)
          path.write_text(text)
          PY

          npx prettier --write \
            src/store/gameSlice.ts \
            src/components/DownMemoryLane/downMemoryLaneLogic.ts \
            tests/unit/down-memory-lane/downMemoryLaneLogic.test.ts

          npx vitest run \
            tests/unit/down-memory-lane/downMemoryLaneLogic.test.ts \
            tests/unit/down-memory-lane/downMemoryLaneRegistry.test.ts

      - name: Commit fact audit
        run: |
          if git diff --quiet; then
            echo "Nothing to update."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/store/gameSlice.ts \
            src/components/DownMemoryLane/downMemoryLaneLogic.ts \
            tests/unit/down-memory-lane/downMemoryLaneLogic.test.ts
          git commit -m "fix: ground Memory Lane public-save questions"
          git push --no-verify origin HEAD:${{ github.head_ref }}
