name: Generate verified dependency lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove failed fast-uri override
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          packageJson.overrides = {
            ...(packageJson.overrides ?? {}),
            postcss: '8.5.23'
          }
          delete packageJson.overrides['fast-uri']
          delete packageJson.overrides.ajv
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`)
          NODE

      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Apply npm nonbreaking audit fix
        run: npm audit fix --package-lock-only --omit=dev --ignore-scripts --no-fund

      - name: Upload remediated dependency files
        uses: actions/upload-artifact@v4
        with:
          name: verified-dependency-files
          path: |
            package.json
            package-lock.json
          retention-days: 3

      - name: Verify npm clean install
        run: npm ci --ignore-scripts --no-fund

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Verify typecheck
        run: npm run typecheck

      - name: Verify production build
        run: npm run build
