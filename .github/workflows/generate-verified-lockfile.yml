name: Generate verified dependency lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin compatible patched fast-uri line for verification
        run: npm pkg set overrides.fast-uri=3.1.4

      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload generated dependency files
        uses: actions/upload-artifact@v4
        with:
          name: verified-dependency-files
          path: |
            package.json
            package-lock.json
          retention-days: 3

      - name: Verify npm clean install
        run: npm ci --ignore-scripts --no-fund

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high
