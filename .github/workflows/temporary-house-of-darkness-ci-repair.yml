name: Temporary House of Darkness CI repair

on:
  push:
    branches:
      - agent/add-house-of-darkness

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-house-of-darkness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Remove redundant death-state effect
        run: |
          python - <<'PY'
          from pathlib import Path

          component = Path('src/components/HouseOfDarknessComp/HouseOfDarknessComp.tsx')
          source = component.read_text()
          redundant_effect = """  useEffect(() => {
            if (phase !== 'playing' || humanHealth > 0) return;
            setLocked(true);
            setFlippedIndices([]);
            setPhase('death');
          }, [humanHealth, phase]);

          """
          if redundant_effect not in source:
              raise SystemExit('Expected redundant death-state effect was not found')
          component.write_text(source.replace(redundant_effect, '', 1))
          PY
      - name: Format House of Darkness changes
        run: |
          npx prettier --write \
            src/components/HouseOfDarknessComp/HouseOfDarknessComp.css \
            src/components/HouseOfDarknessComp/HouseOfDarknessComp.tsx \
            src/components/HouseOfDarknessComp/houseOfDarknessUtils.ts \
            src/minigames/registry.ts \
            src/minigames/registryHouseOfDarkness.ts \
            tests/unit/house-of-darkness/HouseOfDarknessComp.test.tsx \
            tests/unit/house-of-darkness/houseOfDarknessRegistry.test.ts \
            tests/unit/house-of-darkness/houseOfDarknessUtils.test.ts
      - name: Remove temporary workflow before validation
        run: rm .github/workflows/temporary-house-of-darkness-ci-repair.yml
      - name: Validate lint
        run: npm run lint:ci
      - name: Validate changed-file formatting
        run: npm run format:check
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix and format House of Darkness CI"
          git push origin HEAD:agent/add-house-of-darkness
