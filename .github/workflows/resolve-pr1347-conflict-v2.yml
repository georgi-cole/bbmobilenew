name: Resolve PR 1347 conflict v2

on:
  push:
    branches:
      - fix/minigame-bugs-20260806
    paths:
      - .github/workflows/resolve-pr1347-conflict-v2.yml

permissions:
  contents: write

jobs:
  resolve-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/minigame-bugs-20260806
          fetch-depth: 0

      - name: Configure merge and record branch head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "START_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Snapshot this PR's translation entries
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs')
          const source = readFileSync('src/i18n/messages.ts', 'utf8')
          const keys = [
            'chainOfGreed.round',
            'chainOfGreed.roundIntro.title',
            'chainOfGreed.roundIntro.warning',
            'chainOfGreed.roundIntro.dismiss',
            'pressurePlank.safeZone',
            'seasonRecap.finale.title',
            'seasonRecap.finale.detail.two',
            'seasonRecap.finale.detail.one',
          ]
          const catalogNames = [
            'EN_US_MESSAGES',
            'FR_FR_MESSAGES',
            'IT_IT_MESSAGES',
            'ES_ES_MESSAGES',
            'PT_PT_MESSAGES',
            'DE_DE_MESSAGES',
            'ZH_CN_MESSAGES',
            'BG_BG_MESSAGES',
            'RU_RU_MESSAGES',
            'UK_UA_MESSAGES',
            'TR_TR_MESSAGES',
          ]
          const snapshot = {}
          for (const catalogName of catalogNames) {
            const declaration = new RegExp(
              `(?:export\\s+)?const\\s+${catalogName}(?:\\s*:\\s*[^=\\n]+)?\\s*=\\s*\\{\\n`,
              'm',
            )
            const match = declaration.exec(source)
            if (!match) throw new Error(`Missing catalogue ${catalogName}`)
            const start = match.index + match[0].length
            const remainder = source.slice(start)
            const next = /\n(?:export\s+)?const\s+[A-Z_]+_MESSAGES(?:\s*:\s*[^=\n]+)?\s*=\s*\{|\nexport\s+const\s+MESSAGE_CATALOGS/.exec(remainder)
            const segment = remainder.slice(0, next ? next.index : remainder.length)
            snapshot[catalogName] = keys.map((key) => {
              const line = segment.split('\n').find((candidate) => candidate.trimStart().startsWith(`'${key}':`))
              if (!line) throw new Error(`Missing ${catalogName}.${key}`)
              return line
            })
          }
          writeFileSync('/tmp/pr1347-message-entries.json', JSON.stringify(snapshot))
          NODE

      - name: Merge current main and resolve only messages.ts
        shell: bash
        run: |
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          mapfile -t unresolved < <(git diff --name-only --diff-filter=U)
          if (( ${#unresolved[@]} > 0 )); then
            printf 'Unresolved files:\n%s\n' "${unresolved[@]}"
            if (( ${#unresolved[@]} != 1 )) || [[ "${unresolved[0]}" != "src/i18n/messages.ts" ]]; then
              echo "Unexpected merge conflict surface."
              exit 1
            fi
            git checkout --theirs -- src/i18n/messages.ts
            git add src/i18n/messages.ts
          elif (( merge_status != 0 )); then
            echo "Merge failed without a resolvable messages.ts conflict."
            exit 1
          fi

          git rev-parse -q --verify MERGE_HEAD >/dev/null

      - name: Reinsert the PR entries into the current main catalogue
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs')
          const path = 'src/i18n/messages.ts'
          let source = readFileSync(path, 'utf8')
          const snapshot = JSON.parse(readFileSync('/tmp/pr1347-message-entries.json', 'utf8'))

          for (const catalogName of Object.keys(snapshot).reverse()) {
            const declaration = new RegExp(
              `(?:export\\s+)?const\\s+${catalogName}(?:\\s*:\\s*[^=\\n]+)?\\s*=\\s*\\{\\n`,
              'm',
            )
            const match = declaration.exec(source)
            if (!match) throw new Error(`Missing catalogue ${catalogName}`)
            const insertAt = match.index + match[0].length
            const remainder = source.slice(insertAt)
            const next = /\n(?:export\s+)?const\s+[A-Z_]+_MESSAGES(?:\s*:\s*[^=\n]+)?\s*=\s*\{|\nexport\s+const\s+MESSAGE_CATALOGS/.exec(remainder)
            const segmentEnd = next ? insertAt + next.index : source.length
            const segment = source.slice(insertAt, segmentEnd)
            const missingLines = snapshot[catalogName].filter((line) => {
              const key = line.trim().match(/^'([^']+)':/)?.[1]
              return key && !segment.includes(`'${key}':`)
            })
            if (missingLines.length) {
              source = `${source.slice(0, insertAt)}${missingLines.join('\n')}\n${source.slice(insertAt)}`
            }
          }

          writeFileSync(path, source)
          NODE
          git add src/i18n/messages.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Format resolved catalogue
        run: npx prettier --write src/i18n/messages.ts
      - name: Verify formatting
        run: npm run format:check
      - name: Verify localization
        run: npm run validate:i18n
      - name: Run lint
        run: npm run lint:ci
      - name: Run typecheck
        run: npm run typecheck
      - name: Run focused tests
        run: >-
          npm test --
          tests/unit/chain-of-greed/ChainOfGreed.component.test.tsx
          tests/unit/minigameBugfixes.regression.test.ts

      - name: Confirm branch did not move
        run: |
          remote_head=$(git ls-remote origin refs/heads/fix/minigame-bugs-20260806 | cut -f1)
          test "$remote_head" = "$START_HEAD"

      - name: Commit merge resolution and remove temporary workflows
        run: |
          git rm .github/workflows/resolve-pr1347-conflict-v2.yml
          git rm -f .github/workflows/resolve-pr1347-messages-conflict.yml
          git add src/i18n/messages.ts
          git commit -m "Merge main and resolve localization catalogue conflict"
          git push origin HEAD:fix/minigame-bugs-20260806
