name: House of Darkness refinement runner

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/house-of-darkness-fatigue-transitions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply refinement without deleting runner files
        run: |
          python - <<'PY'
          from pathlib import Path

          patcher = Path('scripts/temporary_patch_house_of_darkness_refinement.py')
          source = patcher.read_text()
          marker = '\nfor temporary_path in ('
          if marker not in source:
              raise SystemExit('Temporary cleanup marker was not found')
          patcher.write_text(source.split(marker, 1)[0] + '\n')
          PY
          python scripts/temporary_patch_house_of_darkness_refinement.py
      - run: |
          npx prettier --write \
            src/components/HouseOfDarknessComp/HouseOfDarknessComp.tsx \
            src/components/HouseOfDarknessComp/HouseOfDarknessComp.css \
            src/components/HouseOfDarknessComp/houseOfDarknessAiBalance.ts \
            tests/unit/house-of-darkness/houseOfDarknessAiBalance.test.ts \
            tests/unit/house-of-darkness/HouseOfDarknessComp.transitions.test.ts
      - run: npm run lint:ci
      - run: |
          npx vitest run \
            tests/unit/house-of-darkness/houseOfDarknessAiBalance.test.ts \
            tests/unit/house-of-darkness/HouseOfDarknessComp.transitions.test.ts \
            tests/unit/house-of-darkness/HouseOfDarknessComp.test.tsx \
            tests/unit/house-of-darkness/houseOfDarknessUtils.test.ts
      - name: Commit validated production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/HouseOfDarknessComp/HouseOfDarknessComp.tsx \
            src/components/HouseOfDarknessComp/HouseOfDarknessComp.css \
            src/components/HouseOfDarknessComp/houseOfDarknessAiBalance.ts \
            tests/unit/house-of-darkness/houseOfDarknessAiBalance.test.ts \
            tests/unit/house-of-darkness/HouseOfDarknessComp.transitions.test.ts
          git commit -m "Balance House of Darkness AI and add round transitions"
          git push origin HEAD:agent/house-of-darkness-fatigue-transitions
