name: Temp Prettier Sequence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format SequenceStage
        run: npx prettier --write src/components/FinalThreeCircuit/SequenceStage.tsx
      - name: Commit exact Prettier output
        run: |
          if git diff --quiet; then
            echo "Nothing to format."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/FinalThreeCircuit/SequenceStage.tsx
          git commit -m "chore: format SequenceStage"
          git push --no-verify origin HEAD:${{ github.head_ref }}
