# One-shot patch; removed by its own successful run.
name: Temporary add Public Favorite visual journey

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/fix-public-favorite-finale' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-public-favorite-finale
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add real finale screenshot assertions
        shell: python
        run: |
          from pathlib import Path
          path = Path('e2e/playwright/finale.spec.ts')
          source = path.read_text()
          marker = "    await expect(favoriteVote).toBeVisible({ timeout: 15_000 })\n"
          insertion = (
              "    await expect(favoriteVote.getByText('The public has made its choice.')).toBeVisible()\n"
              "    await expect(favoriteVote.locator('.pf-overlay__board')).toHaveCount(0)\n"
              "    await page.screenshot({\n"
              "      path: 'test-results/public-favorite-intro-mobile.png',\n"
              "      fullPage: false,\n"
              "    })\n"
              "    await favoriteVote.getByRole('button', { name: 'Skip intro' }).click()\n"
              "    await expect(favoriteVote.locator('.pf-cinematic__feature')).toBeVisible({\n"
              "      timeout: 5_000,\n"
              "    })\n"
              "    await page.screenshot({\n"
              "      path: 'test-results/public-favorite-feature-mobile.png',\n"
              "      fullPage: false,\n"
              "    })\n"
          )
          if marker not in source:
              raise SystemExit('Public Favorite insertion point was not found')
          if insertion not in source:
              source = source.replace(marker, marker + insertion, 1)
          path.write_text(source)
      - run: npx prettier --write e2e/playwright/finale.spec.ts
      - name: Commit journey and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/tmp-add-public-favorite-visual-journey.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add Public Favorite visual journey"
          git push origin HEAD:agent/fix-public-favorite-finale
