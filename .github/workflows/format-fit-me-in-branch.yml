name: Format Fit Me In branch

on:
  push:
    branches:
      - agent/fit-me-in-tournament

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fit-me-in-tournament
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fix inferred display-cell type and format changed files
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/TetrisComp/TetrisComp.tsx')
          text = path.read_text()
          old = "    const display = board.slice(BUFFER_ROWS).map((row) =>"
          new = "    const display: (DisplayCell | null)[][] = board.slice(BUFFER_ROWS).map((row) =>"
          if old not in text:
              raise SystemExit('Expected display declaration was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write \
            src/components/TetrisComp/TetrisComp.tsx \
            src/components/TetrisComp/TetrisTournament.css \
            src/components/TetrisComp/tournament.ts \
            src/features/tetris/tetrisSlice.ts \
            src/minigames/registry.ts \
            tests/unit/tetrisTournament.test.ts
      - name: Commit formatting repair
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/components/TetrisComp/TetrisComp.tsx \
            src/components/TetrisComp/TetrisTournament.css \
            src/components/TetrisComp/tournament.ts \
            src/features/tetris/tetrisSlice.ts \
            src/minigames/registry.ts \
            tests/unit/tetrisTournament.test.ts
          git commit -m "Format Fit Me In tournament implementation"
          git push
