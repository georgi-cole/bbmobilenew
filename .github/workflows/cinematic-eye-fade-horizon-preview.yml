name: Cinematic eye fade horizon preview

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/cinematic/**'
      - 'src/remotion/**'
      - '.github/workflows/cinematic-eye-fade-horizon-preview.yml'

permissions:
  contents: read

jobs:
  render-preview:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Render eye fade to horizon preview
        run: >-
          npx remotion render
          src/remotion/index.ts
          BigEyeCinematicBackground
          renders/eye-fade-horizon-preview.mp4
          --codec=h264
          --pixel-format=yuv420p
          --image-format=png
          --color-space=bt709
          --frames=1370-1619
          --concurrency=2
          --gl=swangle

      - name: Upload preview video
        uses: actions/upload-artifact@v4
        with:
          name: eye-fade-horizon-preview
          path: renders/eye-fade-horizon-preview.mp4
          retention-days: 7
