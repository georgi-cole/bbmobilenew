name: Temporary Majority Rules Formatter

on:
  push:
    branches:
      - fix/majority-rules-vote-realism

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/majority-rules-vote-realism
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Majority Rules changes
        run: >-
          npx prettier --write
          src/features/majorityRules/helpers.ts
          tests/unit/majorityRules/majorityRules.aiRealism.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/majorityRules/helpers.ts
          git add tests/unit/majorityRules/majorityRules.aiRealism.test.ts
          git commit -m "Format Majority Rules realism changes"
          git push origin HEAD:fix/majority-rules-vote-realism
