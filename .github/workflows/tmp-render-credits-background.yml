name: Temporary render high-quality credits background

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  render:
    if: github.head_ref == 'agent/fix-credits-smooth-playback' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-credits-smooth-playback
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ensure Remotion browser
        run: npx remotion browser ensure
      - name: Render original cinematic without credit text
        shell: bash
        run: |
          set -o pipefail
          mkdir -p renders public/assets/cinematic
          npx remotion render \
            src/remotion/index.ts \
            BigEyeCinematicBackground \
            renders/credits-background-source.mp4 \
            --codec=h264 \
            --pixel-format=yuv420p \
            --image-format=png \
            --color-space=bt709 \
            --concurrency=2 2>&1 | tee renders/credits-background-render.log
          ffmpeg -y \
            -i renders/credits-background-source.mp4 \
            -vf scale=720:1280:flags=lanczos \
            -c:v libx264 \
            -preset slow \
            -crf 21 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 192k \
            -movflags +faststart \
            public/assets/cinematic/credits-background.mp4
          test "$(stat -c%s public/assets/cinematic/credits-background.mp4)" -lt 100000000
          ls -lh public/assets/cinematic/credits-background.mp4
      - name: Upload render diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credits-background-render-diagnostics
          path: |
            renders/credits-background-render.log
            renders/credits-background-source.mp4
          if-no-files-found: ignore
          retention-days: 3
      - name: Commit background video and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/tmp-render-credits-background.yml
          rm -f renders/credits-background-source.mp4 renders/credits-background-render.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f public/assets/cinematic/credits-background.mp4
          git add -A
          git commit -m "Add pre-rendered credits cinematic background"
          git push origin HEAD:agent/fix-credits-smooth-playback
