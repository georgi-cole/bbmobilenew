name: Agent Format Battery Low

on:
  push:
    branches:
      - agent/redesign-battery-low-1226

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/redesign-battery-low-1226
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Battery Low changes
        run: >-
          npx prettier --write
          src/components/VaultVerdict/VaultVerdict.tsx
          src/components/VaultVerdict/VaultVerdict.css
          tests/unit/battery-low/BatteryLow.ui.test.tsx
          tests/unit/battery-low/BatteryLow.styles.test.ts

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/VaultVerdict/VaultVerdict.tsx \
            src/components/VaultVerdict/VaultVerdict.css \
            tests/unit/battery-low/BatteryLow.ui.test.tsx \
            tests/unit/battery-low/BatteryLow.styles.test.ts
          git commit -m "Format Battery Low changes"
          git push origin HEAD:agent/redesign-battery-low-1226
