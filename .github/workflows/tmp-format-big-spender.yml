name: Temporary Big Spender formatter

on:
  push:
    branches:
      - agent/big-spender-modernization

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/big-spender-modernization
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Big Spender stylesheet
        run: npx prettier --write src/components/BigSpender/BigSpenderModern.css

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- src/components/BigSpender/BigSpenderModern.css; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/BigSpender/BigSpenderModern.css
          git commit -m "Format Big Spender stylesheet"
          git push origin HEAD:agent/big-spender-modernization
