name: Apply Music Manager integration

on:
  push:
    branches:
      - agent/music-manager-runtime-ui
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-music-manager-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/music-manager-runtime-ui
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply source integration
        run: python scripts/apply-music-manager-integration.py

      - name: Install dependencies
        run: npm ci

      - name: Format touched files
        run: |
          npx prettier --write \
            src/remoteConfig/remoteConfigService.ts \
            src/screens/SettingsAdmin/SettingsAdmin.tsx \
            src/screens/SettingsAdmin/MusicManagerPanel.tsx \
            src/components/MinigameHost/MinigameHost.tsx \
            src/screens/GameScreen/GameScreen.tsx \
            src/services/sound/AudioStateSync.tsx \
            src/services/sound/SoundManager.ts \
            src/services/sound/musicRuntimeConfig.ts \
            src/store/challengeSlice.ts \
            src/store/soundMiddleware.ts \
            tests/unit/sound/queue.test.ts \
            tests/unit/sound/musicRuntimeConfig.test.ts \
            tests/unit/sound/musicConfigSanitizer.test.ts

      - name: Commit integrated runtime
        run: |
          git rm \
            scripts/apply-music-manager-integration.py \
            .github/workflows/apply-music-manager-integration.yml \
            src/services/sound/minigameHostPhaseObserver.ts \
            tests/unit/sound/minigameHostPhaseObserver.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete configurable Music Manager runtime"
          git push origin HEAD:refs/heads/agent/music-manager-runtime-ui

      - name: Validate focused regressions
        run: |
          npm run lint:ci
          npx vitest run \
            tests/unit/sound/queue.test.ts \
            tests/unit/sound/soundMiddleware.test.ts \
            tests/unit/sound/musicConfigAudit.test.ts \
            tests/unit/sound/musicConfigSanitizer.test.ts \
            tests/unit/sound/musicRuntimeConfig.test.ts \
            tests/unit/sound/resolveDesiredMusic.test.ts \
            tests/unit/sound/minigameMusicConfig.test.ts
          npm run build
