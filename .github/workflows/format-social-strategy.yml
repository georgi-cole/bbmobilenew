name: Temporary Social Strategy Formatter

on:
  push:
    branches:
      - feature/social-strategy-consequences
    paths:
      - .github/workflows/format-social-strategy.yml

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'Add temporary social strategy formatter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/social-strategy-consequences
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed social strategy files
        run: >-
          npx prettier --write
          src/components/SocialPanelV2/ActionGrid.tsx
          src/social/socialStrategyActions.ts
          src/social/socialStrategyDeception.ts
          src/social/socialStrategyInvitation.ts
          src/social/socialStrategyPressure.ts
          src/social/socialStrategyShared.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SocialPanelV2/ActionGrid.tsx src/social/socialStrategyActions.ts src/social/socialStrategyDeception.ts src/social/socialStrategyInvitation.ts src/social/socialStrategyPressure.ts src/social/socialStrategyShared.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format social strategy implementation"
            git push origin HEAD:feature/social-strategy-consequences
          fi
