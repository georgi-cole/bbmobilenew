name: Format incoming interaction changes

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/incoming-interactions-encoding-layout

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/incoming-interactions-encoding-layout

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: |
          npx prettier --write \
            src/components/IncomingInteractionsInbox/IncomingInteractionIcon.tsx \
            src/components/IncomingInteractionsInbox/IncomingInteractionsInbox.tsx \
            src/components/IncomingInteractionsInbox/IncomingInteractionsInbox.css \
            src/components/IncomingInteractionsInbox/__tests__/IncomingInteractionsInbox.encoding.test.tsx

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/IncomingInteractionsInbox/IncomingInteractionIcon.tsx \
            src/components/IncomingInteractionsInbox/IncomingInteractionsInbox.tsx \
            src/components/IncomingInteractionsInbox/IncomingInteractionsInbox.css \
            src/components/IncomingInteractionsInbox/__tests__/IncomingInteractionsInbox.encoding.test.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "Format incoming interaction files [skip ci]"
            git push origin HEAD:fix/incoming-interactions-encoding-layout
          fi
