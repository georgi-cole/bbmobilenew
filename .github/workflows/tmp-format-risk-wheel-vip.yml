name: Temporary Risk Wheel VIP Formatter

on:
  push:
    branches:
      - codex/risk-wheel-vip-premium

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/risk-wheel-vip-premium
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Risk Wheel VIP changes
        run: >-
          npx prettier --write
          src/components/RiskWheelComp/RiskWheelComp.tsx
          tests/unit/riskWheel/RiskWheelComp.styles.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/RiskWheelComp/RiskWheelComp.tsx
          git add tests/unit/riskWheel/RiskWheelComp.styles.test.ts
          git commit -m "Format Risk Wheel VIP changes"
          git push origin HEAD:codex/risk-wheel-vip-premium
