name: Fix PR 1345 unused constant fast

on:
  push:
    branches:
      - fix/prod-debug-and-multimode-saves

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prod-debug-and-multimode-saves
      - name: Apply and push
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('e2e/playwright/finale.spec.ts')
          text = path.read_text()
          target = "const SAVED_RUNS_KEY = `bbmobilenew:savedRuns:${encodeURIComponent(PROFILE_ID)}`\n"
          if target in text:
              path.write_text(text.replace(target, '', 1))
          PY
          git rm .github/workflows/fix-pr-1345-unused-constant-fast.yml
          git rm -f .github/workflows/fix-pr-1345-unused-constant.yml || true
          git rm -f .lint-fix-trigger || true
          git add e2e/playwright/finale.spec.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: remove unused finale save key"
          git push origin HEAD:fix/prod-debug-and-multimode-saves
