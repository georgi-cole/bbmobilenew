name: Temporary After the Eye formatter

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format-after-eye:
    if: github.head_ref == 'agent/redesign-after-the-eye-tabloid' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/redesign-after-the-eye-tabloid
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format After the Eye files
        run: >-
          npx prettier --write
          docs/after-the-eye-config.md
          package.json
          scripts/generate-after-the-eye-config.mjs
          scripts/validate-after-the-eye-config.mjs
          src/screens/GameOver/AftermathTabloid.css
          src/screens/GameOver/GameOver.tsx
          src/screens/GameOver/aftermath.ts
          src/screens/GameOver/afterTheEyeOutcomeConfig.ts
          src/screens/GameOver/afterTheEyeOutcomeLinkedScenarios.ts
          src/screens/GameOver/afterTheEyeOutcomeScenarios1.ts
          src/screens/GameOver/afterTheEyeOutcomeScenarios2.ts
          src/screens/GameOver/afterTheEyeOutcomeScenarios3.ts
          src/screens/GameOver/afterTheEyeOutcomeScenarios4.ts
          src/screens/GameOver/afterTheEyeOutcomeScenarios5.ts
          src/screens/GameOver/afterTheEyeOutcomeTypes.ts
          tests/unit/gameOver/aftermath.test.ts
          .github/workflows/tmp-after-eye-format.yml
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/after-the-eye-config.md package.json scripts/generate-after-the-eye-config.mjs scripts/validate-after-the-eye-config.mjs src/screens/GameOver tests/unit/gameOver/aftermath.test.ts .github/workflows/tmp-after-eye-format.yml
          git commit -m "Format After the Eye implementation"
          git push origin HEAD:agent/redesign-after-the-eye-tabloid
