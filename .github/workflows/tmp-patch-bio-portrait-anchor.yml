name: Temporary patch biography portrait anchor

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/fix-bios-broadcast-hero' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-bios-broadcast-hero
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Anchor default full-body portraits to the stage floor
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/components/HousematesBioCinematic/HousematesBioCinematic.tsx')
          source = path.read_text()
          old = "style={{ objectPosition: card.portraitPosition ?? 'center 12%' }}"
          new = "style={{ objectPosition: card.portraitPosition ?? 'center bottom' }}"
          if old not in source:
              raise SystemExit('Expected biography portrait anchor was not found')
          path.write_text(source.replace(old, new))
      - run: npx prettier --write src/components/HousematesBioCinematic/HousematesBioCinematic.tsx
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/tmp-patch-bio-portrait-anchor.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Anchor biography portraits to stage floor"
          git push origin HEAD:agent/fix-bios-broadcast-hero
