name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            os: ubuntu-latest
            build-mode: none
          - language: javascript-typescript
            os: ubuntu-latest
            build-mode: none
          - language: java-kotlin
            os: ubuntu-latest
            build-mode: none
          - language: swift
            os: macos-latest
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: matrix.language == 'swift'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install native dependencies
        if: matrix.language == 'swift'
        run: npm ci

      - name: Sync iOS web assets
        if: matrix.language == 'swift'
        run: npm run sync:ios

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build iOS app for analysis
        if: matrix.language == 'swift'
        run: >-
          xcodebuild build
          -project ios/App/App.xcodeproj
          -target App
          -configuration Debug
          -sdk iphonesimulator
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
