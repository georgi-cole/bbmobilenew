name: Lint

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint:ci

  music-cue-phase2-editor:
    if: github.head_ref == 'agent/music-cue-editor-phase2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/music-cue-editor-phase2
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Music Manager editor implementation
        shell: python
        run: |
          from pathlib import Path

          lines = Path('.github/workflows/music-cue-phase2-ui.yml').read_text().splitlines()
          start = lines.index('# python: |') + 1
          end = lines.index('# IMPLEMENTATION_SOURCE_END')
          source_lines = []
          for line in lines[start:end]:
              if line == '#':
                  source_lines.append('')
              elif line.startswith('#   '):
                  source_lines.append(line[4:])
              else:
                  raise SystemExit(f'Unexpected implementation source line: {line!r}')
          source = '\n'.join(source_lines)
          strict_helper = '''def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f'Could not locate UI replacement in {path}: {old[:120]!r}')
              target.write_text(text.replace(old, new, 1))
          '''
          tolerant_helper = '''def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old in text:
                  target.write_text(text.replace(old, new, 1))
                  return
              text_lines = text.splitlines(keepends=True)
              old_lines = old.splitlines(keepends=True)
              new_lines = new.splitlines(keepends=True)
              normalized_old = [line.lstrip() for line in old_lines]
              for index in range(0, len(text_lines) - len(old_lines) + 1):
                  candidate = text_lines[index:index + len(old_lines)]
                  if [line.lstrip() for line in candidate] != normalized_old:
                      continue
                  matched_indent = candidate[0][:-len(candidate[0].lstrip())]
                  new_indent = new_lines[0][:-len(new_lines[0].lstrip())] if new_lines else ''
                  adjusted = []
                  for line in new_lines:
                      if not line.strip():
                          adjusted.append(line)
                          continue
                      line_indent = line[:-len(line.lstrip())]
                      relative = line_indent[len(new_indent):] if line_indent.startswith(new_indent) else line_indent
                      adjusted.append(matched_indent + relative + line.lstrip())
                  target.write_text(''.join(text_lines[:index] + adjusted + text_lines[index + len(old_lines):]))
                  return
              raise SystemExit(f'Could not locate UI replacement in {path}: {old[:120]!r}')
          '''
          if strict_helper not in source:
              raise SystemExit('Could not locate strict UI replacement helper')
          source = source.replace(strict_helper, tolerant_helper, 1)
          exec(compile(source, 'music-cue-phase2-editor', 'exec'))

      - name: Stabilize cue metadata reader
        shell: python
        run: |
          from pathlib import Path

          target = Path('src/screens/SettingsAdmin/MusicCueEditor.tsx')
          text = target.read_text()
          old = '''    useEffect(() => {
              setDuration(null)
              if (!draft) return
              const asset = effectiveAssetMap.get(draft.track)
              const bundled = getMusicTrackSoundEntry(draft.track)
          '''
          new = '''    const draftTrack = draft?.track

            useEffect(() => {
              setDuration(null)
              if (!draftTrack) return
              const asset = effectiveAssetMap.get(draftTrack)
              const bundled = getMusicTrackSoundEntry(draftTrack)
          '''
          if old not in text:
              raise SystemExit('Could not locate cue metadata effect body')
          text = text.replace(old, new, 1)
          old_dependencies = '    }, [draft?.track, effectiveAssetMap])\n'
          new_dependencies = '    }, [draftTrack, effectiveAssetMap])\n'
          if old_dependencies not in text:
              raise SystemExit('Could not locate cue metadata effect dependencies')
          target.write_text(text.replace(old_dependencies, new_dependencies, 1))

      - name: Format Music Manager editor
        run: |
          npx prettier --write \
            src/screens/SettingsAdmin/MusicCueEditor.tsx \
            src/screens/SettingsAdmin/MusicManagerPanel.tsx \
            src/screens/SettingsAdmin/MusicManagerPanel.css \
            src/services/sound/musicConfigAudit.ts \
            tests/unit/sound/musicCueAudit.test.ts \
            tests/unit/sound/musicCueSanitizer.test.ts

      - name: Validate Music Manager editor
        run: |
          npm run test:guard
          npm run lint:ci
          npm run typecheck
          npx vitest run \
            tests/unit/sound/musicCue.test.ts \
            tests/unit/sound/musicCueResolver.test.ts \
            tests/unit/sound/MusicCueEngine.test.ts \
            tests/unit/sound/musicCueAudit.test.ts \
            tests/unit/sound/musicCueSanitizer.test.ts \
            tests/unit/sound/musicConfigAudit.test.ts \
            tests/unit/sound/musicConfigSanitizer.test.ts \
            tests/unit/sound/musicRuntimeConfig.test.ts \
            tests/unit/sound/resolveDesiredMusic.test.ts \
            tests/unit/sound/queue.test.ts
          npm run build
          npm run build:mobile

      - name: Commit validated Music Manager editor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/screens/SettingsAdmin/MusicCueEditor.tsx \
            src/screens/SettingsAdmin/MusicManagerPanel.tsx \
            src/screens/SettingsAdmin/MusicManagerPanel.css \
            src/services/sound/musicConfigAudit.ts \
            tests/unit/sound/musicCueAudit.test.ts \
            tests/unit/sound/musicCueSanitizer.test.ts
          git commit -m 'Add Music Manager cue editor and variant controls'
          git push origin HEAD:refs/heads/agent/music-cue-editor-phase2
