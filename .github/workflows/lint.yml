name: Lint

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint:ci

  music-cue-phase2-hardening:
    if: github.head_ref == 'agent/music-cue-editor-phase2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/music-cue-editor-phase2
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply hardening fixes
        run: python scripts/harden-music-cue-phase2.py

      - name: Format hardening changes
        run: |
          npx prettier --write \
            src/screens/SettingsAdmin/MusicCueEditor.tsx \
            src/services/sound/musicCue.ts \
            src/services/sound/musicConfig.ts \
            src/services/sound/musicConfigSanitizer.ts \
            src/services/sound/musicConfigAudit.ts \
            src/services/sound/MusicCueEngine.ts \
            src/services/sound/SoundManager.ts \
            src/services/sound/AudioStateSync.tsx \
            src/components/MinigameHost/MinigameHost.tsx \
            src/components/RiskWheelComp/RiskWheelComp.tsx \
            tests/unit/sound/MusicCueEditor.test.tsx \
            tests/unit/sound/AudioStateSyncCueTransitions.test.ts \
            tests/unit/sound/musicCue.test.ts \
            tests/unit/sound/MusicCueEngine.test.ts \
            tests/unit/sound/musicCueAudit.test.ts

      - name: Validate hardening changes
        run: |
          npm run test:guard
          npm run lint:ci
          npm run typecheck
          npx vitest run \
            tests/unit/sound/MusicCueEditor.test.tsx \
            tests/unit/sound/AudioStateSyncCueTransitions.test.ts \
            tests/unit/sound/musicCue.test.ts \
            tests/unit/sound/MusicCueEngine.test.ts \
            tests/unit/sound/musicCueAudit.test.ts \
            tests/unit/sound/musicCueResolver.test.ts \
            tests/unit/sound/musicCueSanitizer.test.ts \
            tests/unit/sound/musicConfigAudit.test.ts \
            tests/unit/sound/musicConfigSanitizer.test.ts \
            tests/unit/sound/musicRuntimeConfig.test.ts \
            tests/unit/sound/resolveDesiredMusic.test.ts \
            tests/unit/sound/queue.test.ts
          npm run build
          npm run build:mobile

      - name: Commit validated hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/screens/SettingsAdmin/MusicCueEditor.tsx \
            src/services/sound/musicCue.ts \
            src/services/sound/musicConfig.ts \
            src/services/sound/musicConfigSanitizer.ts \
            src/services/sound/musicConfigAudit.ts \
            src/services/sound/MusicCueEngine.ts \
            src/services/sound/SoundManager.ts \
            src/services/sound/AudioStateSync.tsx \
            src/components/MinigameHost/MinigameHost.tsx \
            src/components/RiskWheelComp/RiskWheelComp.tsx \
            tests/unit/sound/MusicCueEditor.test.tsx \
            tests/unit/sound/AudioStateSyncCueTransitions.test.ts \
            tests/unit/sound/musicCue.test.ts \
            tests/unit/sound/MusicCueEngine.test.ts \
            tests/unit/sound/musicCueAudit.test.ts
          git commit -m 'Harden Music Cue transitions and editor drafts'
          git push origin HEAD:refs/heads/agent/music-cue-editor-phase2
