name: Lint

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint:ci

  music-cue-phase2-hardening:
    if: github.head_ref == 'agent/music-cue-editor-phase2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/music-cue-editor-phase2
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply hardening fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f'Could not locate hardening anchor in {path}: {old[:120]!r}')
              target.write_text(text.replace(old, new, 1))

          # Keep unsaved and duplicated cue drafts stable while saved config refreshes.
          replace_once(
              'src/screens/SettingsAdmin/MusicCueEditor.tsx',
              '''  const engine = () => {
            engineRef.current ??= new MusicCueEngine()
            return engineRef.current
          }

          useEffect(() => {
            if (!selectedCueId && cueIds[0]) setSelectedCueId(cueIds[0])
            if (selectedCueId && !effectiveCues[selectedCueId]) {
              setSelectedCueId(cueIds[0] ?? '')
            }
          }, [cueIds, effectiveCues, selectedCueId])

          useEffect(() => {
            setDraft(selectedCueId ? (effectiveCues[selectedCueId] ?? null) : null)
          }, [effectiveCues, selectedCueId])

          const draftTrack = draft?.track
          ''',
              '''  const engine = () => {
            engineRef.current ??= new MusicCueEngine({ onEnded: () => setPreviewing(false) })
            return engineRef.current
          }

          const draftId = draft?.id
          useEffect(() => {
            if (!selectedCueId && cueIds[0] && !draftId) setSelectedCueId(cueIds[0])
            if (selectedCueId && !effectiveCues[selectedCueId] && draftId !== selectedCueId) {
              setSelectedCueId(cueIds[0] ?? '')
            }
          }, [cueIds, draftId, effectiveCues, selectedCueId])

          useEffect(() => {
            const savedCue = selectedCueId ? effectiveCues[selectedCueId] : undefined
            if (savedCue) setDraft(savedCue)
            else if (!selectedCueId) setDraft(null)
          }, [effectiveCues, selectedCueId])

          const draftTrack = draft?.track
          ''',
          )
          replace_once(
              'src/screens/SettingsAdmin/MusicCueEditor.tsx',
              '''  const createCue = () => {
            const id = nextCueId(newTrack, effectiveCues)
          ''',
              '''  const createCue = () => {
            const occupiedCues = draft ? { ...effectiveCues, [draft.id]: draft } : effectiveCues
            const id = nextCueId(newTrack, occupiedCues)
          ''',
          )
          replace_once(
              'src/screens/SettingsAdmin/MusicCueEditor.tsx',
              '''  const duplicateCue = () => {
            if (!draft) return
            const id = nextCueId(draft.track, effectiveCues)
          ''',
              '''  const duplicateCue = () => {
            if (!draft) return
            const id = nextCueId(draft.track, { ...effectiveCues, [draft.id]: draft })
          ''',
          )
          replace_once(
              'src/screens/SettingsAdmin/MusicCueEditor.tsx',
              '''              <label>
                        <span>Fallback cue</span>
                        <select
                          value={draft.fallbackCueId ?? ''}
                          onChange={(event) =>
                            patchDraft({ fallbackCueId: event.target.value || undefined })
                          }
                        >
                          <option value="">None</option>
                          {cueIds
                            .filter((id) => id !== draft.id)
                            .map((id) => (
                              <option key={id} value={id}>
                                {effectiveCues[id].displayName}
                              </option>
                            ))}
                        </select>
                      </label>
          ''',
              '',
          )

          # Cue-only loop changes must activate the cue engine, and remove unimplemented cue fallbacks.
          replace_once(
              'src/services/sound/musicCue.ts',
              '  fallbackCueId?: string\n',
              '',
          )
          replace_once(
              'src/services/sound/musicCue.ts',
              'export function isAdvancedMusicCue(cue: MusicCueDefinition | undefined): boolean {\n',
              'export function isAdvancedMusicCue(\n  cue: MusicCueDefinition | undefined,\n  defaultLoop = true\n): boolean {\n',
          )
          replace_once(
              'src/services/sound/musicCue.ts',
              '''    cue.loopEndSec !== undefined ||
              cue.volume !== 1 ||
          ''',
              '''    cue.loopEndSec !== undefined ||
              cue.loop !== defaultLoop ||
              cue.volume !== 1 ||
          ''',
          )
          replace_once(
              'src/services/sound/musicConfig.ts',
              '  transition?: MusicTransitionPolicy\n  playbackCue?: MusicCueDefinition\n}\n\nexport type MinigameStageAssignments',
              '  transition?: MusicTransitionPolicy\n}\n\nexport type MinigameStageAssignments',
          )
          replace_once(
              'src/services/sound/musicConfigSanitizer.ts',
              '  const fallbackCueId = safeString(raw.fallbackCueId)\n\n',
              '',
          )
          replace_once(
              'src/services/sound/musicConfigSanitizer.ts',
              '''    restartPolicy,
              effectPreset,
              ...(fallbackCueId ? { fallbackCueId } : {}),
          ''',
              '''    restartPolicy,
              effectPreset,
          ''',
          )

          audit = Path('src/services/sound/musicConfigAudit.ts')
          audit_text = audit.read_text()
          fallback_start = audit_text.index('    if (cue.fallbackCueId && !config.musicCues[cue.fallbackCueId]) {')
          fallback_end = audit_text.index('  }\n\n  const visit =', fallback_start)
          audit.write_text(audit_text[:fallback_start] + audit_text[fallback_end:])

          # Re-seek after metadata on mobile and support an external entry crossfade.
          replace_once(
              'src/services/sound/MusicCueEngine.ts',
              '''function resetTime(element: HTMLAudioElement, time = 0): void {
            try {
              element.currentTime = Math.max(0, time)
          ''',
              '''function resetTime(element: HTMLAudioElement, time = 0): void {
            try {
              const maximum =
                Number.isFinite(element.duration) && element.duration > 0
                  ? Math.max(0, element.duration - 0.01)
                  : Number.POSITIVE_INFINITY
              element.currentTime = Math.min(maximum, Math.max(0, time))
          ''',
          )
          replace_once(
              'src/services/sound/MusicCueEngine.ts',
              '''export interface MusicCueEngineHooks {
            onEnded?: (signature: string) => void
          }
          ''',
              '''export interface MusicCueEngineHooks {
            onEnded?: (signature: string) => void
          }

          export interface MusicCuePlayOptions {
            /** Fade used when the outgoing deck is owned by the legacy music path. */
            entryFadeMs?: number
          }
          ''',
          )
          replace_once(
              'src/services/sound/MusicCueEngine.ts',
              '''  get currentSignature(): string | null {
            return this._active?.signature ?? null
          }
          ''',
              '''  get currentSignature(): string | null {
            return this._active?.signature ?? null
          }

          get currentCue(): MusicCueDefinition | null {
            return this._active?.cue ?? null
          }
          ''',
          )
          replace_once(
              'src/services/sound/MusicCueEngine.ts',
              '  async play(asset: MusicCueAsset, cue: MusicCueDefinition): Promise<void> {\n',
              '  async play(\n    asset: MusicCueAsset,\n    cue: MusicCueDefinition,\n    options: MusicCuePlayOptions = {}\n  ): Promise<void> {\n',
          )
          replace_once(
              'src/services/sound/MusicCueEngine.ts',
              '''    const incoming = this._createDeck(asset, cue, signature)
              const outgoing = this._active
              this._standby = incoming

              const resumeAt =
                cue.restartPolicy === 'resume'
                  ? (this._resumePositions.get(cue.id) ?? cue.startAtSec)
                  : cue.startAtSec
              resetTime(incoming.element, resumeAt)

              const transitionMs = outgoing ? cue.crossfadeMs : cue.fadeInMs
          ''',
              '''    const resumeAt =
                cue.restartPolicy === 'resume'
                  ? (this._resumePositions.get(cue.id) ?? cue.startAtSec)
                  : cue.startAtSec
              const incoming = this._createDeck(asset, cue, signature, resumeAt)
              const outgoing = this._active
              this._standby = incoming
              resetTime(incoming.element, resumeAt)

              const transitionMs = outgoing ? cue.crossfadeMs : (options.entryFadeMs ?? cue.fadeInMs)
          ''',
          )
          replace_once(
              'src/services/sound/MusicCueEngine.ts',
              '''  private _createDeck(asset: MusicCueAsset, cue: MusicCueDefinition, signature: string): CueDeck {
            const element = document.createElement('audio')
            element.src = asset.src
            element.preload = 'auto'
            element.loop = cue.loop && cue.endAtSec === undefined && cue.loopEndSec === undefined
          ''',
              '''  private _createDeck(
            asset: MusicCueAsset,
            cue: MusicCueDefinition,
            signature: string,
            initialTime: number
          ): CueDeck {
            const element = document.createElement('audio')
            element.src = asset.src
            element.preload = 'auto'
            element.loop =
              cue.loop &&
              cue.startAtSec === 0 &&
              cue.endAtSec === undefined &&
              cue.loopEndSec === undefined
          ''',
          )
          replace_once(
              'src/services/sound/MusicCueEngine.ts',
              '''    const onTimeUpdate = () => this._handleBoundary(deck)
              const onEnded = () => this._handleNaturalEnd(deck)
              element.addEventListener('timeupdate', onTimeUpdate)
              element.addEventListener('ended', onEnded)
              deck.cleanup = () => {
                element.removeEventListener('timeupdate', onTimeUpdate)
                element.removeEventListener('ended', onEnded)
              }
          ''',
              '''    const onLoadedMetadata = () => resetTime(element, initialTime)
              const onTimeUpdate = () => this._handleBoundary(deck)
              const onEnded = () => this._handleNaturalEnd(deck)
              element.addEventListener('loadedmetadata', onLoadedMetadata)
              element.addEventListener('timeupdate', onTimeUpdate)
              element.addEventListener('ended', onEnded)
              deck.cleanup = () => {
                element.removeEventListener('loadedmetadata', onLoadedMetadata)
                element.removeEventListener('timeupdate', onTimeUpdate)
                element.removeEventListener('ended', onEnded)
              }
          ''',
          )

          # Bridge legacy whole-track playback into the two-deck final-round crossfade.
          sound = Path('src/services/sound/SoundManager.ts')
          sound_text = sound.read_text()
          method_start = sound_text.index('  async setDesiredMusicCue(')
          method_end = sound_text.index('\n  async setDesiredMusic(track:', method_start)
          new_method = '''  async setDesiredMusicCue(cue: ResolvedMusicCue, reason?: string): Promise<void> {
            const playbackCue = cue.playbackCue
            const candidate = cue.track === 'none' ? null : this._resolveMusicCandidate(cue.track)
            const defaultLoop = candidate ? (this._getEntry(candidate.key)?.loop ?? true) : true
            if (!playbackCue || !isAdvancedMusicCue(playbackCue, defaultLoop)) {
              const transitionToken = ++this._musicPlaybackToken
              const outgoingCue = this._cueEngine.currentCue
              if (this._cueEngine.currentElement) {
                await this._cueEngine.fadeOut(outgoingCue?.fadeOutMs ?? 0)
                if (transitionToken !== this._musicPlaybackToken) return
              } else {
                this._cueEngine.stop()
              }
              this._desiredResolvedCue = null
              this._desiredAdvancedCueSignature = null
              return this.setDesiredMusic(cue.track, reason)
            }

            this._desiredResolvedCue = cue
            this._desiredMusicTrack = cue.track
            this._desiredMusicReason = reason ?? null
            const signature = musicCueSignature(playbackCue, candidate?.key ?? '')
            if (this._desiredAdvancedCueSignature !== signature) this._cueEngine.clearCompleted()
            this._desiredAdvancedCueSignature = signature
            await this.syncMusic()
          }
          '''
          sound_text = sound_text[:method_start] + new_method + sound_text[method_end:]
          sound_text = sound_text.replace(
              '''    const advancedCue = this._desiredResolvedCue?.playbackCue
              if (advancedCue && isAdvancedMusicCue(advancedCue)) {
          ''',
              '''    const advancedCue = this._desiredResolvedCue?.playbackCue
              const candidateEntry = this._getEntry(candidate.key)
              if (advancedCue && isAdvancedMusicCue(advancedCue, candidateEntry?.loop ?? true)) {
          ''',
              1,
          )
          play_start = sound_text.index('  private async _doPlayAdvancedMusic(')
          play_end = sound_text.index('\n  /** Stop the currently-playing music track', play_start)
          new_advanced = '''  private async _doPlayAdvancedMusic(
            candidate: ResolvedMusicCandidate,
            cue: MusicCueDefinition,
            playbackToken: number
          ): Promise<void> {
            const entry = this._getEntry(candidate.key)
            if (!entry || this._failedKeys.has(candidate.key)) {
              if (entry == null) this._failedKeys.add(candidate.key)
              void this.syncMusic()
              return
            }

            const outgoingLegacy =
              this._musicEl && this._musicEl !== this._cueEngine.currentElement ? this._musicEl : null
            if (outgoingLegacy && cue.crossfadeMs <= 0) this._stopExternalMusicElement(outgoingLegacy)

            try {
              const playIncoming = this._cueEngine.play(
                {
                  key: candidate.key,
                  track: candidate.track,
                  src: entry.src,
                  volume: entry.volume ?? 1,
                  loop: entry.loop ?? true,
                },
                cue,
                outgoingLegacy && cue.crossfadeMs > 0 ? { entryFadeMs: cue.crossfadeMs } : {}
              )
              if (outgoingLegacy && cue.crossfadeMs > 0) {
                await Promise.all([
                  playIncoming,
                  this._fadeExternalMusicElement(outgoingLegacy, cue.crossfadeMs),
                ])
              } else {
                await playIncoming
              }
              if (
                playbackToken !== this._musicPlaybackToken ||
                this._desiredAdvancedCueSignature !== musicCueSignature(cue, candidate.key)
              ) {
                this._cueEngine.stop()
                return
              }
              this._cueEngine.setMasterVolume(this._musicVolume)
              this._musicEl = this._cueEngine.currentElement
              this._musicKey = candidate.key
              this._playingMusicTrack = candidate.track
              _bgmLog('playing-cue', candidate.track, entry.src)
            } catch (error) {
              if (playbackToken !== this._musicPlaybackToken) return
              console.error(`[SoundManager] advanced music cue failed "${candidate.key}":`, error)
              this._failedKeys.add(candidate.key)
              this._cueEngine.stop()
              this._musicEl = null
              this._musicKey = null
              this._playingMusicTrack = 'none'
              void this.syncMusic()
            }
          }

          private async _fadeExternalMusicElement(
            element: HTMLAudioElement,
            durationMs: number
          ): Promise<void> {
            if (durationMs <= 0) {
              this._stopExternalMusicElement(element)
              return
            }
            const startVolume = element.volume
            const steps = Math.max(1, Math.ceil(durationMs / 40))
            await new Promise<void>((resolve) => {
              let step = 0
              const timer = window.setInterval(() => {
                step += 1
                element.volume = Math.max(0, startVolume * (1 - step / steps))
                if (step >= steps) {
                  window.clearInterval(timer)
                  resolve()
                }
              }, Math.max(16, Math.floor(durationMs / steps)))
            })
            this._stopExternalMusicElement(element)
          }

          private _stopExternalMusicElement(element: HTMLAudioElement): void {
            element.pause()
            _resetAudioTime(element)
            _liveMusicElements.delete(element)
            if (this._musicEl === element) {
              this._musicEl = null
              this._musicKey = null
              this._playingMusicTrack = 'none'
            }
          }
          '''
          sound.write_text(sound_text[:play_start] + new_advanced + sound_text[play_end:])

          # Managed lifecycle fades must not hide a cue-to-cue variant crossfade.
          replace_once(
              'src/services/sound/AudioStateSync.tsx',
              "import { buildEffectiveMusicConfig, mergeMusicTrackAssets } from './musicRuntimeConfig'\n",
              "import { buildEffectiveMusicConfig, mergeMusicTrackAssets } from './musicRuntimeConfig'\nimport { musicCueSignature } from './musicCue'\n",
          )
          replace_once(
              'src/services/sound/AudioStateSync.tsx',
              '''function cueReason(cue: ResolvedMusicCue): string {
            return `${cue.source}:${cue.assignmentId}`
          }
          ''',
              '''function cueReason(cue: ResolvedMusicCue): string {
            return `${cue.source}:${cue.assignmentId}`
          }

          export function hasSameResolvedPlayback(
            previousCue: ResolvedMusicCue,
            nextCue: ResolvedMusicCue
          ): boolean {
            if (
              previousCue.track !== nextCue.track ||
              previousCue.assignmentId !== nextCue.assignmentId
            ) {
              return false
            }
            const previousSignature = previousCue.playbackCue
              ? musicCueSignature(previousCue.playbackCue)
              : ''
            const nextSignature = nextCue.playbackCue ? musicCueSignature(nextCue.playbackCue) : ''
            return previousSignature === nextSignature
          }

          export function shouldCrossfadeManagedMinigameCue(
            previousCue: ResolvedMusicCue,
            nextCue: ResolvedMusicCue
          ): boolean {
            return (
              isManagedMinigameCue(previousCue) &&
              isManagedMinigameCue(nextCue) &&
              !hasSameResolvedPlayback(previousCue, nextCue)
            )
          }
          ''',
          )
          replace_once(
              'src/services/sound/AudioStateSync.tsx',
              '''      if (
                previousCue.track === desiredCue.track &&
                previousCue.assignmentId === desiredCue.assignmentId
              ) {
                SoundManager.setMusicVolume(musicState.musicVolume)
                return
              }

              SoundManager.setMusicVolume(0)
          ''',
              '''      if (hasSameResolvedPlayback(previousCue, desiredCue)) {
                SoundManager.setMusicVolume(musicState.musicVolume)
                return
              }

              if (
                shouldCrossfadeManagedMinigameCue(previousCue, desiredCue) ||
                (desiredCue.playbackCue?.fadeInMs ?? 0) > 0
              ) {
                SoundManager.setMusicVolume(musicState.musicVolume)
                void SoundManager.setDesiredMusicCue(desiredCue, cueReason(desiredCue))
                return
              }

              SoundManager.setMusicVolume(0)
          ''',
          )
          replace_once(
              'src/services/sound/AudioStateSync.tsx',
              '''        void SoundManager.fadeOutMusic(previousCue.transition!.fadeOutMs).then(() => {
          ''',
              '''        const configuredFadeOut = previousCue.playbackCue?.fadeOutMs ?? 0
                const fadeOutMs =
                  configuredFadeOut > 0 ? configuredFadeOut : previousCue.transition!.fadeOutMs
                void SoundManager.fadeOutMusic(fadeOutMs).then(() => {
          ''',
          )

          # Install the semantic listener before child minigame effects can emit.
          replace_once(
              'src/components/MinigameHost/MinigameHost.tsx',
              '''  useEffect(() => {
            if (phase !== 'playing') return
            const handleVariant = (event: Event) => {
              const detail = (event as CustomEvent<MinigameMusicVariantDetail>).detail
              if (!detail || (detail.gameKey && detail.gameKey !== game.key)) return
              onMusicVariantChange?.(detail.variant)
            }
            window.addEventListener(MINIGAME_MUSIC_VARIANT_EVENT, handleVariant)
            return () => window.removeEventListener(MINIGAME_MUSIC_VARIANT_EVENT, handleVariant)
          }, [game.key, onMusicVariantChange, phase])
          ''',
              '''  useEffect(() => {
            const handleVariant = (event: Event) => {
              const detail = (event as CustomEvent<MinigameMusicVariantDetail>).detail
              if (!detail || (detail.gameKey && detail.gameKey !== game.key)) return
              onMusicVariantChange?.(detail.variant)
            }
            window.addEventListener(MINIGAME_MUSIC_VARIANT_EVENT, handleVariant)
            return () => window.removeEventListener(MINIGAME_MUSIC_VARIANT_EVENT, handleVariant)
          }, [game.key, onMusicVariantChange])
          ''',
          )

          # Avoid broadcasting identical Risk Wheel variants on every state object update.
          replace_once(
              'src/components/RiskWheelComp/RiskWheelComp.tsx',
              '''  useEffect(() => {
            if (standalone || !rw || rw.phase === 'idle') return
            const finalRound =
              rw.round >= getRoundCap(rw.initialPlayerCount) || rw.activePlayerIds.length <= 2
            publishMinigameMusicVariant(
              rw.phase === 'complete' ? 'victory_lap' : finalRound ? 'final_round' : 'normal',
              'riskWheel'
            )
          }, [rw, standalone])
          ''',
              '''  const riskWheelPhase = rw?.phase
          const riskWheelRound = rw?.round
          const riskWheelInitialCount = rw?.initialPlayerCount
          const riskWheelActiveCount = rw?.activePlayerIds.length
          useEffect(() => {
            if (
              standalone ||
              !riskWheelPhase ||
              riskWheelPhase === 'idle' ||
              riskWheelRound == null ||
              riskWheelInitialCount == null ||
              riskWheelActiveCount == null
            ) {
              return
            }
            const finalRound =
              riskWheelRound >= getRoundCap(riskWheelInitialCount) || riskWheelActiveCount <= 2
            publishMinigameMusicVariant(
              riskWheelPhase === 'complete' ? 'victory_lap' : finalRound ? 'final_round' : 'normal',
              'riskWheel'
            )
          }, [
            riskWheelActiveCount,
            riskWheelInitialCount,
            riskWheelPhase,
            riskWheelRound,
            standalone,
          ])
          ''',
          )

          # Focused regressions.
          write_target = Path('tests/unit/sound/MusicCueEditor.test.tsx')
          write_target.write_text('''import { fireEvent, render, screen } from '@testing-library/react'\nimport { describe, expect, it, vi } from 'vitest'\nimport MusicCueEditor from '../../../src/screens/SettingsAdmin/MusicCueEditor'\nimport { createMusicConfig } from '../../../src/services/sound/musicConfig'\n\ndescribe('MusicCueEditor draft lifecycle', () => {\n  it('keeps new and duplicated unsaved cues editable', () => {\n    render(\n      <MusicCueEditor\n        localOverrides={{}}\n        effectiveConfig={createMusicConfig()}\n        effectiveAssetMap={new Map()}\n        onCommit={vi.fn()}\n        onMessage={vi.fn()}\n      />\n    )\n\n    fireEvent.click(screen.getByRole('button', { name: 'New cue' }))\n    expect(screen.getByRole('heading', { name: 'Competition Cue' })).toBeInTheDocument()\n    expect(screen.getByText('competition_cue')).toBeInTheDocument()\n\n    fireEvent.click(screen.getByRole('button', { name: 'Duplicate' }))\n    expect(screen.getByText('competition_cue_2')).toBeInTheDocument()\n  })\n})\n''')

          transition_test = Path('tests/unit/sound/AudioStateSyncCueTransitions.test.ts')
          transition_test.write_text('''import { describe, expect, it } from 'vitest'\nimport {\n  hasSameResolvedPlayback,\n  shouldCrossfadeManagedMinigameCue,\n} from '../../../src/services/sound/AudioStateSync'\nimport { musicTrack, type ResolvedMusicCue } from '../../../src/services/sound/musicConfig'\nimport { createDefaultMusicCue } from '../../../src/services/sound/musicCue'\n\nfunction managedCue(id: string, startAtSec: number): ResolvedMusicCue {\n  return {\n    track: 'competition',\n    selection: musicTrack('competition', id),\n    assignmentId: `minigame.classic.demo.playing.${id}`,\n    source: 'minigame',\n    inheritedAssignments: [],\n    transition: { fadeInMs: 500, postGameHoldMs: 1000, fadeOutMs: 700, managedLifecycle: true },\n    playbackCue: {\n      ...createDefaultMusicCue('competition'),\n      id,\n      displayName: id,\n      startAtSec,\n      crossfadeMs: 600,\n      restartPolicy: 'restart',\n    },\n  }\n}\n\ndescribe('managed minigame cue transitions', () => {\n  it('crossfades changed variants and ignores identical resolver updates', () => {\n    const normal = managedCue('normal', 0)\n    const finalRound = managedCue('final', 45)\n    expect(hasSameResolvedPlayback(normal, normal)).toBe(true)\n    expect(shouldCrossfadeManagedMinigameCue(normal, finalRound)).toBe(true)\n    expect(shouldCrossfadeManagedMinigameCue(normal, normal)).toBe(false)\n  })\n})\n''')

          cue_test = Path('tests/unit/sound/musicCue.test.ts')
          cue_text = cue_test.read_text()
          cue_text = cue_text.replace(
              "    expect(isAdvancedMusicCue(cue)).toBe(false)\n",
              "    expect(isAdvancedMusicCue(cue, true)).toBe(false)\n    expect(isAdvancedMusicCue({ ...cue, loop: false }, true)).toBe(true)\n    expect(isAdvancedMusicCue({ ...cue, loop: true }, false)).toBe(true)\n",
              1,
          )
          cue_test.write_text(cue_text)

          engine_test = Path('tests/unit/sound/MusicCueEngine.test.ts')
          engine_text = engine_test.read_text()
          engine_text = engine_text.replace(
              "    expect(element.currentTime).toBe(10)\n",
              "    expect(element.currentTime).toBe(10)\n    element.currentTime = 0\n    element.dispatchEvent(new Event('loadedmetadata'))\n    expect(element.currentTime).toBe(10)\n",
              1,
          )
          engine_text = engine_text.replace(
