name: Temporary Weather Formatter

on:
  push:
    branches:
      - feature/weather-simulation-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/weather-simulation-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format weather changes
        run: >-
          npx prettier --write
          public/config/weather-bank.json
          public/config/weather-config.json
          src/App.tsx
          src/broadcasting/__tests__/dailyMoodSystem.test.ts
          src/broadcasting/dailyMoodSystem.ts
          src/weather/README.md
          src/weather/WeatherController.tsx
          src/weather/WeatherEnhancements.css
          src/weather/__tests__/weatherRuntime.test.ts
          src/weather/weatherEngine.ts
          src/weather/weatherRuntime.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/config/weather-bank.json
          git add public/config/weather-config.json
          git add src/App.tsx
          git add src/broadcasting/__tests__/dailyMoodSystem.test.ts
          git add src/broadcasting/dailyMoodSystem.ts
          git add src/weather/README.md
          git add src/weather/WeatherController.tsx
          git add src/weather/WeatherEnhancements.css
          git add src/weather/__tests__/weatherRuntime.test.ts
          git add src/weather/weatherEngine.ts
          git add src/weather/weatherRuntime.ts
          git commit -m "Format weather simulation implementation"
          git push origin HEAD:feature/weather-simulation-v2
