name: Audio full-test diagnostic

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio-full-test-diagnostic-pr
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audio-auto-index-migration
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Prepare migration source
        shell: python
        run: |
          from pathlib import Path

          target = Path('scripts/migrate-audio-assets.mjs')
          text = target.read_text()
          text = text.replace('\\\\`', '\\`').replace('\\\\${', '\\${')

          marker = "  for (const [alias, target] of Object.entries(filenameAliases)) {"
          insertion = """  for (const migrated of pathMap.values()) {
            if (bindings.some((binding) => binding.path === migrated)) continue
            const extension = path.extname(migrated)
            const destinationStem = slugify(path.basename(migrated, extension))
            if (migrated.startsWith('music/')) {
              let trackId = destinationStem
              let suffix = 2
              while (
                bindings.some(
                  (binding) => binding.trackId === trackId || binding.key === `music:${trackId}`
                )
              ) {
                trackId = `${destinationStem}_${suffix}`
                suffix += 1
              }
              bindings.push({
                path: migrated,
                key: `music:${trackId}`,
                category: 'music',
                trackId,
                displayName: titleFromSlug(trackId),
                fallbackTrack: trackId === 'competition' ? 'none' : 'competition',
                tags: ['ambient'],
                preload: false,
                volume: 0.5,
                loop: true,
              })
            } else {
              const prefixed = /^(ui|tv|player|minigame)_(.+)$/.exec(destinationStem)
              const category = prefixed?.[1] ?? 'minigame'
              const rest = prefixed?.[2] ?? destinationStem
              let key = `${category}:${rest}`
              let suffix = 2
              while (bindings.some((binding) => binding.key === key)) {
                key = `${category}:${rest}_${suffix}`
                suffix += 1
              }
              bindings.push({
                path: migrated,
                key,
                category,
                preload: false,
                volume: 1,
                loop: false,
              })
            }
          }

          """
          if marker not in text:
            raise SystemExit('Could not locate filename-alias migration marker')
          text = text.replace(marker, insertion + marker, 1)
          text = text.replace(
            '  tags: readonly MusicTrackTag[]\\n}\\n\\nexport interface MusicTrackAssetOverride',
            '  tags: readonly MusicTrackTag[]\\n  dynamicSound?: SoundEntry\\n}\\n\\nexport interface MusicTrackAssetOverride',
          )
          target.write_text(text)

          generator = Path('scripts/generate-audio-manifest.mjs')
          generated_source = generator.read_text().replace(
            'const generated = `/* eslint-disable */\\n',
            'const generated = `',
          )
          generator.write_text(generated_source)
          Path('AUDIO_FULL_TEST_DIAGNOSTIC.txt').unlink(missing_ok=True)

      - name: Migrate and generate
        run: |
          node scripts/migrate-audio-assets.mjs
          node scripts/generate-audio-manifest.mjs

      - name: Run full suite and preserve failure
        id: tests
        shell: bash
        run: |
          set +e
          npm test > /tmp/audio-full-test.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            rm -f AUDIO_FULL_TEST_DIAGNOSTIC.txt
            echo 'failed=false' >> "$GITHUB_OUTPUT"
          else
            {
              echo 'AUDIO MIGRATION FULL TEST DIAGNOSTIC'
              echo
              sed -n '/Failed Tests/,$p' /tmp/audio-full-test.log
            } > AUDIO_FULL_TEST_DIAGNOSTIC.txt
            if [ ! -s AUDIO_FULL_TEST_DIAGNOSTIC.txt ]; then
              tail -n 500 /tmp/audio-full-test.log > AUDIO_FULL_TEST_DIAGNOSTIC.txt
            fi
            cat AUDIO_FULL_TEST_DIAGNOSTIC.txt
            echo 'failed=true' >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Commit diagnostic
        if: steps.tests.outputs.failed == 'true'
        shell: bash
        run: |
          cp AUDIO_FULL_TEST_DIAGNOSTIC.txt /tmp/AUDIO_FULL_TEST_DIAGNOSTIC.txt
          git reset --hard HEAD
          git clean -fd
          cp /tmp/AUDIO_FULL_TEST_DIAGNOSTIC.txt AUDIO_FULL_TEST_DIAGNOSTIC.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AUDIO_FULL_TEST_DIAGNOSTIC.txt
          git commit -m 'Capture full audio migration test diagnostic'
          git push origin HEAD:refs/heads/agent/audio-auto-index-migration

      - name: Remove temporary diagnostic workflow after success
        if: steps.tests.outputs.failed == 'false'
        shell: bash
        run: |
          git rm .github/workflows/audio-full-test-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove completed audio test diagnostic workflow'
          git push origin HEAD:refs/heads/agent/audio-auto-index-migration
