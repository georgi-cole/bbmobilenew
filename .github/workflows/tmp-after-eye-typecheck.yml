name: Temporary After the Eye typecheck diagnostics

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  capture-typecheck:
    if: github.head_ref == 'agent/redesign-after-the-eye-tabloid' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/redesign-after-the-eye-tabloid
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture typecheck output
        run: |
          set +e
          npm run typecheck > .tmp-after-eye-typecheck.log 2>&1
          status=$?
          echo "" >> .tmp-after-eye-typecheck.log
          echo "EXIT_CODE=$status" >> .tmp-after-eye-typecheck.log
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .tmp-after-eye-typecheck.log
          git commit -m "Capture After the Eye typecheck diagnostics"
          git push origin HEAD:agent/redesign-after-the-eye-tabloid
