name: Temporary PR 1494 Formatter

on:
  push:
    branches:
      - fix/gameplay-ui-consistency

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gameplay-ui-consistency
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format PR 1494 files
        run: >-
          npx prettier --write
          src/social/SocialEngine.ts
          src/store/eliminatedSeasonResolutionMiddleware.ts
          src/store/presentationConsistencyMiddleware.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/social/SocialEngine.ts
          git add src/store/eliminatedSeasonResolutionMiddleware.ts
          git add src/store/presentationConsistencyMiddleware.ts
          git commit -m "Format PR 1494 changed files"
          git push origin HEAD:fix/gameplay-ui-consistency
