name: Temporary fix Public Favorite mobile race

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/fix-public-favorite-finale' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-public-favorite-finale
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make the intro transition assertion race-safe
        shell: python
        run: |
          from pathlib import Path

          path = Path('e2e/playwright/finale.spec.ts')
          source = path.read_text()
          old = "    await favoriteVote.getByRole('button', { name: 'Skip intro' }).click()\n"
          new = """    const skipFavoriteIntro = favoriteVote.getByRole('button', { name: 'Skip intro' })
          if (await skipFavoriteIntro.isVisible()) {
            await skipFavoriteIntro.click()
          }
          """
          if old not in source:
              raise SystemExit('Public Favorite skip-intro assertion was not found')
          path.write_text(source.replace(old, new, 1))
      - run: npx prettier --write e2e/playwright/finale.spec.ts
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/tmp-fix-public-favorite-mobile-race.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Make Public Favorite mobile journey race-safe"
          git push origin HEAD:agent/fix-public-favorite-finale
