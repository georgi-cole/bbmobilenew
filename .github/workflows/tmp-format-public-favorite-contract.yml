name: Temporary format Public Favorite contract

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/fix-public-favorite-finale' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-public-favorite-finale
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/unit/publicFavoriteCinematicContract.test.ts
      - name: Commit exact formatter output and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/tmp-format-public-favorite-contract.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Apply exact Prettier output to Public Favorite contract"
          git push origin HEAD:agent/fix-public-favorite-finale
