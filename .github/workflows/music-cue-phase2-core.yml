          variant: 'final_round',
        },
      },
      config
    )

    expect(resolved.assignmentId).toContain('minigame-variant.classic.riskWheel.playing.final_round')
    expect(resolved.playbackCue?.id).toBe(finalCue.id)
    expect(resolved.playbackCue?.startAtSec).toBe(42)
  })
})
''')

          write('tests/unit/sound/MusicCueEngine.test.ts', r'''import { afterEach, beforeEach, describe, expect, it, vi } from 'vitest'
import { MusicCueEngine } from '../../../src/services/sound/MusicCueEngine'
import { createDefaultMusicCue } from '../../../src/services/sound/musicCue'

beforeEach(() => {
  vi.spyOn(HTMLMediaElement.prototype, 'play').mockResolvedValue(undefined)
  vi.spyOn(HTMLMediaElement.prototype, 'pause').mockImplementation(() => {})
})

afterEach(() => vi.restoreAllMocks())

describe('MusicCueEngine', () => {
  it('starts at the configured segment and loops inside its cue boundary', async () => {
    const engine = new MusicCueEngine()
    const cue = {
      ...createDefaultMusicCue('competition'),
      id: 'segment',
      startAtSec: 10,
      endAtSec: 20,
      loop: true,
      loopStartSec: 12,
      loopEndSec: 18,
    }

    await engine.play(
      {
        key: 'music:test',
        track: 'competition',
        src: '/test.mp3',
        volume: 0.5,
        loop: true,
      },
      cue
    )

    const element = engine.currentElement!
    expect(element.currentTime).toBe(10)
    element.currentTime = 18
    element.dispatchEvent(new Event('timeupdate'))
    expect(element.currentTime).toBe(12)
  })

  it('uses a second deck for a configured crossfade', async () => {
    vi.useFakeTimers()
    const engine = new MusicCueEngine()
    const asset = {
      key: 'music:test',
      track: 'competition' as const,
      src: '/test.mp3',
      volume: 1,
      loop: true,
    }
    await engine.play(asset, { ...createDefaultMusicCue('competition'), id: 'a' })
    const first = engine.currentElement
    const pending = engine.play(asset, {
      ...createDefaultMusicCue('competition'),
      id: 'b',
      startAtSec: 30,
      crossfadeMs: 200,
    })
    await vi.runAllTimersAsync()
    await pending
    expect(engine.currentElement).not.toBe(first)
    vi.useRealTimers()
  })
})
''')

          write('docs/MUSIC_CUE_PHASE2.md', r'''# Music Cue Phase 2

The runtime now distinguishes an audio **asset**, a reusable **cue**, and a gameplay **assignment**.

A cue can select a segment of a track, define an internal loop, apply cue-relative volume, fade in/out, crossfade to another cue, choose restart/resume/continue behavior, and request a safe effect preset. Unsupported WebAudio effects degrade to clean playback.

Minigames publish semantic variants (`normal`, `intense`, `final_round`, `sudden_death`, `overtime`, `victory_lap`) through `MinigameHost`; Redux remains the source of truth. Risk Wheel publishes `final_round` automatically when it reaches its final field/round and `victory_lap` on completion.

Existing whole-track assignments remain backward compatible and continue through the original single-element path. The two-deck engine activates only for advanced cues.
''')

