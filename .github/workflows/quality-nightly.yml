name: Nightly Product Quality

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

jobs:
  extended-regression:
    name: Extended unit, integration, coverage, and minigame regression
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:guard
      - name: Run complete product regression suite
        run: npm test -- --reporter=dot
      - name: Run the full deterministic minigame contract matrix
        run: npm run test:minigames
      - name: Produce and enforce coverage evidence
        run: npm run test:coverage
      - run: npm run coverage:check

  deterministic-stress:
    name: Fifty-seed minigame matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      MINIGAME_SEED_COUNT: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:guard
      - run: npx vitest run tests/minigames.seedStress.test.tsx --maxWorkers=2 --reporter=verbose

  browser-matrix:
    name: Browser matrix (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-chromium
            browser: chromium
          - project: mobile-chromium
            browser: chromium
          - project: mobile-webkit
            browser: webkit
          - project: ios-modern-webkit
            browser: webkit
          - project: ios-large-webkit
            browser: webkit
          - project: narrow-chromium
            browser: chromium
          - project: compact-mobile-chromium
            browser: chromium
          - project: android-large-chromium
            browser: chromium
          - project: wide-desktop-chromium
            browser: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run complete browser suite without retries
        run: npx playwright test --project=${{ matrix.project }}
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30

  responsive-minigames:
    name: Responsive minigames (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: narrow-chromium
            browser: chromium
          - project: mobile-chromium
            browser: chromium
          - project: android-large-chromium
            browser: chromium
          - project: mobile-webkit
            browser: webkit
          - project: ios-large-webkit
            browser: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Sweep every active minigame in both system-bar modes
        run: >-
          node scripts/run-responsive-playwright.mjs minigames
          --project=${{ matrix.project }} --workers=2
      - name: Upload responsive minigame evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-responsive-minigames-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30

  active-minigames:
    name: Every active minigame (desktop Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run registry-driven minigame browser coverage
        run: npx playwright test --grep @minigame --project=desktop-chromium
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-active-minigames-desktop-chromium
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
