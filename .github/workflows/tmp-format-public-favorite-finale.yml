name: Temporary format Public Favorite finale fix

on:
  push:
    branches:
      - agent/fix-public-favorite-finale

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-public-favorite-finale
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Public Favorite files
        run: >-
          npx prettier --write
          src/components/PublicFavoriteOverlay/PublicFavoriteOverlay.tsx
          src/components/PublicFavoriteOverlay/PublicFavoriteCinematic.css
          tests/unit/publicFavoriteOverlay.test.tsx
      - name: Commit formatted files and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/tmp-format-public-favorite-finale.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format Public Favorite finale fix"
          git push origin HEAD:agent/fix-public-favorite-finale
