name: Temporary Depression Shock Formatter

on:
  push:
    branches:
      - feature/depression-shock

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/depression-shock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Depression Shock changes
        run: >-
          npx prettier --write
          src/components/DepressionShockController/DepressionShockController.css
          src/components/DepressionShockController/DepressionShockController.tsx
          src/components/ResolvedAvatarImage/ResolvedAvatarImage.tsx
          src/features/twists/__tests__/depressionShock.test.ts
          src/features/twists/depressionShock.ts
          src/features/twists/depressionShockMiddleware.ts
          src/social/reality/humanFlow.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/DepressionShockController/DepressionShockController.css
          git add src/components/DepressionShockController/DepressionShockController.tsx
          git add src/components/ResolvedAvatarImage/ResolvedAvatarImage.tsx
          git add src/features/twists/__tests__/depressionShock.test.ts
          git add src/features/twists/depressionShock.ts
          git add src/features/twists/depressionShockMiddleware.ts
          git add src/social/reality/humanFlow.ts
          git commit -m "Format Depression Shock implementation"
          git push origin HEAD:feature/depression-shock
