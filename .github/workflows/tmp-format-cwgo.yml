name: Temporary CWGO Formatter

on:
  push:
    branches:
      - fix/dont-go-over-pacing-scale-final

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dont-go-over-pacing-scale-final
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format CWGO changed files
        run: >-
          npx prettier --write
          src/features/cwgo/cwgoHelpers.ts
          tests/cwgo.improvements.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/cwgo/cwgoHelpers.ts
          git add tests/cwgo.improvements.test.ts
          git commit -m "Format CWGO improvements"
          git push origin HEAD:fix/dont-go-over-pacing-scale-final
