name: Temporary Social liveliness codemod

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/social-liveliness-causal-story' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/social-liveliness-causal-story
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply focused follow-up
        run: node scripts/tmp-social-liveliness-followup.mjs
      - name: Format complete PR diff
        shell: bash
        run: |
          git fetch origin main --depth=1
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' '*.css' '*.json')
          if (( ${#files[@]} > 0 )); then
            npx prettier --write "${files[@]}"
          fi
      - name: Run focused Social regression tests
        run: >-
          npx vitest run
          src/components/IncomingInteractionsInbox/__tests__/IncomingInteractionsInbox.test.tsx
          src/components/HousePulse/__tests__/HousePulse.test.tsx
          src/components/FloatingActionBar/__tests__/FloatingActionBar.test.tsx
          src/social/__tests__/socialLivelinessRestoration.test.ts
          src/social/__tests__/socialModuleAvailability.test.ts
          src/social/__tests__/socialPremiumHardening.test.ts
          tests/social/socialCommitments.unit.test.ts
          tests/social/incomingInteractionScheduler.unit.test.ts
          tests/unit/publicOpinion/publicOpinionMiddleware.test.ts
      - name: Capture TypeScript diagnostics
        shell: bash
        run: |
          mkdir -p docs
          set +e
          npm run typecheck > docs/.social-liveliness-typecheck.txt 2>&1
          status=$?
          set -e
          if (( status == 0 )); then
            rm -f docs/.social-liveliness-typecheck.txt
          else
            printf '\nTYPECHECK_EXIT_CODE=%s\n' "$status" >> docs/.social-liveliness-typecheck.txt
          fi
      - name: Commit correction and diagnostics
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src server tests
          if [[ -f docs/.social-liveliness-typecheck.txt ]]; then
            git add docs/.social-liveliness-typecheck.txt
          fi
          git commit -m "Refine Social liveliness restoration"
          git push origin HEAD:fix/social-liveliness-causal-story
