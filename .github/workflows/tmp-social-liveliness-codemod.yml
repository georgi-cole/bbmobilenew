name: Temporary Social liveliness cleanup

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/social-liveliness-causal-story' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/social-liveliness-causal-story
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply residual corrections
        run: node scripts/tmp-social-liveliness-followup.mjs
      - name: Remove temporary diagnostic artifacts
        run: rm -f docs/.social-liveliness-tests.txt docs/.social-liveliness-typecheck.txt
      - name: Format every Prettier-supported file changed by the PR
        shell: bash
        run: |
          git fetch origin main --depth=1
          mapfile -t files < <(
            git diff --name-only origin/main...HEAD |
              grep -E '\.(cjs|mjs|js|jsx|ts|tsx|json|jsonc|css|scss|less|md|mdx|html|yml|yaml|graphql|gql)$' || true
          )
          if (( ${#files[@]} > 0 )); then
            npx prettier --write "${files[@]}"
          fi
      - name: Verify the required static-quality gate
        shell: bash
        run: |
          npm run format:check
          npm run test:guard
          npm run lint:ci
          npm run typecheck
          npm audit --omit=dev --audit-level=high
      - name: Commit clean corrections
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Pass Social restoration quality checks"
          git push origin HEAD:fix/social-liveliness-causal-story
