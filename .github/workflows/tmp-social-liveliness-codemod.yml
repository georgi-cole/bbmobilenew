name: Temporary Social liveliness codemod

on:
  push:
    branches: [fix/social-liveliness-causal-story]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/social-liveliness-causal-story
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded codemod
        run: node scripts/tmp-social-liveliness-codemod.mjs
      - name: Format changed files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only -- '*.ts' '*.tsx' '*.css')
          if (( ${#files[@]} > 0 )); then
            npx prettier --write "${files[@]}"
          fi
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Commit generated correction
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git commit -m "Restore Social liveliness and causal UX"
          git push origin HEAD:fix/social-liveliness-causal-story
