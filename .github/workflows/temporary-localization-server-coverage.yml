name: Temporary localization server coverage

on:
  push:
    branches:
      - agent/add-localization-settings
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  extend:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' || github.head_ref == 'agent/add-localization-settings')
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-localization-settings
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extend localization checks to server output
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/check-localization.mjs')
          source = path.read_text()

          additions = [
              'choice',
              'choices',
              'dialogue',
              'dialogues',
              'explanation',
              'explanations',
              'fallback',
              'fallbacks',
              'feedback',
              'objective',
              'objectives',
              'option',
              'options',
              'refusal',
              'refusals',
              'reply',
              'replies',
              'response',
              'responses',
              'speech',
          ]

          if "  'fallback'," not in source:
              marker = "  'failure',\n"
              assert marker in source
              block = ''.join(f"  '{token}',\n" for token in additions)
              source = source.replace(marker, marker + block, 1)

          source = source.replace("    'server/',\n", '', 1)

          if "const FALLBACKS = ['The game is paused']" not in source:
              marker = "  assert.deepEqual(placeholders('Hello {name}, week {week}'), ['name', 'week'])"
              assert marker in source
              tests = """  assert.equal(
            scan(\"const FALLBACKS = ['The game is paused']\", 'server/index.js').violations.length,
            1
          )
          assert.equal(
            scan(\"const API_RESPONSE = { status: 'ok', id: 'turn-1' }\", 'server/index.js')
              .violations.length,
            0
          )
          """
              source = source.replace(marker, tests + marker, 1)

          path.write_text(source)
          PY

      - name: Run localization guard self-tests
        run: node scripts/check-localization.mjs --self-test

      - name: Format localization guard
        run: npx prettier --write scripts/check-localization.mjs

      - name: Commit server coverage
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No server coverage changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-localization.mjs
          git commit -m 'Extend localization guard to server output'
          git push origin HEAD:agent/add-localization-settings
