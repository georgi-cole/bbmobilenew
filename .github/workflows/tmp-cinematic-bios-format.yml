name: Temporary cinematic bios formatter

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format-cinematic-bios:
    if: github.head_ref == 'agent/cinematic-bios-responsive-hardening' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cinematic-bios-responsive-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format branch changes
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' '*.css' '*.json' '*.md' '*.yml' '*.mjs')
          if (( ${#files[@]} > 0 )); then
            npx prettier --write "${files[@]}"
          fi
      - name: Remove temporary workflow and commit formatting
        shell: bash
        run: |
          rm -f .github/workflows/tmp-cinematic-bios-format.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Format biography cinematic changes"
          git push origin HEAD:agent/cinematic-bios-responsive-hardening
