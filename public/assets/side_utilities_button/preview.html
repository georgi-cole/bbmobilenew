<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>IntroHub Side Utilities V2</title>
<style>
body{
  margin:0;
  min-height:100vh;
  font-family:Inter,Arial,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 50% 18%, rgba(108,132,255,.14), transparent 22%),
    linear-gradient(180deg,#091125 0%,#0f1936 55%,#091120 100%);
}
.wrap{max-width:1200px;margin:0 auto;padding:28px 20px 60px}
h1{text-align:center;margin:0 0 8px;font-size:28px}
p{text-align:center;opacity:.78;margin:0 0 24px}
.card{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:18px;
  margin-bottom:18px;
  backdrop-filter:blur(8px);
}
.stackRow{
  display:grid;
  grid-template-columns: 120px 1fr 120px;
  gap:28px;
  align-items:start;
}
.col{
  display:flex;
  flex-direction:column;
  gap:14px;
  align-items:center;
}
.btn{
  position:relative;
  width:52px;
  height:52px;
}
.btn img.shell{
  width:100%;
  height:100%;
  display:block;
}
.btn img.icon{
  position:absolute;
  inset:18%;
  width:64%;
  height:64%;
}
.btn img.badge{
  position:absolute;
  right:-4px;
  bottom:-4px;
  width:20px;
  height:20px;
}
.centerMock{
  min-height:420px;
  border-radius:24px;
  border:1px solid rgba(255,255,255,.06);
  background:
    radial-gradient(circle at 50% 22%, rgba(130,146,255,.18), transparent 16%),
    linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01));
}
.row{
  display:flex;gap:16px;flex-wrap:wrap;justify-content:center;
}
.demo{
  width:92px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}
.demoShell{
  position:relative;
  width:58px;
  height:58px;
}
.demoShell img.shell{width:100%;height:100%}
.demoShell img.icon{position:absolute;inset:18%;width:64%;height:64%}
.label{font-size:12px;opacity:.78;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>IntroHub Side Utilities V2</h1>
  <p>Micro-beveled side controls that echo the main IntroHub buttons without stealing focus from them.</p>

  <div class="card">
    <div class="row">
      <div class="demo"><div class="demoShell"><img class="shell" src="side_utility_shell_normal.svg"><img class="icon" src="housemates_v2.svg"></div><div class="label">Housemates</div></div>
      <div class="demo"><div class="demoShell"><img class="shell" src="side_utility_shell_normal.svg"><img class="icon" src="music_v2.svg"></div><div class="label">Music</div></div>
      <div class="demo"><div class="demoShell"><img class="shell" src="side_utility_shell_normal.svg"><img class="icon" src="sound_v2.svg"></div><div class="label">Sound</div></div>
      <div class="demo"><div class="demoShell"><img class="shell" src="side_utility_shell_normal.svg"><img class="icon" src="settings_v2.svg"></div><div class="label">Settings</div></div>
      <div class="demo"><div class="demoShell"><img class="shell" src="side_utility_shell_normal.svg"><img class="icon" src="share_v2.svg"></div><div class="label">Share</div></div>
      <div class="demo"><div class="demoShell"><img class="shell" src="side_utility_shell_normal.svg"><img class="icon" src="feedback_v2.svg"></div><div class="label">Feedback</div></div>
      <div class="demo"><div class="demoShell"><img class="shell" src="side_utility_shell_normal.svg"><img class="icon" src="achievements_v2.svg"></div><div class="label">Achievements</div></div>
      <div class="demo"><div class="demoShell"><img class="shell" src="side_utility_shell_normal.svg"><img class="icon" src="news_v2.svg"><img class="badge" src="badge_alert_red.svg"></div><div class="label">News</div></div>
      <div class="demo"><div class="demoShell"><img class="shell" src="side_utility_shell_normal.svg"><img class="icon" src="social_v2.svg"></div><div class="label">Social</div></div>
      <div class="demo"><div class="demoShell"><img class="shell" src="side_utility_shell_normal.svg"><img class="icon" src="shop_v2.svg"><img class="badge" src="badge_alert_red.svg"></div><div class="label">Shop</div></div>
    </div>
  </div>

  <div class="card">
    <div class="stackRow">
      <div class="col">
        <div class="btn"><img class="shell" src="side_utility_shell_normal.svg"><img class="icon" src="housemates_v2.svg"></div>
        <div class="btn"><img class="shell" src="side_utility_shell_normal.svg"><img class="icon" src="music_v2.svg"></div>
        <div class="btn"><img class="shell" src="side_utility_shell_normal.svg"><img class="icon" src="sound_v2.svg"></div>
        <div style="height:220px"></div>
        <div class="btn"><img class="shell" src="side_utility_shell_normal.svg"><img class="icon" src="achievements_v2.svg"></div>
        <div class="btn"><img class="shell" src="side_utility_shell_normal.svg"><img class="icon" src="news_v2.svg"><img class="badge" src="badge_alert_red.svg"></div>
      </div>

      <div class="centerMock"></div>

      <div class="col">
        <div class="btn"><img class="shell" src="side_utility_shell_normal.svg"><img class="icon" src="settings_v2.svg"></div>
        <div class="btn"><img class="shell" src="side_utility_shell_normal.svg"><img class="icon" src="share_v2.svg"></div>
        <div class="btn"><img class="shell" src="side_utility_shell_normal.svg"><img class="icon" src="feedback_v2.svg"></div>
        <div style="height:220px"></div>
        <div class="btn"><img class="shell" src="side_utility_shell_normal.svg"><img class="icon" src="social_v2.svg"></div>
        <div class="btn"><img class="shell" src="side_utility_shell_normal.svg"><img class="icon" src="shop_v2.svg"><img class="badge" src="badge_alert_red.svg"></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
