<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SVG Button Preview</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 50% 15%, rgba(110,130,255,.18), transparent 28%),
      linear-gradient(180deg, #0b1020 0%, #131b31 60%, #111726 100%);
    font-family: Inter, Arial, sans-serif;
  }
  .wrap { display: flex; flex-direction: column; gap: 26px; align-items: center; padding: 40px; }
  .btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    letter-spacing: .01em;
    text-shadow: 0 2px 10px rgba(0,0,0,.35);
  }
  .btn img { display: block; width: 100%; height: 100%; }
  .btn span {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    pointer-events: none;
  }
  .play { width: 320px; height: 78px; font-size: 22px; }
  .medium { width: 250px; height: 66px; font-size: 18px; }
  .wide { width: 280px; height: 66px; font-size: 18px; }
  .small { width: 210px; height: 60px; font-size: 17px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="btn play"><img src="button_primary_large.svg" alt=""><span>▶ Play</span></div>
    <div class="btn medium"><img src="button_secondary_medium.svg" alt=""><span>📋 Rules</span></div>
    <div class="btn medium"><img src="button_secondary_medium.svg" alt=""><span>👤 Profile</span></div>
    <div class="btn wide"><img src="button_secondary_wide.svg" alt=""><span>🏆 Leaderboard</span></div>
    <div class="btn small"><img src="button_secondary_small.svg" alt=""><span>🎬 Credits</span></div>
  </div>
</body>
</html>
