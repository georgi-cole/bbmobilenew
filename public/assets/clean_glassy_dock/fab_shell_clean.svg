<svg xmlns="http://www.w3.org/2000/svg" width="980" height="220" viewBox="0 0 980 220" fill="none">
  <defs>
    <linearGradient id="shellBg" x1="0" y1="0" x2="980" y2="220">
      <stop offset="0%" stop-color="#0B1731" stop-opacity="0.3"/>
      <stop offset="55%" stop-color="#17234B" stop-opacity="0.23"/>
      <stop offset="100%" stop-color="#0C1937" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="topGloss" x1="490" y1="20" x2="490" y2="96">
