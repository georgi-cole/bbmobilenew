<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Find Your Twin — Playable Unity Prototype</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #020611;
        font-family: Inter, system-ui, sans-serif;
      }
      .shell {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 14px;
        background: radial-gradient(circle at 50% 0, #152854, transparent 48%), #020611;
      }
      .frame {
        position: relative;
        width: min(100%, 1100px);
        aspect-ratio: 16/9;
        overflow: hidden;
        border: 1px solid #3d6898;
        border-radius: 18px;
        box-shadow: 0 28px 100px #000;
        background: #07122a;
      }
      .frame:after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 100px 28px #02061166;
      }
      .topnote {
        position: absolute;
        z-index: 2;
        top: 86px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 16px;
        border: 1px solid #85dcf255;
        border-radius: 999px;
        background: #07122ad9;
        color: #d9f7ff;
        font-weight: 800;
        font-size: 12px;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      .topnote.visible {
        opacity: 1;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: auto;
      }
      .overlay {
        position: absolute;
        z-index: 5;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        background: radial-gradient(circle at 50% 40%, #16396dd0, #020611f5);
        padding: 20px;
      }
      .overlay[hidden] {
        display: none;
      }
      .eyebrow {
        color: #70eafa;
        font-weight: 900;
        font-size: 12px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }
      .overlay h1 {
        margin: 14px 0 10px;
        font-size: clamp(42px, 7vw, 80px);
        line-height: 0.9;
        letter-spacing: -0.06em;
        color: #f1fbff;
      }
      .overlay p {
        max-width: 560px;
        color: #b5c9dc;
        line-height: 1.6;
      }
      .primary {
        margin-top: 12px;
        padding: 15px 28px;
        border: 1px solid #8df5ff99;
        border-radius: 13px;
        background: linear-gradient(135deg, #1687a8, #5544ad);
        color: #fff;
        font-weight: 900;
        letter-spacing: 0.08em;
        cursor: pointer;
      }
      .controls {
        width: min(100%, 1100px);
        display: flex;
        justify-content: space-between;
        padding: 0 4px;
      }
      .group {
        display: flex;
        gap: 10px;
      }
      .control {
        width: 70px;
        height: 60px;
        border: 1px solid #75d8f066;
        border-radius: 16px;
        background: #0b1c38dc;
        color: #e5fbff;
        font-weight: 900;
        font-size: 13px;
        box-shadow: 0 12px 25px #0007;
        touch-action: none;
      }
      .control:active {
        transform: translateY(2px);
        background: #204870;
      }
      .result-score {
        font-size: 52px;
        font-weight: 950;
        color: #8cffdd;
      }
      @media (max-width: 620px) {
        .shell {
          padding: 0 0 10px;
          justify-content: flex-start;
          gap: 10px;
        }
        .frame {
          width: 100vw;
          border: 0;
          border-radius: 0;
        }
        .topnote {
          top: 76px;
          font-size: 10px;
        }
        .controls {
          padding: 0 10px;
        }
        .control {
          width: 60px;
          height: 52px;
          font-size: 11px;
        }
      }
    </style>
    <style>
      @media (max-width: 620px), (max-height: 760px) {
        .shell {
          min-height: 100%;
          place-content: center;
          padding: 8px;
        }
        .frame {
          width: 100%;
          max-height: calc(100dvh - 76px);
        }
        .overlay {
          padding: 12px;
        }
        .overlay h1,
        .cover h1 {
          font-size: clamp(32px, 9vw, 58px);
          margin: 7px 0;
        }
        .overlay p,
        .cover p {
          margin: 6px auto;
          font-size: 12px;
          line-height: 1.3;
        }
        .result-score {
          font-size: clamp(36px, 10vw, 54px);
        }
        .primary,
        .start {
          margin-top: 6px;
          padding: 10px 18px;
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="frame" aria-label="Find Your Twin playable game">
        <canvas
          id="game"
          width="960"
          height="540"
          tabindex="0"
          aria-label="Find Your Twin game canvas"
        ></canvas>
        <div class="topnote" id="note">Find the three hidden pipes in order</div>
        <section class="overlay" id="intro">
          <div>
            <div class="eyebrow">Playable Unity direction prototype · Part 1</div>
            <h1>FIND YOUR<br />TWIN</h1>
            <p>
              Trace the park route: platform, collect Eyeoleans, stomp wardens, break crests,
              activate checkpoints, choose pipes, survive side rooms, and reunite with Lenny.
            </p>
            <button class="primary" id="start">START THE SEARCH</button>
          </div>
        </section>
        <section class="overlay" id="result" hidden>
          <div>
            <div class="eyebrow" id="resultEyebrow">Together again</div>
            <h1 id="resultTitle">TWIN FOUND</h1>
            <div class="result-score" id="finalScore">0 PTS</div>
            <p id="finalDetail"></p>
            <button class="primary" onclick="location.reload()">PLAY AGAIN</button>
          </div>
        </section>
      </section>
      <div class="controls" aria-label="Touch controls">
        <div class="group">
          <button class="control" data-key="left">◀</button
          ><button class="control" data-key="right">▶</button>
        </div>
        <div class="group">
          <button class="control" data-key="enter">ENTER</button
          ><button class="control" data-key="jump">JUMP</button>
        </div>
      </div>
    </main>
    <script>
      const C = document.querySelector('#game'),
        X = C.getContext('2d'),
        note = document.querySelector('#note')
      const W = 4800,
        H = 400,
        HUD = 64,
        G = 368,
        PW = 28,
        PH = 40,
        DOORS = [490, 860, 1400, 1810, 2760, 3110],
        keys = { left: 0, right: 0, jump: 0, enter: 0 }
      // Upper lanes sit well above pipe rims. Pipe jumps therefore clear an obstacle instead of
      // turning into an unintended platform landing; the platforms that overlap a pipe are higher still.
      const platforms = [
        [0, G, W, 32],
        [200, 225, 160, 16],
        [430, 148, 180, 16],
        [730, 178, 150, 16],
        [950, 203, 140, 16],
        [1150, 197, 200, 16],
        [1380, 116, 180, 16],
        [1640, 164, 160, 16],
        [1870, 223, 180, 16],
        [2080, 187, 160, 16],
        [2370, 235, 200, 16],
        [2640, 154, 180, 16],
        [2900, 231, 200, 16],
        [3140, 150, 180, 16],
        [3380, 235, 180, 16],
        [3600, 195, 200, 16],
        [3840, 223, 180, 16],
        [4060, 205, 180, 16],
        [4300, 219, 180, 16],
        [4550, 203, 230, 16],
      ]
      const coinSeeds = [
        [230, 200],
        [262, 200],
        [460, 112],
        [492, 112],
        [524, 112],
        [780, 142],
        [812, 142],
        [1190, 161],
        [1222, 161],
        [1420, 80],
        [1452, 80],
        [1484, 80],
        [1680, 128],
        [2110, 151],
        [2142, 151],
        [2410, 200],
        [2442, 200],
        [2474, 200],
        [2680, 118],
        [2712, 118],
        [2940, 204],
        [2972, 204],
        [3172, 114],
        [3204, 114],
        [3640, 160],
        [3672, 160],
        [3704, 160],
        [4100, 170],
        [4132, 170],
        [4570, 173],
        [4602, 173],
        [4634, 173],
      ]
      // Mario-style bump lane: enough clearance to run below, close enough to strike from underneath.
      const brickSeeds = [
        [218, 85],
        [250, 85],
        [460, 50],
        [492, 50],
        [760, 70],
        [1170, 75],
        [1202, 75],
        [1410, 25],
        [1442, 25],
        [1660, 45],
        [2100, 65],
        [2132, 65],
        [2400, 100],
        [2432, 100],
        [2660, 40],
        [2692, 40],
        [2930, 95],
        [3162, 35],
        [3622, 70],
        [3654, 70],
        [4080, 80],
      ]
      function rng32(seed) {
        let s = seed >>> 0
        return () => {
          s = (s + 0x6d2b79f5) | 0
          let t = Math.imul(s ^ (s >>> 15), 1 | s)
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296
        }
      }
      const r = rng32((42 ^ 0xcafebabe) >>> 0),
        slots = [0, 1, 2, 3, 4, 5]
      for (let i = 5; i > 0; i--) {
        let j = Math.floor(r() * (i + 1))
        ;[slots[i], slots[j]] = [slots[j], slots[i]]
      }
      const route = slots.slice(0, 3),
        wrong = slots.slice(3),
        types = ['setback', 'bonus', 'ambush', 'dead']
      for (let i = 3; i > 0; i--) {
        let j = Math.floor(r() * (i + 1))
        ;[types[i], types[j]] = [types[j], types[i]]
      }
      let doors = DOORS.map((x, slot) => ({
        x,
        slot,
        routeIndex: route.indexOf(slot),
        kind: route.includes(slot) ? 'correct' : types[wrong.indexOf(slot)],
        used: false,
      }))
      let player,
        coins,
        bricks,
        enemies,
        checkpoints,
        score,
        routeProgress,
        wrongPipes,
        gateOpen,
        camera,
        startAt,
        active,
        room,
        returnPoint,
        flash,
        particles,
        last,
        enterLatch,
        noteUntil = 0
      let finaleAt = 0,
        reunionStart = 0,
        reunionScore = 0,
        thorns = []
      const bg = new Image()
      bg.src = './assets/moonlit-park-v2.png'
      const hero = new Image()
      let heroClean = null
      hero.src = './assets/benny-approved-alpha.png'
      hero.onload = () => {
        heroClean = hero
      }
      const galleryAvatars = ['Lia', 'Ali', 'Aria', 'Dex'].map((name) => {
        const img = new Image()
        img.src = './assets/avatars/' + name + '_avatar.webp'
        return img
      })
      function fresh() {
        player = {
          x: 80,
          y: G - PH,
          vx: 0,
          vy: 0,
          ground: false,
          hearts: 3,
          inv: 0,
          spawnX: 80,
          spawnY: G - PH,
        }
        coins = coinSeeds.map(([x, y], i) => ({ x, y, id: 'coin' + i, taken: false }))
        bricks = brickSeeds.map(([x, y], i) => ({ x, y, id: 'brick' + i, broken: false }))
        enemies = [
          [150, 330, 1],
          [560, 750, -1],
          [1180, 1360, 1],
          [1440, 1600, -1],
          [1720, 1880, 1],
          [2100, 2280, -1],
          [2440, 2620, 1],
          [2800, 2980, -1],
          [3220, 3400, 1],
          [3650, 3830, -1],
          [4130, 4310, 1],
          [4570, 4720, -1],
        ].map(([a, b, d], i) => ({
          x: (a + b) / 2,
          y: G - 28,
          left: a,
          right: b,
          v: d * 1.7,
          alive: true,
          id: 'enemy' + i,
        }))
        checkpoints = [
          { x: 1065, active: false, id: 'cp0' },
          { x: 2295, active: false, id: 'cp1' },
          { x: 3510, active: false, id: 'cp2' },
        ]
        doors.forEach((d) => (d.used = false))
        score = 0
        routeProgress = 0
        wrongPipes = 0
        gateOpen = false
        camera = 0
        room = null
        flash = 0
        particles = []
        enterLatch = false
        note.classList.remove('visible')
      }
      function say(t, duration = 2800) {
        note.textContent = t
        noteUntil = performance.now() + duration
        note.classList.add('visible')
      }
      function rect(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y
      }
      function burst(x, y, color = '#76efff') {
        flash = 0.06
        for (let i = 0; i < 7; i++)
          particles.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 110,
            vy: (Math.random() - 0.5) * 115,
            life: 0.32,
            color,
          })
      }
      function fresh() {
        player = {
          x: 80,
          y: G - PH,
          vx: 0,
          vy: 0,
          ground: false,
          hearts: 3,
          inv: 0,
          spawnX: 80,
          spawnY: G - PH,
        }
        coins = coinSeeds.map(([x, y], i) => ({ x, y, id: 'coin' + i, taken: false }))
        bricks = brickSeeds.map(([x, y], i) => ({ x, y, id: 'brick' + i, broken: false }))
        enemies = [
          [150, 330, 1],
          [560, 750, -1],
          [1180, 1360, 1],
          [1440, 1600, -1],
          [1720, 1880, 1],
          [2100, 2280, -1],
          [2440, 2620, 1],
          [2800, 2980, -1],
          [3220, 3400, 1],
          [3650, 3830, -1],
          [4130, 4310, 1],
          [4380, 4518, -1],
        ].map(([a, b, d], i) => ({
          x: (a + b) / 2,
          y: G - 28,
          left: a,
          right: b,
          v: i === 11 ? d * 2.35 : d * 1.7,
          alive: true,
          id: 'enemy' + i,
          elite: i === 11,
          nextThorn: 0,
        }))
        checkpoints = [
          { x: 1065, active: false, id: 'cp0' },
          { x: 2295, active: false, id: 'cp1' },
          { x: 3510, active: false, id: 'cp2' },
        ]
        doors.forEach((d) => (d.used = false))
        score = 0
        routeProgress = 0
        wrongPipes = 0
        gateOpen = false
        camera = 0
        room = null
        flash = 0
        particles = []
        thorns = []
        enterLatch = false
        note.classList.remove('visible')
      }
      function start() {
        finaleAt = 0
        reunionStart = 0
        reunionScore = 0
        fresh()
        active = true
        startAt = performance.now()
        say('Find the three hidden pipes in order', 4300)
        document.querySelector('#intro').hidden = true
        C.focus()
        requestAnimationFrame(loop)
      }
      document.querySelector('#start').onclick = start
      function currentWorld() {
        return room ? room.world : W
      }
      function elapsed() {
        return Math.floor((performance.now() - startAt) / 1000)
      }
      function damage(reason) {
        if (performance.now() < player.inv) return
        player.hearts--
        score = Math.max(0, score - 50)
        burst(player.x + 14, player.y + 20, '#ff416d')
        if (player.hearts <= 0) {
          score = Math.max(0, score - 250)
          finish('OUT OF LIVES', 'The park shadows won this run')
          return
        }
        player.inv = performance.now() + 1200
        player.x = room ? 40 : player.spawnX
        player.y = room ? G - PH : player.spawnY
        player.vx = player.vy = 0
        say(reason + ' — ' + player.hearts + ' hearts remain')
      }
      function sideRoom(kind) {
        returnPoint = { x: player.x, y: player.y }
        room = {
          kind,
          world: 760,
          exit: 680,
          portraits: true,
          coins:
            kind === 'bonus'
              ? Array.from({ length: 9 }, (_, i) => ({
                  x: 110 + i * 55,
                  y: 260 - (i % 3) * 34,
                  taken: false,
                  id: 'roomcoin' + i,
                }))
              : [],
          enemies:
            kind === 'ambush'
              ? Array.from({ length: 4 }, (_, i) => ({
                  x: 190 + i * 105,
                  y: G - 28,
                  left: 120,
                  right: 620,
                  v: i % 2 ? 1.5 : -1.5,
                  alive: true,
                  id: 'roomenemy' + i,
                }))
              : [],
        }
        player.x = 40
        player.y = G - PH
        player.vx = player.vy = 0
        camera = 0
        say(
          kind === 'bonus'
            ? 'Portrait room — collect what you can, then enter the pipe'
            : 'Ambush room — stomp wardens, then enter the pipe'
        )
      }
      function leaveRoom() {
        player.x = returnPoint.x
        player.y = returnPoint.y
        player.vx = player.vy = 0
        room = null
        say('Back in the gallery')
      }
      function tryEnter() {
        if (enterLatch) return
        enterLatch = true
        setTimeout(() => (enterLatch = false), 250)
        if (room) {
          if (Math.abs(player.x + PW / 2 - room.exit) < 46) leaveRoom()
          else say('Stand on the exit pipe and press Down / ENTER')
          return
        }
        let door = doors.find((d) => Math.abs(player.x + PW / 2 - d.x) < 42)
        if (!door) {
          say('Stand on a pipe and press Down / ENTER')
          return
        }
        if (door.used) {
          say('This pipe has already been traced')
          return
        }
        if (door.kind === 'correct') {
          if (door.routeIndex === routeProgress) {
            door.used = true
            routeProgress++
            burst(door.x, G - 55)
            say(
              routeProgress === 3
                ? 'Route complete — the final path opens'
                : 'Correct pipe · ' + routeProgress + ' of 3'
            )
            if (routeProgress === 3) gateOpen = true
          } else {
            wrongPipes++
            score = Math.max(0, score - 100)
            player.x = player.spawnX
            player.y = player.spawnY
            burst(door.x, G - 55, '#ff416d')
            say('Wrong pipe — returned to checkpoint')
          }
        } else if (door.kind === 'setback') {
          door.used = true
          wrongPipes++
          score = Math.max(0, score - 100)
          player.x = player.spawnX
          player.y = player.spawnY
          say('Setback pipe — returned to checkpoint')
        } else if (door.kind === 'bonus' || door.kind === 'ambush') {
          door.used = true
          sideRoom(door.kind)
        } else {
          door.used = true
          say('This pipe is a dead end')
        }
      }
      function step(dt) {
        if (!active) return
        let sec = elapsed()
        if (sec >= 150) {
          finish('TIME UP', 'Time expired before you reached Lenny')
          return
        }
        let left = keys.left,
          right = keys.right
        player.vx = left ? -4.5 : right ? 4.5 : 0
        if (keys.jump && player.ground) {
          player.vy = -13.5
          player.ground = false
          keys.jump = 0
          burst(player.x + 14, player.y + 40, '#79efff')
        }
        if (keys.enter) {
          keys.enter = 0
          tryEnter()
        }
        let sc = dt / 16.667,
          prevX = player.x,
          prevY = player.y
        player.vy = Math.min(player.vy + 0.55 * sc, 16)
        player.x = Math.max(0, Math.min(currentWorld() - PW, player.x + player.vx * sc))
        player.y += player.vy * sc
        player.ground = false
        let surfaces = room
          ? [
              [0, G, 760, 32],
              [120, 270, 170, 16],
              [370, 235, 170, 16],
            ]
          : platforms.concat(DOORS.map((x) => [x - 31, G - 65, 62, 17]))
        for (const [x, y, w, h] of surfaces) {
          if (
            player.x + PW > x &&
            player.x < x + w &&
            prevY + PH <= y + 4 &&
            player.y + PH >= y &&
            player.vy >= 0
          ) {
            player.y = y - PH
            player.vy = 0
            player.ground = true
          }
        }
        for (const b of room ? [] : bricks) {
          if (b.broken) continue
          let br = { x: b.x, y: b.y, w: 32, h: 32 },
            pr = { x: player.x, y: player.y, w: PW, h: PH }
          if (rect(pr, br)) {
            if (prevY + PH <= b.y + 5 && player.vy >= 0) {
              player.y = b.y - PH
              player.vy = 0
              player.ground = true
            } else if (prevY >= b.y + 26 && player.vy < 0) {
              b.broken = true
              score += 5
              player.vy = 4
              burst(b.x + 16, b.y + 16)
            }
          }
        }
        let enemyList = room ? room.enemies : enemies
        for (const e of enemyList) {
          if (!e.alive) continue
          e.x += e.v * sc
          if (e.x <= e.left || e.x >= e.right) e.v = -e.v
          let pr = { x: player.x, y: player.y, w: PW, h: PH },
            er = { x: e.x, y: e.y, w: 28, h: 28 }
          if (rect(pr, er)) {
            if (player.vy > 0 && player.y + PH < e.y + 17) {
              e.alive = false
              score += 20
              player.vy = -8
              burst(e.x + 14, e.y + 14, '#ff6b87')
            } else damage('A shadow warden caught you')
          }
        }
        let coinList = room ? room.coins : coins
        for (const c of coinList) {
          if (
            !c.taken &&
            rect(
              { x: player.x, y: player.y, w: PW, h: PH },
              { x: c.x - 8, y: c.y - 8, w: 16, h: 16 }
            )
          ) {
            c.taken = true
            score += 25
            burst(c.x, c.y, '#ffd466')
          }
        }
        if (!room) {
          for (const cp of checkpoints) {
            if (!cp.active && Math.abs(player.x - cp.x) < 20) {
              checkpoints.forEach((x) => (x.active = false))
              cp.active = true
              player.spawnX = cp.x + 10
              player.spawnY = G - PH
              score += 50
              burst(cp.x, G - 45)
              say('Checkpoint attuned')
            }
          }
          if (!gateOpen && player.x + PW > 3530 && player.x < 3548) {
            player.x = player.x < 3530 ? 3530 - PW : 3548
          }
          if (gateOpen && player.x > 4650) {
            score += 1000
            finish('TWIN FOUND', 'Benny and Lenny are together again')
          }
        }
        camera = Math.max(0, Math.min(currentWorld() - 960, player.x - 310))
        particles.forEach((p) => {
          p.x += (p.vx * dt) / 1000

            X.fillStyle = cp.active ? '#ffcf61' : '#415269'
            X.beginPath()
            X.moveTo(cp.x + 5, G - 68)
            X.lineTo(cp.x + 30, G - 56)
            X.lineTo(cp.x + 5, G - 43)
            X.fill()
          }
          X.fillStyle = gateOpen ? '#50eea733' : '#6544a5'
          X.fillRect(3530, G - 220, 18, 220)
          if (!gateOpen) {
            X.fillStyle = '#d2bcff'
            X.font = '28px serif'
            X.fillText('🔒', 3527, G - 110)
          }
          X.fillStyle = 'rgba(39,215,191,.18)'
          X.beginPath()
          X.arc(4684, G - 50, 35, 0, 7)
          X.fill()
          drawTwin(4670, G - PH)
        }
        drawBenny(player.x, player.y)
        for (const p of particles) {
          X.globalAlpha = Math.max(0, p.life / 0.32)
          X.fillStyle = p.color
          X.fillRect(p.x, p.y, 4, 6)
        }
        X.globalAlpha = 1
        X.restore()
      }
      function twinsTouch() {
        return (
          gateOpen &&
          player.x + PW >= 4670 &&
          player.x <= 4698 &&
          player.y + PH >= G - PH &&
          player.y <= G
        )
      }
      function drawReunionCheer() {
        if (!finaleAt) return
        const t = performance.now() * 0.008,
          p = Math.min(1, (performance.now() - reunionStart) / 2200),
          x = 4684 - camera + p * 165
        X.fillStyle = '#ffe680'
        X.font = '900 16px system-ui'
        X.textAlign = 'center'
        X.fillText(p < 0.68 ? 'TOGETHER!' : 'HOMEWARD!', x, HUD + G - 105 + Math.sin(t) * 3)
        X.fillStyle = '#ff7ca6'
        for (let i = 0; i < 8; i++) {
          let a = t + i * 0.79
          X.beginPath()
          X.arc(x + Math.cos(a) * 42, HUD + G - 70 + Math.sin(a) * 20, 3, 0, 7)
          X.fill()
        }
        if (p > 0.74) {
          X.fillStyle = 'rgba(2,6,17,' + (p - 0.74) * 3.84 + ')'
          X.fillRect(0, HUD, 960, 476)
        }
        X.textAlign = 'left'
      }
      function finish(title, detail) {
        if (!active) return
        if (title === 'TWIN FOUND') {
          if (!finaleAt) {
            if (!twinsTouch()) return
            reunionScore = score
            reunionStart = performance.now()
            finaleAt = reunionStart + 2200
            player.vx = 0
            player.vy = 0
            burst(4684, G - 54, '#ff7ca6')
            burst(4684, G - 72, '#ffe680')
            say('Benny and Lenny found each other!', 2200)
            return
          }
          if (performance.now() < finaleAt) return
        }
        active = false
        let final = Math.max(0, score - elapsed() * 10)
        document.querySelector('#resultTitle').textContent = title
        document.querySelector('#resultEyebrow').textContent =
          title === 'TWIN FOUND' ? 'Together again' : 'Run complete'
        document.querySelector('#finalScore').textContent = final + ' PTS'
        document.querySelector('#finalDetail').textContent =
          detail +
          ' · ' +
          elapsed() +
          ' seconds · ' +
          routeProgress +
          '/3 pipes · ' +
          wrongPipes +
          ' wrong routes'
        document.querySelector('#result').hidden = false
      }
      function drawHud() {
        let sec = elapsed(),
          remain = Math.max(0, 150 - sec)
        X.fillStyle = 'rgba(4,13,32,.92)'
        X.fillRect(0, 0, 960, HUD)
        X.strokeStyle = '#75d9ee55'
        X.beginPath()
        X.moveTo(0, HUD - 0.5)
        X.lineTo(960, HUD - 0.5)
        X.stroke()
        X.font = 'bold 12px system-ui'
        X.fillStyle = '#69ddf0'
        X.fillText('SCORE', 22, 23)
        X.fillText('ROUTE', 315, 23)
        X.fillText('TIME REMAINING', 555, 23)
        X.fillText('HEARTS', 830, 23)
        X.font = 'bold 23px system-ui'
        X.fillStyle = '#effcff'
        X.fillText(String(Math.max(0, score - sec * 10)).padStart(4, '0') + ' PTS', 22, 51)
        X.fillText(routeProgress + ' / 3', 315, 51)
        X.fillStyle = remain < 20 ? '#ff5977' : '#effcff'
        X.fillText(
          String(Math.floor(remain / 60)).padStart(2, '0') +
            ':' +
            String(remain % 60).padStart(2, '0'),
          555,
          51
        )
        X.fillStyle = '#ff7890'
        X.fillText('♥'.repeat(player.hearts) + '♡'.repeat(3 - player.hearts), 830, 51)
      }
      function loop(now) {
        if (!active) return
        let dt = Math.min(34, now - (last || now))
        last = now
        step(dt)
        if (now >= noteUntil) note.classList.remove('visible')
        X.clearRect(0, 0, 960, 540)
        drawWorld()
        drawHud()
        if (flash > 0) {
          X.fillStyle = 'rgba(110,240,255,' + flash * 0.35 + ')'
          X.fillRect(0, 0, 960, 540)
          flash -= dt / 1000
        }
        requestAnimationFrame(loop)
      }
      function updateEliteThorns(dt) {
        if (!room) {
          const elite = enemies && enemies.find((e) => e.elite && e.alive)
          const now = performance.now()
          if (elite) {
            const orbit = now * 0.0034
            elite.x = 4449 + Math.cos(orbit) * 62
            elite.y = G - 28 - (Math.sin(orbit) + 1) * 13
            if (Math.abs(player.x - elite.x) < 390 && now >= elite.nextThorn) {
              const dir = player.x < elite.x ? -1 : 1
              thorns.push({ x: elite.x + 14, y: elite.y + 12, vx: dir * 5.8, life: 2.3 })
              elite.nextThorn = now + 1150
              burst(elite.x + 14, elite.y + 10, '#c694ff')
            }
          }
        }
        for (const t of thorns) {
          t.x += t.vx * (dt / 16.667)
          t.life -= dt / 1000
          if (
            t.life > 0 &&
            rect(
              { x: player.x, y: player.y, w: PW, h: PH },
              { x: t.x - 7, y: t.y - 4, w: 14, h: 8 }
            )
          ) {
            t.life = 0
            damage('A thorn from the shadow warden hit you')
          }
        }
        thorns = thorns.filter((t) => t.life > 0)
      }
      function resolvePipeSides(previousX) {
        const pipeXs = room ? [room.exit] : DOORS
        for (const px of pipeXs) {
          const left = px - 30,
            right = px + 30,
            top = G - 65
          if (player.y + PH <= top + 1 || player.y >= G) continue
          if (player.x + PW > left && player.x < right) {
            if (previousX + PW <= left) {
              player.x = left - PW
              player.vx = 0
            } else if (previousX >= right) {
              player.x = right
              player.vx = 0
            }
          }
        }
      }
      function drawThorns() {
        for (const t of thorns) {
          X.save()
          X.translate(t.x - camera, t.y + HUD)
          X.rotate(Math.atan2(0, t.vx))
          X.fillStyle = '#d6a7ff'
          X.beginPath()
          X.moveTo(8, 0)
          X.lineTo(-6, -4)
          X.lineTo(-3, 0)
          X.lineTo(-6, 4)
          X.closePath()
          X.fill()
          X.strokeStyle = '#5b2d83'
          X.lineWidth = 1
          X.stroke()
          X.restore()
        }
      }
      // The room exit is a full pipe interaction: walking onto its rim snaps Benny to
      // the top, so he can jump down/enter rather than treating it as a flat doorway.
      function settleOnRoomExitPipe() {
        if (!room) return
        const left = room.exit - 31,
          right = room.exit + 31,
          top = G - 65
        if (
          player.x + PW > left &&
          player.x < right &&
          player.y + PH >= top &&
          player.y + PH <= G + 2
        ) {
          player.y = top - PH
          player.vy = 0
          player.ground = true
        }
      }
      function loop(now) {
        if (!active) return
        let dt = Math.min(34, now - (last || now))
        last = now
        const previousX = player.x
        step(dt)
        resolvePipeSides(previousX)
        updateEliteThorns(dt)
        settleOnRoomExitPipe()
        if (finaleAt) {
          score = reunionScore
          const p = Math.min(1, (now - reunionStart) / 2200)
          player.x = 4656 + p * 165
          player.y = G - PH + Math.sin(now * 0.018) * 3
          player.vx = player.vy = 0
        }
        if (now >= noteUntil) note.classList.remove('visible')
        X.clearRect(0, 0, 960, 540)
        drawWorld()
        drawThorns()
        drawHud()
        drawReunionCheer()
        if (flash > 0) {
          X.fillStyle = 'rgba(110,240,255,' + flash * 0.35 + ')'
          X.fillRect(0, 0, 960, 540)
          flash -= dt / 1000
        }
        requestAnimationFrame(loop)
      }
      for (const b of document.querySelectorAll('[data-key]')) {
        let k = b.dataset.key
        b.addEventListener('pointerdown', (e) => {
          e.preventDefault()
          keys[k] = 1
          if (k === 'enter') tryEnter()
        })
        for (const e of ['pointerup', 'pointerleave', 'pointercancel'])
          b.addEventListener(e, () => (keys[k] = 0))
      }
      addEventListener('keydown', (e) => {
        if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = 1
        if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = 1
        if ([' ', 'ArrowUp', 'w', 'W'].includes(e.key)) keys.jump = 1
        if (['ArrowDown', 's', 'S', 'Enter'].includes(e.key)) {
          keys.enter = 1
          tryEnter()
        }
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' ', 'Enter'].includes(e.key))
          e.preventDefault()
      })
      addEventListener('keyup', (e) => {
        if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = 0
        if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = 0
        if (['ArrowDown', 's', 'S', 'Enter'].includes(e.key)) keys.enter = 0
      })
    </script>
    <script src="../bridge.js"></script>
  </body>
</html>
