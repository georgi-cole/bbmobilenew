<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FAB clean left-style pack</title>
<link rel="stylesheet" href="fab_clean_positioning.css">
<style>
body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;color:#fff;background:radial-gradient(circle at 50% 18%, rgba(108,132,255,.14), transparent 22%),linear-gradient(180deg,#060c1b 0%,#0c1430 55%,#09101f 100%)}
.wrap{max-width:1200px;margin:0 auto;padding:30px 20px 60px}
h1{text-align:center;margin:0 0 8px;font-size:28px}
p{text-align:center;opacity:.78;margin:0 0 24px}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px;margin-bottom:18px;backdrop-filter:blur(8px)}
</style>
</head>
<body>
<div class="wrap">
  <h1>FAB Clean Left-Style Pack</h1>
  <p>SVG + CSS pack positioned to match the left reference style.</p>
  <div class="card">
    <div class="fabClean">
      <img class="fabShell" src="fab_shell_clean.svg" alt="">
      <img class="fabPlay" src="fab_center_play_clean.svg" alt="">
      <img class="fabIcon social" src="fab_icon_social_clean.svg" alt="">
      <img class="fabIcon requests" src="fab_icon_requests_clean.svg" alt="">
      <img class="fabIcon stats" src="fab_icon_stats_clean.svg" alt="">
      <img class="fabIcon confessional" src="fab_icon_confessional_clean.svg" alt="">
    </div>
  </div>
</div>
</body>
</html>
