<svg xmlns="http://www.w3.org/2000/svg" width="188" height="188" viewBox="0 0 188 188" fill="none">
  <defs>
    <radialGradient id="play-core" cx="39%" cy="29%" r="80%">
      <stop stop-color="#8E74C7"/>
      <stop offset=".3" stop-color="#5F478E"/>
      <stop offset=".68" stop-color="#382759"/>
      <stop offset="1" stop-color="#171129"/>
    </radialGradient>
    <linearGradient id="play-rim" x1="47" y1="35" x2="141" y2="151" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF" stop-opacity=".9"/>
      <stop offset=".46" stop-color="#E3DCFF" stop-opacity=".44"/>
      <stop offset="1" stop-color="#C1B4FF" stop-opacity=".58"/>
