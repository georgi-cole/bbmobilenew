      <stop offset="1" stop-color="#4C3B9F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="inner-light" cx="0" cy="0" r="1" gradientTransform="translate(82 73) rotate(52) scale(65)">
      <stop stop-color="#EEE6FF" stop-opacity=".28"/>
      <stop offset=".36" stop-color="#B99FFF" stop-opacity=".105"/>
      <stop offset="1" stop-color="#6F55B6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glass-glint" cx="0" cy="0" r="1" gradientTransform="translate(69 57) rotate(48) scale(50)">
      <stop stop-color="#FFF" stop-opacity=".34"/>
      <stop offset=".24" stop-color="#F4EEFF" stop-opacity=".13"/>
      <stop offset=".7" stop-color="#D8CAFF" stop-opacity="0"/>
