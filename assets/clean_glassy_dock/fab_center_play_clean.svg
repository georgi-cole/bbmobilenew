      <stop offset=".42" stop-color="#8062E2" stop-opacity=".19"/>
      <stop offset="1" stop-color="#5D45B3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="axis-bloom" cx="50%" cy="50%" r="50%">
