  <circle cx="94" cy="94" r="55" fill="url(#inner-light)"/>
  <circle cx="94" cy="94" r="55" fill="url(#glass-glint)"/>
  <circle cx="94" cy="94" r="56" fill="url(#edge-depth)"/>
  <path d="M80 73L116 94L80 115V73Z" fill="#FFF" fill-opacity=".28" filter="url(#glyph-glow)"/>
  <path d="M80 73L116 94L80 115V73Z" fill="#FAF9FF" fill-opacity=".96"/>
