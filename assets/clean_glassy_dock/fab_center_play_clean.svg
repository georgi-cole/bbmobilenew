  <ellipse cx="94" cy="94" rx="66" ry="86" fill="url(#vertical-halo)" filter="url(#vertical-glow)"/>
  <ellipse cx="94" cy="33" rx="43" ry="14" fill="url(#axis-bloom)" filter="url(#axis-glow)"/>
